; Secuenciador de máquina serigráfica
; Puente HMI Wecon (Modbus RTU / RS422) <-> Octopus/Marlin (G-code)
;
; Código portable sobre el framework Arduino. El prototipo usa Teensy 4.1;
; para producción se preveía ESP32 (esp32dev) o STM32 (genericSTM32F411CE)
; con el mismo src/.
;
; Compilar y subir:  pio run -e teensy41 -t upload

[platformio]
default_envs = teensy41

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall

[env:teensy41]
platform = teensy
board = teensy41
