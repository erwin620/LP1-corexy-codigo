; Secuenciador de máquina serigráfica
; Puente HMI Wecon (Modbus RTU / RS422) <-> Octopus/Marlin (G-code)
;
; Estrategia: código portable en framework Arduino.
;   - Prototipo/banco: Teensy 4.1 (env por defecto)
;   - Producción:      ESP32 (WROOM-32E) o STM32 (descomentar env)
;
; Compilar/subir el prototipo:  pio run -e teensy41 -t upload

[platformio]
default_envs = teensy41

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall

; ---------- PROTOTIPO (lo que tienes hoy) ----------
[env:teensy41]
platform = teensy
board = teensy41

; ---------- PRODUCCIÓN (para después, mismo src/) ----------
;[env:esp32dev]
;platform = espressif32
;board = esp32dev
;
;[env:stm32]
;platform = ststm32
;board = genericSTM32F411CE
