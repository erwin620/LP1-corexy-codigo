# ============================================================
# macros_ciclo.cfg  -  Ciclo de impresion (Fase 1) + parametros del operador
# ------------------------------------------------------------
# Se carga desde printer.cfg con:  [include macros_ciclo.cfg]
#
# FLUJO DEL OPERADOR:
#   1) HOME_ALL   -> obligatorio. START NO funciona sin home.
#   2) (opcional) SET_CYCLE ...  -> lado de inicio, posiciones, velocidades, MARCO=SI/NO
#   3) START      -> arranca los ciclos (la maquina parte del home)
#
# CICLO DE LA CABEZA -- ORDEN REAL DEL CODIGO (feature 013, 2026-10-14):
#   1. EMBARRE: el stroke viaja al otro extremo, squeegee Y MARCO ARRIBA (en
#      vacio; el floatbar reparte la pintura sin tocar la prenda)  [_EMBARRAR]
#      En modo CARRUSEL esto corre A LA VEZ que el giro del plato.
#   0. (feature 011) el MARCO baja            <- solo si SET_CYCLE MARCO=SI
#   2. baja el squeegee
#   3. el stroke REGRESA con el squeegee abajo  = ESTA es la pasada que IMPRIME
#   4. el squeegee sube                         -> fin de un ciclo de cabeza
#   5. (feature 011) el MARCO sube            <- solo si SET_CYCLE MARCO=SI
#
#   FEATURE 015: con MARCO=SI el marco y el squeegee BAJAN a la vez (paso 0 + 2) y
#   SUBEN a la vez (paso 4 + 5; el squeegee sale primero un tramo corto,
#   squeegee_suelta). Es el comportamiento NORMAL, no una opcion: el secuencial
#   se quito el 2026-10-14 porque estaba mal. Ver _IMPRIMIR_PASADA.
#
#   OJO: hasta el 2026-09-17 estas lineas describian otro orden (baja ->
#   desliza -> sube -> regresa), que NO es lo que hace PRINT_CYCLE desde la
#   feature 001. Se corrigio al documentar la 011; el codigo no se toco.
#   (Desde la 013 los pasos 2-4 y el marco son _IMPRIMIR_PASADA; PRINT_CYCLE =
#   _EMBARRAR + _IMPRIMIR_PASADA, para modo CABEZA.)
#   En modo CABEZA el ciclo empieza y termina con el stroke en el lado de
#   inicio, squeegee y marco arriba. En CARRUSEL la cabeza descansa en el
#   extremo contrario (ya embarrada) entre pieza y pieza; START solo valida el
#   squeegee, asi que arrancar desde el lado de inicio sigue valiendo.
#
# !!! NO PROBADO EN MAQUINA !!!  Requiere HOME (topes aun NO fabricados).
#   Los valores por defecto son PLACEHOLDERS: ajustar con SET_CYCLE.
#
# Ejes:  X = squeegee (X+=arriba/seguro, X-=abajo/malla)   Y = stroke
#   (la polaridad de X se invirtio el 2026-09-03; el comentario que decia
#   "X-=arriba" quedo desfasado y se corrigio aqui el 2026-09-17. Comprobar
#   contra variables.cfg: squeegee_up=280 (positivo, arriba) / down=-54.
#   SET_CYCLE rechaza guardar un "arriba" que no quede por encima de "abajo".)
#   MARCO = tercer motor, independiente: manual_stepper, no cinematica.
# ============================================================


# --- Persistencia de parametros del operador -------------------------------
[save_variables]
filename: /home/aspe/printer_data/config/variables.cfg


# --- Estado interno del ciclo (NO llamar a mano) ---------------------------
[gcode_macro _CYCLE_STATE]
variable_stop_req: 0
variable_count: 0
variable_target: 0
variable_running: 0
gcode:
    # (vacio a proposito: solo guarda variables de estado)


# --- Homing (paso obligatorio antes de START) ------------------------------
[gcode_macro HOME_ALL]
description: Homea squeegee (X) y stroke (Y) por sensorless y deja modo absoluto
gcode:
    G28 X Y
    G90


# --- Subir el squeegee SIN BAJARLO NUNCA (interna) --------------------------
# 2026-09-25: con squeegee_up mal guardado desde AJUSTES (25, con el tope en
# 280) cada "subir el squeegee" lo BAJABA 255 unidades -- HOME_OP lo tiraba
# hacia la malla justo antes de girar el plato. Desde entonces TODO "subir"
# pasa por aqui: solo mueve X si squeegee_up esta MAS ARRIBA que la posicion
# actual. Si ya esta mas alto (p.ej. recien homeado en el tope), no se mueve.
# "Arriba" = el lado del home de X (siempre el lado seguro), asi
# que si la polaridad se vuelve a invertir esto sigue valiendo sin tocarlo.
[gcode_macro _SQUEEGEE_A_ARRIBA]
description: Sube el squeegee a squeegee_up solo si eso es SUBIR (interna, no llamar)
gcode:
    {% set v  = printer.save_variables.variables %}
    {% set sx = printer.configfile.settings.stepper_x %}
    {% set arriba = 1 if sx.position_endstop >= (sx.position_min + sx.position_max) / 2 else -1 %}
    {% set su = (v.squeegee_up) | default(10) | float %}
    {% set x  = printer.gcode_move.gcode_position.x | float %}
    {% if (su - x) * arriba > 0 %}
        G90
        G1 X{su} F{ (v.squeegee_speed) | default(7000) | float }
        M400
    {% endif %}


# --- Un ciclo de impresion (una estacion) ----------------------------------
# Orden real (ver la cabecera): viaja al otro extremo con el squeegee ARRIBA,
# baja el squeegee, REGRESA imprimiendo y sube el squeegee.
# NO se coloca antes en el lado de inicio: da por hecho que el ciclo anterior
# (o el HOME) lo dejo ahi con el squeegee arriba. START comprueba el
# squeegee (no la posicion del stroke).
[gcode_macro PRINT_CYCLE]
description: Un ciclo de la cabeza: embarra (marco arriba), baja marco y squeegee, regresa imprimiendo, sube
gcode:
    # FEATURE 013: el ciclo se partio en dos. El EMBARRE (stroke de ida, squeegee
    # arriba, el floatbar reparte la pintura) va PRIMERO y con el MARCO ARRIBA,
    # para no embarrar la prenda; el resto es la pasada que imprime. En modo
    # CABEZA se llaman seguidas (esta macro); en modo CARRUSEL el embarre va en
    # el tick del giro del plato y solo se llama a _IMPRIMIR_PASADA.
    _EMBARRAR
    _IMPRIMIR_PASADA


# --- Embarre: el stroke viaja al otro extremo, marco y squeegee ARRIBA -----
# (feature 013). En modo carrusel lo llama _INDEX_AVANZAR con EMBARRAR=1 para
# que corra A LA VEZ que el giro del plato. Idempotente: si la cabeza ya esta en
# y_end (estacion anterior sin prenda), el G1 no recorre nada.
[gcode_macro _EMBARRAR]
description: Embarre: stroke al extremo contrario con marco y squeegee arriba (interna)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set p_left  = (v.pos_left)       | default(0)    | float %}
    {% set p_right = (v.pos_right)      | default(100)  | float %}
    {% set side    = (v.start_side)     | default(0)    | int %}
    {% set st_f    = (v.stroke_speed)   | default(7000) | float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("EMBARRAR: la maquina no esta homeada; corre HOME_ALL primero.") }
    {% endif %}
    # side 0 = inicio IZQUIERDA (imprime izq->der) ; side 1 = inicio DERECHA (imprime der->izq)
    {% set y_end   = p_right if side == 0 else p_left %}
    G90
    G1 Y{y_end}    F{st_f}    ; 1. el stroke viaja al otro extremo, marco y squeegee ARRIBA (en vacio)


# --- Pasada que imprime: marco baja, squeegee baja, regresa, sube ----------
# Da por hecho que la cabeza esta en y_end (ya embarrada) con el squeegee y el
# marco ARRIBA.
[gcode_macro _IMPRIMIR_PASADA]
description: Pasada de impresion: baja marco y squeegee, stroke de vuelta, sube (interna)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set sq_up   = (v.squeegee_up)    | default(10)   | float %}
    {% set sq_down = (v.squeegee_down)  | default(90)   | float %}
    {% set p_left  = (v.pos_left)       | default(0)    | float %}
    {% set p_right = (v.pos_right)      | default(100)  | float %}
    {% set side    = (v.start_side)     | default(0)    | int %}
    {% set sq_f    = (v.squeegee_speed) | default(7000) | float %}
    {% set st_f    = (v.stroke_speed)   | default(7000) | float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("PRINT_CYCLE: la maquina no esta homeada; corre HOME_ALL primero.") }
    {% endif %}
    {% set y_start = p_left if side == 0 else p_right %}

    # --- FEATURE 015: marco y squeegee BAJAN a la vez y SUBEN a la vez ---------
    # Es el comportamiento NORMAL cuando el marco entra en el ciclo (MARCO=SI); ya no
    # hay interruptor (el secuencial se quito el 2026-10-14: estaba mal). El
    # movimiento secuencial de abajo ({% else %}) queda SOLO para dos casos: MARCO=NO
    # (no hay marco que mover a la vez) y la guarda de tiempos de aqui abajo.
    {% set juntos = (v.marco_en_ciclo) | default(0) | int == 1 %}
    {% if juntos %}
        # GUARDA POR TIEMPOS (red de seguridad, NO una opcion del operador): el marco
        # tiene que llegar abajo MUCHO antes de que el squeegee llegue a la malla (el
        # contacto es al final de su recorrido). Si no es < 60 % del tiempo del
        # squeegee (p.ej. por bajar marco_speed en AJUSTES), esa pieza va en
        # secuencial y se avisa: nunca se arriesga la malla.
        {% set m_d = (v.marco_abajo) | default(110)  | float %}
        {% set m_v = (v.marco_speed) | default(1000) | float %}
        {% set m_a = (v.marco_accel) | default(3000) | float %}
        {% set t_marco = (m_d / m_v + m_v / m_a) if m_d >= (m_v * m_v / m_a) else 2.0 * ((m_d / m_a) ** 0.5) %}
        {% set x_now = printer.gcode_move.gcode_position.x | float %}
        {% set t_sq = ((x_now - sq_down) | abs) / (sq_f / 60.0) %}
        {% if t_marco >= 0.6 * t_sq %}
            M118 AVISO: el marco tardaria {'%.2f' % t_marco}s y el squeegee {'%.2f' % t_sq}s en bajar: no es seguro bajarlos a la vez. Esta pieza va en secuencial (sube marco_speed o baja squeegee_speed).
            {% set juntos = false %}
        {% endif %}
    {% endif %}
    {% if juntos %}
        # "Arriba" = el lado del home de X (igual que _SQUEEGEE_A_ARRIBA): el signo no se asume.
        {% set sx = printer.configfile.settings.stepper_x %}
        {% set arriba = 1 if sx.position_endstop >= (sx.position_min + sx.position_max) / 2 else -1 %}
        {% set suelta = (v.squeegee_suelta) | default(10) | float %}
        {% set x_suelta = sq_down + arriba * suelta %}
        {% if (x_suelta - sq_up) * arriba > 0 %}
            {% set x_suelta = sq_up %}
        {% endif %}
        G90
        # BAJADA: el marco se encola PRIMERO (SYNC=0) y el G1 arranca en el mismo instante.
        _MARCO_BAJAR SYNC=0
        G1 X{sq_down}  F{sq_f}    ; 2. baja el squeegee, a la vez que el marco
        _MARCO_ESPERAR_ABAJO
        G1 Y{y_start}  F{st_f}    ; 3. stroke REGRESA imprimiendo
        # SUBIDA: el squeegee SALE PRIMERO un tramo corto (suelta la malla) y DESPUES
        # arranca el marco, mientras el squeegee sigue subiendo. El MANUAL_STEPPER arranca
        # al final de la cola del toolhead, o sea tras el tramo corto.
        G1 X{x_suelta} F{sq_f}    ; 4a. el squeegee suelta la malla
        _MARCO_SUBIR SYNC=0
        G1 X{sq_up}    F{sq_f}    ; 4b. el squeegee termina de subir, a la vez que el marco
        _MARCO_ESPERAR_ARRIBA
    {% else %}
        G90
        # --- el marco BAJA (feature 011), DESPUES del embarre (feature 013) ---
        # NO HACE NADA mientras no se active con SET_CYCLE MARCO=SI (default: NO).
        _MARCO_BAJAR
        G1 X{sq_down}  F{sq_f}    ; 2. baja el squeegee
        G1 Y{y_start}  F{st_f}    ; 3. stroke REGRESA imprimiendo a posicion absoluta (sin stall; home unico al START)
        G1 X{sq_up}    F{sq_f}    ; 4. el squeegee sube
        # --- el marco SUBE al terminar la pieza (feature 011) ---
        # Va DESPUES de que suba el squeegee, para que al acabar la pasada el
        # marco SIEMPRE quede arriba: asi el plato nunca indexa con el marco abajo.
        _MARCO_SUBIR
    {% endif %}



# --- Arranque del ciclo (REQUIERE HOME previo) -----------------------------
# START            -> continuo hasta que se pulse STOP
# START CYCLES=5   -> corre 5 ciclos y para solo
[gcode_macro START]
description: Arranca el ciclo (REQUIERE HOME). CYCLES=0 continuo, N=lote
gcode:
    # SIMULACION: la cabeza de impresion TODAVIA NO ESTA INSTALADA (faltan bandas
    # y mecanica, 2026-08-18). Con simular_impresion=1 el bucle del carrusel
    # corre entero pero llama a _PRINT_CYCLE_SIMULADO en vez de a PRINT_CYCLE:
    # el PLATO se mueve de verdad, la CABEZA no se toca. Sirve para validar toda
    # la logica del ciclo (indexado, sensor, conteo, saltos, STOP) en paralelo al
    # desarrollo mecanico, en vez de esperar a que llegue la cabeza.
    {% set sim  = (printer.save_variables.variables.simular_impresion) | default(0) | int %}
    # MODO: 0 = solo cabeza (el de siempre)  ·  1 = carrusel de estaciones.
    # Vive en save_variables, asi que la eleccion del operador SOBREVIVE a los
    # reinicios, igual que el resto de sus parametros. Se cambia con
    # SET_CYCLE MODO=CARRUSEL / MODO=CABEZA y se ve en SHOW_CYCLE.
    {% set modo = (printer.save_variables.variables.modo_carrusel) | default(0) | int %}

    # El home de la CABEZA solo se exige si de verdad se va a mover la cabeza.
    # En simulacion no se toca ningun eje de la cinematica, asi que exigirlo
    # bloquearia la prueba por un eje que ni existe todavia.
    {% if sim == 0 and ('x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes) %}
        { action_raise_error("START bloqueado: primero haz HOME (boton HOME_ALL).") }
    {% endif %}
    # SIMULAR solo tiene sentido con el carrusel: en modo solo cabeza el bucle es
    # _cycle_loop, que llama a PRINT_CYCLE directamente y no simula nada.
    {% if sim == 1 and modo == 0 %}
        { action_raise_error("SIMULAR=1 no aplica al modo SOLO CABEZA (ahi no hay nada que simular). Pon SET_CYCLE MODO=CARRUSEL, o SET_CYCLE SIMULAR=0.") }
    {% endif %}

    # EL HOME DEL PLATO SE EXIGE SIEMPRE, tambien en simulacion: el plato SI se
    # mueve de verdad. Sin home, _INDEX.station no significa nada y el ciclo
    # indexaria sobre un cero inventado.
    {% if modo == 1 and printer['gcode_macro _INDEX'].homed | int != 1 %}
        { action_raise_error("START bloqueado en modo CARRUSEL: el plato no tiene HOME. Haz INDEX_HOME (o HOME_OP, que ya lo encadena).") }
    {% endif %}
    # EL HOME DEL MARCO SE EXIGE SOLO SI EL MARCO ENTRA EN EL CICLO (feature 011).
    # Se comprueba AQUI, al arrancar, y no solo dentro de _MARCO_BAJAR: fallar al
    # pulsar START es un aviso barato; fallar en la primera pieza deja el lote a
    # medias. La guarda de _MARCO_BAJAR se queda igualmente como red de seguridad
    # (el home se puede perder DURANTE el lote con un M84).
    # En simulacion no se exige: ahi no se mueve nada de la cabeza ni del marco.
    {% if sim == 0 and (printer.save_variables.variables.marco_en_ciclo) | default(0) | int == 1 and printer['gcode_macro _MARCO'].homed | int != 1 %}
        { action_raise_error("START bloqueado: el marco entra en el ciclo (MARCO=SI) pero NO tiene HOME. Haz MARCO_HOME (o HOME_OP, que ya lo encadena). Si no quieres el marco en el ciclo: SET_CYCLE MARCO=NO.") }
    {% endif %}

    # ==================================================================
    # LA MAQUINA QUEDO EN POSICION DE MANUAL  (feature 012)
    # ==================================================================
    # La pantalla MANUAL mueve los mismos ejes que el ciclo, asi que puede
    # dejar la maquina a medio ciclo: el marco abajo, o el squeegee abajo.
    # Arrancar el automatico desde ahi es exactamente el accidente que hay
    # que evitar -- el primer movimiento de PRINT_CYCLE es un stroke, y con
    # el squeegee abajo eso es un arrastre a velocidad de impresion.
    #
    # SE BLOQUEA, NO SE CORRIGE Y NO SE INVALIDA EL HOME. El home sigue
    # siendo verdadero (nadie movio nada a mano), asi que ponerlo a 0 seria
    # mentir, y corregir la posicion solo seria un movimiento que el
    # operador no pidio. Se rechaza y se le dice que hacer.
    #
    # SOLO BLOQUEA CON CERTEZA (pos == 2). Con la posicion DESCONOCIDA se
    # arranca igual que siempre: si no, una maquina con MARCO=NO y el cuadro
    # bajado a mano quedaria bloqueada tras cada FIRMWARE_RESTART, donde pos
    # vuelve a 0, sin ninguna forma de desbloquearla.
    {% if sim == 0 and printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("START bloqueado: el MARCO quedo ABAJO (modo manual). Subelo con MARCO ARRIBA, o pulsa HOME.") }
    {% endif %}
    # El squeegee SI se puede leer de verdad (X es eje de la cinematica, no un
    # manual_stepper). Se usa gcode_position porque es el sistema de
    # coordenadas en el que estan escritos los G1 X de PRINT_CYCLE.
    {% if sim == 0 and 'x' in printer.toolhead.homed_axes %}
        {% set vv = printer.save_variables.variables %}
        {% set su = (vv.squeegee_up)   | default(10) | float %}
        {% set sd = (vv.squeegee_down) | default(90) | float %}
        {% set xx = printer.gcode_move.gcode_position.x | float %}
        # CERCANIA RELATIVA, no igualdad con squeegee_up: el dia que
        # squeegee_up deje de coincidir con position_endstop (hoy los dos son
        # 280) una comparacion exacta bloquearia START justo despues de homear,
        # y el operador se quedaria en un bucle de "pulsa HOME" sin salida.
        # Ademas asi es agnostica al signo, que en esta maquina ya se invirtio
        # una vez (2026-09-03).
        {% if su != sd and ((xx - sd) | abs) < ((xx - su) | abs) %}
            { action_raise_error("START bloqueado: el SQUEEGEE quedo ABAJO (modo manual). Subelo con SQUEEGEE ARRIBA en la pantalla MANUAL, o pulsa HOME.") }
        {% endif %}
    {% endif %}

    # FEATURE 014: ANTES de arrancar, la cabeza va al lado de inicio (y_start; con
    # start_side=0 es pos_left = Y0, donde ya la deja el HOME -> normalmente no se
    # mueve). Asegura que el primer embarre recorra entero aunque la cabeza se haya
    # quedado en el otro extremo (p.ej. tras un STOP en una estacion sin prenda).
    # Squeegee arriba primero (nunca lo baja); el marco ya esta arriba (pos==2 bloquea).
    {% if sim == 0 %}
        {% set vs = printer.save_variables.variables %}
        _SQUEEGEE_A_ARRIBA
        G90
        G1 Y{ (vs.pos_left | default(0) | float) if (vs.start_side | default(0) | int) == 0 else (vs.pos_right | default(100) | float) } F{ (vs.stroke_speed) | default(7000) | float }
        M400
    {% endif %}

    {% set n = params.CYCLES | default(0) | int %}
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=count VALUE=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=target VALUE={n}
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=1

    {% if modo == 1 %}
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=saltadas VALUE=0
        {% if sim == 1 %}
            M117 CARRUSEL SIMULADO (no imprime)
            M118 *** SIMULACION: el plato indexa de verdad, la CABEZA NO SE MUEVE. No sale ninguna impresion. Quitar con SET_CYCLE SIMULAR=0. ***
        {% elif n == 0 %}
            M117 Carrusel continuo (STOP para parar)
        {% else %}
            M117 Carrusel: {n} piezas
        {% endif %}
        # CYCLES cuenta PIEZAS IMPRESAS, no avances: una estacion sin prenda se
        # salta y NO consume cuota.
        #
        # EL CICLO EMPIEZA AVANZANDO, no imprimiendo. Es decision explicita: al
        # pulsar START el plato indexa primero y trae una paleta a pintado. Si
        # hubiera una prenda ya debajo del squeegee, pasa de largo sin imprimir.
        # La alternativa (imprimir primero si part=1) obligaria a fiarse de un
        # flag que puede venir de un avance manual anterior -> fragil.
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0.5
    {% else %}
        {% if n == 0 %}
            M117 Ciclo continuo (STOP para parar)
        {% else %}
            M117 Corriendo {n} ciclos
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0.5
    {% endif %}


# --- Bucle interno: corre 1 ciclo, revisa STOP, reagenda -------------------
[delayed_gcode _cycle_loop]
gcode:
    {% set s = printer['gcode_macro _CYCLE_STATE'] %}
    {% if s.stop_req|int == 0 and (s.target|int == 0 or s.count|int < s.target|int) %}
        PRINT_CYCLE
        M400
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=count VALUE={s.count|int + 1}
        UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0.2
    {% else %}
        # running=0 PRIMERO, y despues el movimiento de cierre: misma regla que el
        # _carousel_loop (arreglado alli el 2026-08-18, aqui el 2026-10-08). Si la
        # subida fallara, el estado ya queda limpio y no bloquea START.
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
        _SQUEEGEE_A_ARRIBA
        M117 Terminado ({s.count|int} ciclos)
    {% endif %}


# ==========================================================================
# MODO CARRUSEL - bucle de dos pasos (feature 005)
# ==========================================================================
# PRINT_CYCLE y _cycle_loop NO SE TOCAN: el modo "solo cabeza" sigue siendo
# exactamente el que estaba validado. Este bucle es UNO NUEVO, en paralelo, y
# reutiliza PRINT_CYCLE tal cual para la parte de impresion.
#
# CICLO POR ESTACION:
#   1. avanzar una estacion  (el squeegee sube solo dentro de _INDEX_AVANZAR)
#   2. leer el flag del sensor de parte:
#        hay prenda -> PRINT_CYCLE  y  count += 1
#        no hay     -> saltar, sin imprimir y SIN contar
#
# ---- POR QUE SON DOS PASOS Y NO UNO -------------------------------------
# 🚨 ESTA ES LA RAZON DE SER DE TODO EL DISENO, no una preferencia de estilo.
# El press_gcode de [gcode_button part_sensor] llama a run_script(), que TOMA EL
# MUTEX DEL GCODE. Mientras una macro corre el mutex esta ocupado, asi que la
# deteccion del sensor SE ENCOLA y solo se despacha AL TERMINAR el comando de
# nivel superior. Medido: 14 pares press/release durante un giro de 36 s
# salieron TODOS con marca t = +36.5 s.
# >> Si el avance y la lectura estuvieran en el mismo tick, se leeria el flag
#    VIEJO (ademas de que todo el jinja de una macro se evalua antes de ejecutar
#    su primer comando). El ciclo imprimiria desfasado una estacion.
# >> Por eso: tick A avanza, el mutex se libera al acabar el tick, entra el
#    press_gcode y arma part, y el tick B lo lee ya fresco.
# La variable 'fase' es la que alterna A/B entre disparos del temporizador.
#
# ---- VALIDADO A MANO ANTES DE ESCRIBIRLO --------------------------------
# El 2026-08-18, con dos prendas en paletas opuestas, se corrio exactamente esta
# secuencia a mano (avanzar -> leer -> avanzar -> leer) a 180 grados/s y dio
# 1·0·1·0·1, un disparo por prenda. Este bucle es esa secuencia automatizada.
# ==========================================================================

# --- Estado del bucle del carrusel (NO llamar a mano) ---------------------
[gcode_macro _CAROUSEL]
description: Estado del bucle del carrusel (interna, no llamar)
# fase 0 = toca AVANZAR   ·   fase 1 = toca LEER EL FLAG Y DECIDIR
variable_fase: 0
# Estaciones saltadas por no llevar prenda. Solo diagnostico: el contador de
# produccion es _CYCLE_STATE.count, que cuenta PIEZAS IMPRESAS.
variable_saltadas: 0
gcode:
    # (vacio a proposito: solo guarda estado)


# --- Bucle del carrusel ---------------------------------------------------
[delayed_gcode _carousel_loop]
gcode:
    {% set s = printer['gcode_macro _CYCLE_STATE'] %}
    {% set c = printer['gcode_macro _CAROUSEL'] %}
    {% set fin = (s.stop_req | int == 1) or (s.target | int != 0 and s.count | int >= s.target | int) %}

    {% if fin and c.fase | int == 0 %}
        # Se sale SOLO en fase 0, o sea con la estacion en curso ya terminada.
        # Asi STOP "termina la estacion en curso" en vez de cortar a medias y
        # dejar el squeegee abajo sobre la prenda.
        # 🐞 ORDEN DELIBERADO, corregido el 2026-08-18: running=0 VA PRIMERO.
        # La primera version subia el squeegee con un G1 X crudo (copiado del
        # _cycle_loop de la cabeza) y LUEGO ponia running=0. Sin la cabeza
        # homeada ese G1 aborta con "Must home axis first", el script muere
        # antes de llegar al SET_GCODE_VARIABLE y el ciclo se queda COLGADO en
        # running=1 para siempre, bloqueando START e INDEX_NEXT.
        # Regla general: el estado se cierra ANTES de cualquier movimiento
        # cosmetico de cierre. Un fallo al aparcar no debe dejar el estado sucio.
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
        # Y la subida va por _INDEX_SQUEEGEE_ARRIBA, que YA tiene la guarda de
        # "solo si X esta homeado, si no avisa y sigue" - en vez de duplicarla mal.
        _INDEX_SQUEEGEE_ARRIBA
        M117 Carrusel terminado ({s.count | int} piezas)
        M118 Carrusel terminado: {s.count | int} pieza(s) impresa(s), {c.saltadas | int} estacion(es) saltada(s) por no llevar prenda.

    {% elif c.fase | int == 0 %}
        # ---------- PASO A: AVANZAR UNA ESTACION ----------
        # _INDEX_AVANZAR_UNA y no INDEX_NEXT: esta macro corre con running=1 y
        # la guarda de ciclo de INDEX_NEXT nos bloquearia a nosotros mismos.
        # Dentro sube el squeegee y limpia el flag del sensor ANTES de mover.
        # FEATURE 013: con la cabeza real (SIMULAR=0) el EMBARRE corre A LA VEZ que
        # el giro (marco y squeegee arriba, no se estorban). Se embarra SIEMPRE:
        # aun no se sabe si la estacion que llega trae prenda. Si no la trae, la
        # cabeza queda en y_end y el siguiente embarre no recorre nada.
        # FEATURE 014: con ESPERA DERECHA (espera_derecha=1, boton del MENU) el embarre
        # NO va con el giro: la cabeza se queda QUIETA en el lado de inicio (Y0) mientras
        # gira el plato, y el embarre es el primer paso de la pieza (paso B, tras el
        # giro, solo si hay prenda). NO cambia el sentido del stroke: eso es start_side.
        {% if (printer.save_variables.variables.simular_impresion) | default(0) | int == 1
              or (printer.save_variables.variables.espera_derecha) | default(0) | int == 1 %}
            _INDEX_AVANZAR_UNA
        {% else %}
            _INDEX_AVANZAR_UNA EMBARRAR=1
        {% endif %}
        M400
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=1
        # 0.4 s y no 0.2: este es el hueco en el que el mutex queda libre y
        # entra el press_gcode encolado del sensor. Es el unico retardo del
        # bucle que NO se puede recortar sin romper la deteccion.
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0.4

    {% else %}
        # ---------- PASO B: LEER EL FLAG Y DECIDIR ----------
        # El flag ya esta fresco: el press_gcode entro en el hueco de arriba.
        {% if printer['gcode_macro _INDEX'].part | int == 1 %}
            {% if (printer.save_variables.variables.simular_impresion) | default(0) | int == 1 %}
                _PRINT_CYCLE_SIMULADO
            {% else %}
                # FEATURE 014: ESPERA DERECHA -> el embarre (Y0 -> extremo contrario, marco
                # y squeegee arriba) va AQUI, antes de bajar el cuadro, como paso extra.
                # Estacion sin prenda: no entra aqui y la cabeza se queda en Y0.
                {% if (printer.save_variables.variables.espera_derecha) | default(0) | int == 1 %}
                    _EMBARRAR
                {% endif %}
                _IMPRIMIR_PASADA
            {% endif %}
            M400
            SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=count VALUE={ s.count | int + 1 }
        {% else %}
            SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=saltadas VALUE={ c.saltadas | int + 1 }
            M118 Estacion {printer['gcode_macro _INDEX'].station} sin prenda: no se imprime.
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0.2
    {% endif %}


# --- Impresion SIMULADA (mientras no este la cabeza) ----------------------
# Ocupa el sitio de PRINT_CYCLE en el bucle del carrusel cuando
# simular_impresion = 1. NO toca ningun eje de la cinematica.
#
# La espera NO es decorativa: hace que el ritmo del bucle se parezca al real, y
# sobre todo mantiene el mutex ocupado el tiempo que lo ocuparia una impresion.
# Asi la prueba ejercita de verdad el encolado del sensor, que es la parte fragil.
[gcode_macro _PRINT_CYCLE_SIMULADO]
description: Sustituto de PRINT_CYCLE mientras la cabeza no esta instalada
gcode:
    M118 [SIMULADO] Aqui iria PRINT_CYCLE en la estacion {printer['gcode_macro _INDEX'].station}. La cabeza NO se ha movido.
    G4 P2000
    M400


# --- Recuperacion si un bucle muere a medias ------------------------------
# Si PRINT_CYCLE o el avance abortan (se pierde el home, error cualquiera), el
# script del tick muere ANTES de reagendar y el bucle se detiene solo - pero
# running se queda en 1, y entonces START, INDEX_NEXT y compania quedan
# bloqueados "porque hay un ciclo en marcha" que ya no existe.
# Le pasa igual al _cycle_loop de la cabeza: es deuda preexistente.
# Esto lo desatasca sin tener que reiniciar el firmware.
[gcode_macro CYCLE_RESET]
description: Desatasca el estado del ciclo si un bucle murio a medias
gcode:
    UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=0
    SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
    M118 Estado del ciclo reiniciado. OJO: esto NO homea; comprueba la posicion antes de arrancar.


# ==========================================================================
# INVALIDACION DEL HOME AL DESENERGIZAR  (deuda tecnica #8/#12, cerrada 2026-08-18)
# ==========================================================================
# EL FALLO QUE ESTO ARREGLA:
#   M84 desenergiza los [manual_stepper] -> el plato y el screen se pueden girar
#   A MANO -> pero _INDEX.homed y _SCREEN.homed seguian diciendo 1. El operador
#   podia "apagar" (el boton APAGAR de la UI manda precisamente M84), mover el
#   plato, dar START, y el ciclo indexaba sobre un cero QUE YA NO EXISTIA.
#   Sin E-stop.
#
# POR QUE HACIA FALTA HACERLO A MANO:
#   Klipper SI limpia homed_axes de los ejes de la cinematica al desenergizar
#   (la cinematica escucha el evento stepper_enable:motor_off y borra sus
#   limites). Pero los [manual_stepper] NO tienen cinematica, y su "home" vive
#   en variables de macro que Klipper no conoce. El hueco era exactamente ese.
#
# COBERTURA: M84 y M18 (los dos los registra el mismo modulo de Klipper) y el
#   [idle_timeout] de printer.cfg, que acaba en M84 y por tanto entra aqui.
# ==========================================================================

[gcode_macro _INVALIDAR_HOMES]
description: Marca plato, screen y marco como SIN home (interna, no llamar)
gcode:
    {% set idx = printer['gcode_macro _INDEX'].homed | int %}
    {% set scr = printer['gcode_macro _SCREEN'].homed | int %}
    {% set mar = printer['gcode_macro _MARCO'].homed | int %}

    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=moving VALUE=0
    # El M84 desenergiza TODO, asi que el motor del index queda suelto: hay que
    # bajar tambien energizado o el boton DESHABILITAR de la pantalla diria
    # "energizado" con el motor libre (feature 007). Este es uno de los ocho
    # sitios del embudo del enable; ver la nota en macros_index.cfg.
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=energizado VALUE=0
    # Del screen se toca SOLO 'homed', que es la deuda documentada. NO se toca
    # 'talla' a proposito: la feature 004 esta cerrada y validada, y la UI
    # deberia decidir por 'homed'. Con homed=0 la talla ya es "desconocida".
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=0
    # El marco entra aqui por lo mismo (feature 011): con el motor suelto se
    # puede mover a mano O CAERSE POR GRAVEDAD, asi que su cero deja de valer.
    # Sin esto, tras un M84 el ciclo bajaria 110 unidades desde una referencia
    # que ya no existe -- contra la paleta, y sin E-stop.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    # Y la POSICION pasa a DESCONOCIDA (feature 012) por la misma razon: con el
    # motor suelto el marco se puede caer por gravedad, asi que lo ultimo que se
    # le mando deja de describir donde esta.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # El aviso solo si habia algo que perder: si ya estaban sin home, callar.
    {% if idx == 1 or scr == 1 or mar == 1 %}
        M118 Motores desenergizados: SE PIERDE EL HOME del plato, del screen y del marco. Hay que volver a homear antes de indexar o imprimir.
    {% endif %}


# --- Lo que se hace ANTES de desenergizar, venga por donde venga ------------
[gcode_macro _ANTES_DE_APAGAR_MOTORES]
description: Cierra el ciclo e invalida homes antes de un M84/M18 (interna)
gcode:
    # Si habia un ciclo en marcha hay que cerrarlo AQUI. Si no, al invalidar los
    # homes el siguiente tick del bucle abortaria ("el carrusel no tiene HOME")
    # y moriria ANTES de reagendar, dejando running=1 colgado y bloqueando todo.
    # Se cierra en orden para que el estado quede coherente: sin bucle armado,
    # sin ciclo en marcha, y sin homes.
    {% if printer['gcode_macro _CYCLE_STATE'].running | int == 1 %}
        UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=0
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
        M118 AVISO: habia un ciclo EN MARCHA y se ha cortado al desenergizar los motores. La posicion se ha perdido: hay que homear antes de arrancar otra vez.
    {% endif %}
    _INVALIDAR_HOMES


# --- Interceptores ---------------------------------------------------------
# Mismo patron que el override de G28 en printer.cfg: rename_existing guarda el
# comando original y la macro lo llama al final.
[gcode_macro M84]
rename_existing: M84.1
description: Desenergiza los motores E INVALIDA los homes de plato y screen
gcode:
    _ANTES_DE_APAGAR_MOTORES
    M84.1 {rawparams}

[gcode_macro M18]
rename_existing: M18.1
description: Alias de M84 (Klipper registra los dos) - misma invalidacion
gcode:
    _ANTES_DE_APAGAR_MOTORES
    M18.1 {rawparams}


# --- Parar -----------------------------------------------------------------
[gcode_macro STOP]
description: Detiene al terminar el ciclo en curso (el squeegee queda arriba)
gcode:
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=1
    M117 STOP: parando al terminar el ciclo...


# --- Ajustar y guardar parametros del operador -----------------------------
# Ejemplos:
#   SET_CYCLE START_SIDE=DERECHA
#   SET_CYCLE POS_LEFT=5 POS_RIGHT=190 STROKE_SPEED=8000
[gcode_macro SET_CYCLE]
description: Guarda parametros del ciclo (se conservan tras reiniciar)
gcode:
    # GUARDA DE ALTURAS DEL SQUEEGEE (2026-09-25): se valida el PAR resultante
    # (lo nuevo + lo ya guardado) ANTES de guardar nada. Un raise en el jinja
    # aborta la macro entera, asi que no queda un valor a medio guardar.
    {% set vv = printer.save_variables.variables %}
    {% set sx = printer.configfile.settings.stepper_x %}
    {% set arriba = 1 if sx.position_endstop >= (sx.position_min + sx.position_max) / 2 else -1 %}
    {% set nu = (params.SQUEEGEE_UP   | default(vv.squeegee_up   | default(10))) | float %}
    {% set nd = (params.SQUEEGEE_DOWN | default(vv.squeegee_down | default(90))) | float %}
    {% for val in [nu, nd] %}
        {% if val < sx.position_min or val > sx.position_max %}
            { action_raise_error("Altura de squeegee " ~ val ~ " fuera de los limites de X (" ~ sx.position_min ~ " a " ~ sx.position_max ~ "). No se ha guardado nada.") }
        {% endif %}
    {% endfor %}
    {% if (nu - nd) * arriba <= 0 %}
        { action_raise_error("Squeegee ARRIBA (" ~ nu ~ ") tiene que quedar mas arriba que squeegee ABAJO (" ~ nd ~ "). En esta maquina arriba = numeros " ~ ("MAS ALTOS" if arriba == 1 else "MAS BAJOS") ~ " (tope de arriba en " ~ sx.position_endstop ~ "). No se ha guardado nada.") }
    {% endif %}
    # GUARDA DE POSICIONES DEL STROKE (2026-10-08). Sin ella, un POS_LEFT o
    # POS_RIGHT fuera de los limites de Y lo rechazaba Klipper EN EL PASO 3 de
    # PRINT_CYCLE -- con el squeegee YA ABAJO sobre la malla, el marco abajo y
    # running=1 colgado. Se valida el PAR resultante, igual que las alturas.
    {% set sy   = printer.configfile.settings.stepper_y %}
    {% set ymin = sy.position_min | default(0) | float %}
    {% set ymax = sy.position_max | float %}
    {% set nl = (params.POS_LEFT  | default(vv.pos_left  | default(0)))   | float %}
    {% set nr = (params.POS_RIGHT | default(vv.pos_right | default(100))) | float %}
    {% for val in [nl, nr] %}
        {% if val < ymin or val > ymax %}
            { action_raise_error("Posicion de stroke " ~ val ~ " fuera de los limites de Y (" ~ ymin ~ " a " ~ ymax ~ "). No se ha guardado nada.") }
        {% endif %}
    {% endfor %}
    {% if nl == nr %}
        { action_raise_error("POS_LEFT y POS_RIGHT valen lo mismo (" ~ nl ~ "): el stroke no recorreria nada. No se ha guardado nada.") }
    {% endif %}
    {% if 'SQUEEGEE_UP'    in params %}SAVE_VARIABLE VARIABLE=squeegee_up    VALUE={params.SQUEEGEE_UP|float}{% endif %}
    {% if 'SQUEEGEE_DOWN'  in params %}SAVE_VARIABLE VARIABLE=squeegee_down  VALUE={params.SQUEEGEE_DOWN|float}{% endif %}
    {% if 'POS_LEFT'       in params %}SAVE_VARIABLE VARIABLE=pos_left       VALUE={params.POS_LEFT|float}{% endif %}
    {% if 'POS_RIGHT'      in params %}SAVE_VARIABLE VARIABLE=pos_right      VALUE={params.POS_RIGHT|float}{% endif %}
    {% if 'SQUEEGEE_SPEED' in params %}SAVE_VARIABLE VARIABLE=squeegee_speed VALUE={params.SQUEEGEE_SPEED|float}{% endif %}
    {% if 'STROKE_SPEED'   in params %}SAVE_VARIABLE VARIABLE=stroke_speed   VALUE={params.STROKE_SPEED|float}{% endif %}
    {% if 'SIMULAR'        in params %}
        {% if params.SIMULAR | int == 1 %}
            SAVE_VARIABLE VARIABLE=simular_impresion VALUE=1
        {% else %}
            SAVE_VARIABLE VARIABLE=simular_impresion VALUE=0
        {% endif %}
    {% endif %}
    {% if 'MODO'           in params %}
        {% set md = params.MODO | string | upper %}
        {% if md in ['CARRUSEL','CARROUSEL','C','1'] %}
            SAVE_VARIABLE VARIABLE=modo_carrusel VALUE=1
        {% elif md in ['CABEZA','HEAD','SOLO','0'] %}
            SAVE_VARIABLE VARIABLE=modo_carrusel VALUE=0
        {% else %}
            { action_raise_error("MODO solo admite CARRUSEL o CABEZA (recibido: " ~ params.MODO ~ "). No se ha cambiado nada.") }
        {% endif %}
    {% endif %}
    {% if 'START_SIDE'     in params %}
        {% set sd = params.START_SIDE|string|upper %}
        {% if sd in ['IZQUIERDA','IZQ','LEFT','L','I','0'] %}
            SAVE_VARIABLE VARIABLE=start_side VALUE=0
        {% else %}
            SAVE_VARIABLE VARIABLE=start_side VALUE=1
        {% endif %}
    {% endif %}
    # --- SUBIDA SIMULTANEA DE MARCO Y SQUEEGEE (feature 015) ---
    # Tramo corto que sube el squeegee ANTES de que arranque el marco al subir. En
    # unidades de X. Tiene que ser > 0 y menor que el recorrido entre abajo y arriba.
    {% if 'SQUEEGEE_SUELTA' in params %}
        {% set ss = params.SQUEEGEE_SUELTA | float %}
        {% if ss <= 0 or ss >= ((nu - nd) | abs) %}
            { action_raise_error("SQUEEGEE_SUELTA debe ser mayor que 0 y menor que el recorrido del squeegee (" ~ ((nu - nd) | abs) ~ " unidades). Recibido: " ~ ss ~ ". No se ha guardado nada.") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=squeegee_suelta VALUE={ss}
    {% endif %}
    # --- ESPERA DEL STROKE (feature 014) ---
    # ESPERA=IZQUIERDA (0): el embarre corre a la vez que el giro del plato (013).
    # ESPERA=DERECHA   (1): la cabeza espera en el lado de inicio durante el giro y
    #                       el embarre se hace despues, solo si hay prenda.
    # No cambia el sentido del stroke (eso es START_SIDE).
    {% if 'ESPERA' in params %}
        {% set es = params.ESPERA | string | upper %}
        {% if es in ['IZQUIERDA','IZQ','LEFT','L','I','0'] %}
            SAVE_VARIABLE VARIABLE=espera_derecha VALUE=0
        {% elif es in ['DERECHA','DER','RIGHT','R','D','1'] %}
            SAVE_VARIABLE VARIABLE=espera_derecha VALUE=1
        {% else %}
            { action_raise_error("ESPERA solo admite IZQUIERDA o DERECHA (recibido: " ~ params.ESPERA ~ "). No se ha cambiado nada.") }
        {% endif %}
    {% endif %}
    # --- MARCO EN EL CICLO (feature 011) ---
    # MARCO=SI/NO es el interruptor de toda la feature. Vive en save_variables
    # como el resto de parametros del operador, asi que SOBREVIVE a reinicios.
    # Default 0 (NO): una maquina que nunca lo active se comporta exactamente
    # como antes de la feature 011.
    {% if 'MARCO' in params %}
        {% set mc = params.MARCO | string | upper %}
        {% if mc in ['SI','SÍ','YES','Y','S','1'] %}
            SAVE_VARIABLE VARIABLE=marco_en_ciclo VALUE=1
        {% elif mc in ['NO','N','0'] %}
            SAVE_VARIABLE VARIABLE=marco_en_ciclo VALUE=0
        {% else %}
            { action_raise_error("MARCO solo admite SI o NO (recibido: " ~ params.MARCO ~ "). No se ha cambiado nada.") }
        {% endif %}
    {% endif %}
    # Se validan AQUI ademas de en _MARCO_BAJAR: es mejor rechazar el valor malo
    # al teclearlo que guardarlo y que reviente en la primera pieza del lote.
    {% if 'MARCO_ABAJO' in params %}
        {% set ma = params.MARCO_ABAJO | float %}
        {% if ma <= 0 %}
            { action_raise_error("MARCO_ABAJO debe ser mayor que 0 (recibido: " ~ ma ~ "). Es la distancia HACIA ABAJO desde el cero de arriba; el sentido lo pone la macro.") }
        {% endif %}
        {% if ma > printer['gcode_macro _MARCO'].abajo_max | float %}
            { action_raise_error("MARCO_ABAJO " ~ ma ~ " pasa del techo de " ~ printer['gcode_macro _MARCO'].abajo_max ~ " unidades (variable_abajo_max en la macro _MARCO). Red anti-error de tecleo. No se ha guardado nada.") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_abajo VALUE={ma}
    {% endif %}
    # MARCO_ARRIBA es el UNICO que puede ser 0 o negativo: 0 vuelve exacto al
    # cero de MARCO_HOME (la pared), un negativo chico deja margen antes de ella.
    # Positivo no tiene sentido: seria empujar contra la pared.
    {% if 'MARCO_ARRIBA' in params %}
        {% if params.MARCO_ARRIBA | float > 0 %}
            { action_raise_error("MARCO_ARRIBA no puede ser positivo (recibido: " ~ params.MARCO_ARRIBA ~ "): empujaria contra la pared de arriba. Usa 0 (cero exacto de MARCO_HOME) o un negativo chico para dejar margen.") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_arriba VALUE={params.MARCO_ARRIBA|float}
    {% endif %}
    {% if 'MARCO_SPEED' in params %}
        {% if params.MARCO_SPEED | float <= 0 %}
            { action_raise_error("MARCO_SPEED debe ser mayor que 0 (recibido: " ~ params.MARCO_SPEED ~ ").") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_speed VALUE={params.MARCO_SPEED|float}
    {% endif %}
    {% if 'MARCO_ACCEL' in params %}
        {% if params.MARCO_ACCEL | float <= 0 %}
            { action_raise_error("MARCO_ACCEL debe ser mayor que 0 (recibido: " ~ params.MARCO_ACCEL ~ ").") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_accel VALUE={params.MARCO_ACCEL|float}
    {% endif %}
    SHOW_CYCLE


# --- Mostrar parametros actuales -------------------------------------------
[gcode_macro SHOW_CYCLE]
description: Muestra los parametros actuales del ciclo
gcode:
    {% set v = printer.save_variables.variables %}
    {% set side = (v.start_side)|default(0)|int %}
    {% set modo = (v.modo_carrusel)|default(0)|int %}
    { action_respond_info("MODO           = " ~ ("CARRUSEL (indexa el plato e imprime solo donde hay prenda)" if modo == 1 else "SOLO CABEZA (el plato no se mueve)") ~ "   [SET_CYCLE MODO=CARRUSEL|CABEZA]") }
    {% if modo == 1 %}
        { action_respond_info("  carrusel: estacion = " ~ printer['gcode_macro _INDEX'].station ~ " · home del plato = " ~ printer['gcode_macro _INDEX'].homed) }
    {% endif %}
    {% if (v.simular_impresion)|default(0)|int == 1 %}
        { action_respond_info("*** SIMULAR = 1 -> NO IMPRIME. El plato indexa de verdad, la cabeza no se mueve. Quitar con SET_CYCLE SIMULAR=0 ***") }
    {% endif %}
    { action_respond_info("start_side     = " ~ ("IZQUIERDA (imprime izq->der)" if side == 0 else "DERECHA (imprime der->izq)")) }
    { action_respond_info("espera stroke  = " ~ ("DERECHA (espera en el lado de inicio durante el giro; embarre despues del giro)" if (v.espera_derecha)|default(0)|int == 1 else "IZQUIERDA (embarre a la vez que el giro)") ~ "   [SET_CYCLE ESPERA=IZQUIERDA|DERECHA]") }
    { action_respond_info("bajada/subida  = " ~ (("marco y squeegee A LA VEZ (el squeegee suelta " ~ ((v.squeegee_suelta)|default(10)) ~ " unidades antes de subir el marco)") if (v.marco_en_ciclo)|default(0)|int == 1 else "squeegee solo (MARCO=NO)") ~ "   [SET_CYCLE SQUEEGEE_SUELTA=n]") }
    { action_respond_info("pos_left       = " ~ ((v.pos_left)|default(0))    ~ " mm  (Y extremo izquierdo)") }
    { action_respond_info("pos_right      = " ~ ((v.pos_right)|default(100)) ~ " mm  (Y extremo derecho)") }
    { action_respond_info("squeegee_up    = " ~ ((v.squeegee_up)|default(10))   ~ " mm  (X arriba/seguro)") }
    { action_respond_info("squeegee_down  = " ~ ((v.squeegee_down)|default(90)) ~ " mm  (X abajo/malla)") }
    { action_respond_info("squeegee_speed = " ~ ((v.squeegee_speed)|default(7000)) ~ " mm/min") }
    { action_respond_info("stroke_speed   = " ~ ((v.stroke_speed)|default(7000))   ~ " mm/min") }
    # --- Marco en el ciclo (feature 011) ---
    {% set mar = (v.marco_en_ciclo)|default(0)|int %}
    { action_respond_info("MARCO EN EL CICLO = " ~ ("SI (baja al empezar cada pieza, sube al terminarla)" if mar == 1 else "NO (el ciclo no toca el marco)") ~ "   [SET_CYCLE MARCO=SI|NO]") }
    {% if mar == 1 %}
        { action_respond_info("  marco_abajo    = " ~ ((v.marco_abajo)|default(110))  ~ " unidades por debajo del cero de arriba") }
        { action_respond_info("  marco_arriba   = " ~ ((v.marco_arriba)|default(0))   ~ " (0 = cero exacto de MARCO_HOME)") }
        { action_respond_info("  marco_speed    = " ~ ((v.marco_speed)|default(1000)) ~ " /s   ·   marco_accel = " ~ ((v.marco_accel)|default(3000))) }
        { action_respond_info("  home del marco = " ~ ("SI" if printer['gcode_macro _MARCO'].homed|int == 1 else "NO -- START esta BLOQUEADO hasta hacer MARCO_HOME")) }
    {% endif %}
    # Posicion del marco (feature 012): se informa SIEMPRE, tambien con
    # MARCO=NO, porque la pantalla MANUAL lo mueve igualmente y "abajo" bloquea
    # START pase lo que pase con el interruptor del ciclo.
    { action_respond_info("posicion del marco = " ~ ("ARRIBA" if printer['gcode_macro _MARCO'].pos|int == 1 else ("ABAJO -- START BLOQUEADO hasta subirlo (MARCO_ARRIBA) o hacer HOME" if printer['gcode_macro _MARCO'].pos|int == 2 else "DESCONOCIDA (no impide arrancar; el squeegee si necesita saberlo para bajar en MANUAL)"))) }

# --- Home del operador (boton de la UI) ---
[gcode_macro HOME_OP]
description: Home operador: stroke por stall + marco + plato. Omite la cabeza (y el marco) si no esta montada
gcode:
    {% set sim  = (printer.save_variables.variables.simular_impresion) | default(0) | int %}
    {% set modo = (printer.save_variables.variables.modo_carrusel)     | default(0) | int %}

    # 🚨 SIN CABEZA MONTADA NO SE HOMEA LA CABEZA (arreglado el 2026-08-19).
    # Antes esto hacia G28 Y a secas. Con la cabeza sin montar el motor de X esta
    # desconectado, su driver reporta OpenLoad y KLIPPER SE APAGA: el operador
    # pulsaba HOME en la pantalla y le salia "Klipper se desconecto", sin pista
    # alguna. El G28 tambien lleva su propia guarda, pero aqui NO se aborta: se
    # OMITE la parte de la cabeza y se homea el plato, que es la mitad util. Asi
    # el boton de la pantalla sigue sirviendo para algo en vez de dar un error.
    {% if sim == 1 %}
        M118 Cabeza no montada (SIMULAR=1): se omite su HOME. Se homea solo el plato.
    {% else %}
        # Cabeza montada: se llama a HOME_ALL en vez de repetir su G28 X Y aqui.
        # Antes esto hacia G28 Y a secas + SET_KINEMATIC_POSITION X=25 (X nunca
        # se homeaba de verdad, solo se le asignaba una posicion inventada), lo
        # que dejaba al CoreXY sin saber donde estaba realmente el squeegee y
        # se comportaba distinto de HOME_ALL. El truco de omitir X era para
        # el caso SIN cabeza (mas arriba, sim==1); aqui la cabeza SI esta
        # montada, asi que toca el mismo home que HOME_ALL -- llamarla
        # directamente evita que las dos copias vuelvan a divergir en silencio.
        HOME_ALL

        # MARCO_HOME va JUSTO DESPUES de HOME_ALL (2026-09-16), no antes ni en
        # paralelo: son motores independientes (marco no comparte nada
        # electrico ni mecanico con el CoreXY), pero a proposito se encadena
        # solo cuando la cabeza SI se homeo de verdad -- si HOME_ALL falla,
        # el error de Klipper aborta el resto de HOME_OP y MARCO_HOME ni se
        # intenta (mismo criterio que el resto de esta macro: no dejar pasos
        # a medias como si hubieran terminado bien).
        MARCO_HOME
    {% endif %}

    # EN MODO CARRUSEL SE ENCADENA EL HOME DEL PLATO, para que el operador tenga
    # los DOS homes con un solo boton (START los exige los dos).
    # Va DESPUES de HOME_ALL a proposito: a partir de ahi X ya cuenta como
    # homeado, asi que _INDEX_SQUEEGEE_ARRIBA (dentro de INDEX_HOME) SI puede
    # subir el squeegee de verdad en vez de limitarse a avisar. Y despues de
    # MARCO_HOME, que deja el marco ARRIBA: INDEX_HOME se niega a girar el
    # plato con el marco abajo (pos == 2).
    # En modo solo cabeza NO se homea el plato: no hace falta y son 10 s de mas.
    {% if modo == 1 %}
        INDEX_HOME
    {% endif %}

    # Combinacion sin sentido: sin cabeza y sin carrusel no queda nada que homear.
    # Se avisa en vez de callar, para que el operador no crea que homeo algo.
    {% if sim == 1 and modo == 0 %}
        M118 Aviso: SIMULAR=1 en modo SOLO CABEZA. No hay nada que homear.
    {% endif %}
