# macros_ciclo.cfg — ciclo de impresión y parámetros del operador.
# Se incluye desde printer.cfg con [include macros_ciclo.cfg].
#
# Flujo del operador: HOME_ALL (obligatorio) → SET_CYCLE (opcional) → START.
#
# Orden de un ciclo de cabeza:
#   1. Embarre: el stroke viaja al extremo contrario con marco y squeegee
#      arriba; el floatbar reparte la tinta sin tocar la prenda. En modo
#      carrusel corre a la vez que el giro del plato.
#   2. Con MARCO=SI, el marco y el squeegee bajan a la vez.
#   3. El stroke regresa con el squeegee abajo: es la pasada que imprime.
#   4. Suben a la vez: el squeegee sale primero un tramo corto
#      (squeegee_suelta) y después arranca el marco.
#   5. En modo carrusel, el plato avanza a la siguiente estación.
#
# En modo cabeza el ciclo empieza y termina en el lado de inicio. En modo
# carrusel la cabeza descansa en el extremo contrario (ya embarrada) entre
# piezas.
#
# Ejes: X = squeegee (X+ arriba/seguro, X- abajo/malla), Y = stroke.
# El marco es un manual_stepper independiente, fuera de la cinemática.


# --- Persistencia de parámetros del operador ---
[save_variables]
filename: /home/aspe/printer_data/config/variables.cfg


# --- Estado interno del ciclo (no llamar a mano) ---
[gcode_macro _CYCLE_STATE]
variable_stop_req: 0
variable_count: 0
variable_target: 0
variable_running: 0
gcode:
    # Solo almacena variables de estado.


# --- Homing (obligatorio antes de START) ---
[gcode_macro HOME_ALL]
description: Homea squeegee (X) y stroke (Y) por sensorless y deja modo absoluto
gcode:
    G28 X Y
    G90


# --- Subir el squeegee sin bajarlo nunca ---
# Toda subida del squeegee pasa por aquí: solo mueve X si squeegee_up queda
# más arriba que la posición actual. Así un squeegee_up mal configurado no
# puede convertir un "subir" en una bajada hacia la malla.
# "Arriba" se deduce del lado del home de X (siempre el lado seguro), de modo
# que la macro sigue siendo correcta si se invierte la polaridad.
[gcode_macro _SQUEEGEE_A_ARRIBA]
description: Sube el squeegee a squeegee_up solo si eso es SUBIR (interna, no llamar)
gcode:
    {% set v  = printer.save_variables.variables %}
    {% set sx = printer.configfile.settings.stepper_x %}
    {% set arriba = 1 if sx.position_endstop >= (sx.position_min + sx.position_max) / 2 else -1 %}
    {% set su = (v.squeegee_up) | default(10) | float %}
    {% set x  = printer.gcode_move.gcode_position.x | float %}
    {% if (su - x) * arriba > 0 %}
        G90
        G1 X{su} F{ (v.squeegee_speed) | default(7000) | float }
        M400
    {% endif %}


# --- Un ciclo de impresión (una estación) ---
# No se coloca antes en el lado de inicio: asume que el ciclo anterior (o el
# home) dejó la cabeza ahí con el squeegee arriba.
[gcode_macro PRINT_CYCLE]
description: Un ciclo de la cabeza: embarra (marco arriba), baja marco y squeegee, regresa imprimiendo, sube
gcode:
    # El embarre va separado de la pasada porque en modo carrusel se ejecuta
    # durante el giro del plato y solo se llama a _IMPRIMIR_PASADA.
    _EMBARRAR
    _IMPRIMIR_PASADA


# --- Embarre: stroke al extremo contrario con marco y squeegee arriba ---
# En modo carrusel lo invoca _INDEX_AVANZAR con EMBARRAR=1 para que coincida
# con el giro del plato. Idempotente: si la cabeza ya está en y_end, no se mueve.
[gcode_macro _EMBARRAR]
description: Embarre: stroke al extremo contrario con marco y squeegee arriba (interna)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set p_left  = (v.pos_left)       | default(0)    | float %}
    {% set p_right = (v.pos_right)      | default(100)  | float %}
    {% set side    = (v.start_side)     | default(0)    | int %}
    {% set st_f    = (v.stroke_speed)   | default(7000) | float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("EMBARRAR: la maquina no esta homeada; corre HOME_ALL primero.") }
    {% endif %}
    # side 0 = inicio a la izquierda (imprime izq→der); side 1 = inicio a la derecha.
    {% set y_end   = p_right if side == 0 else p_left %}
    G90
    G1 Y{y_end}    F{st_f}    ; en vacío, marco y squeegee arriba


# --- Pasada que imprime ---
# Asume la cabeza en y_end (ya embarrada) con squeegee y marco arriba.
[gcode_macro _IMPRIMIR_PASADA]
description: Pasada de impresion: baja marco y squeegee, stroke de vuelta, sube (interna)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set sq_up   = (v.squeegee_up)    | default(10)   | float %}
    {% set sq_down = (v.squeegee_down)  | default(90)   | float %}
    {% set p_left  = (v.pos_left)       | default(0)    | float %}
    {% set p_right = (v.pos_right)      | default(100)  | float %}
    {% set side    = (v.start_side)     | default(0)    | int %}
    {% set sq_f    = (v.squeegee_speed) | default(7000) | float %}
    {% set st_f    = (v.stroke_speed)   | default(7000) | float %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("PRINT_CYCLE: la maquina no esta homeada; corre HOME_ALL primero.") }
    {% endif %}
    {% set y_start = p_left if side == 0 else p_right %}

    # Con MARCO=SI, marco y squeegee bajan y suben a la vez. La rama secuencial
    # solo se usa con MARCO=NO o cuando la guarda de tiempos lo exige.
    {% set juntos = (v.marco_en_ciclo) | default(0) | int == 1 %}
    {% if juntos %}
        # Guarda de tiempos: el marco debe llegar abajo bastante antes de que el
        # squeegee toque la malla (el contacto ocurre al final de su recorrido).
        # Si el marco necesita el 60 % o más del tiempo del squeegee, la pieza se
        # hace en secuencial y se avisa.
        {% set m_d = (v.marco_abajo) | default(110)  | float %}
        {% set m_v = (v.marco_speed) | default(1000) | float %}
        {% set m_a = (v.marco_accel) | default(3000) | float %}
        {% set t_marco = (m_d / m_v + m_v / m_a) if m_d >= (m_v * m_v / m_a) else 2.0 * ((m_d / m_a) ** 0.5) %}
        {% set x_now = printer.gcode_move.gcode_position.x | float %}
        {% set t_sq = ((x_now - sq_down) | abs) / (sq_f / 60.0) %}
        {% if t_marco >= 0.6 * t_sq %}
            M118 AVISO: el marco tardaria {'%.2f' % t_marco}s y el squeegee {'%.2f' % t_sq}s en bajar: no es seguro bajarlos a la vez. Esta pieza va en secuencial (sube marco_speed o baja squeegee_speed).
            {% set juntos = false %}
        {% endif %}
    {% endif %}
    {% if juntos %}
        # "Arriba" = lado del home de X, igual que en _SQUEEGEE_A_ARRIBA.
        {% set sx = printer.configfile.settings.stepper_x %}
        {% set arriba = 1 if sx.position_endstop >= (sx.position_min + sx.position_max) / 2 else -1 %}
        {% set suelta = (v.squeegee_suelta) | default(10) | float %}
        {% set x_suelta = sq_down + arriba * suelta %}
        {% if (x_suelta - sq_up) * arriba > 0 %}
            {% set x_suelta = sq_up %}
        {% endif %}
        G90
        # El marco se encola primero (SYNC=0) para que arranque junto con el G1.
        _MARCO_BAJAR SYNC=0
        G1 X{sq_down}  F{sq_f}    ; baja el squeegee junto con el marco
        _MARCO_ESPERAR_ABAJO
        G1 Y{y_start}  F{st_f}    ; pasada de impresión
        # El manual_stepper arranca al final de la cola del toolhead, es decir,
        # después del tramo corto con el que el squeegee suelta la malla.
        G1 X{x_suelta} F{sq_f}    ; el squeegee suelta la malla
        _MARCO_SUBIR SYNC=0
        G1 X{sq_up}    F{sq_f}    ; termina de subir junto con el marco
        _MARCO_ESPERAR_ARRIBA
    {% else %}
        G90
        # _MARCO_BAJAR no hace nada con MARCO=NO.
        _MARCO_BAJAR
        G1 X{sq_down}  F{sq_f}
        G1 Y{y_start}  F{st_f}    ; pasada de impresión, a posición absoluta (sin stall)
        G1 X{sq_up}    F{sq_f}
        # El marco sube después que el squeegee para que el plato nunca indexe
        # con el marco abajo.
        _MARCO_SUBIR
    {% endif %}



# --- Arranque del ciclo (requiere home) ---
# START            continuo hasta STOP
# START CYCLES=5   corre 5 ciclos y se detiene
[gcode_macro START]
description: Arranca el ciclo (REQUIERE HOME). CYCLES=0 continuo, N=lote
gcode:
    # Con simular_impresion=1 el bucle del carrusel llama a
    # _PRINT_CYCLE_SIMULADO: el plato se mueve, la cabeza no. Permite validar
    # indexado, sensor, conteo y STOP sin la cabeza instalada.
    {% set sim  = (printer.save_variables.variables.simular_impresion) | default(0) | int %}
    # 0 = solo cabeza, 1 = carrusel. Persiste en save_variables.
    {% set modo = (printer.save_variables.variables.modo_carrusel) | default(0) | int %}

    # En simulación no se mueve la cinemática, así que no se exige su home.
    {% if sim == 0 and ('x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes) %}
        { action_raise_error("START bloqueado: primero haz HOME (boton HOME_ALL).") }
    {% endif %}
    {% if sim == 1 and modo == 0 %}
        { action_raise_error("SIMULAR=1 no aplica al modo SOLO CABEZA (ahi no hay nada que simular). Pon SET_CYCLE MODO=CARRUSEL, o SET_CYCLE SIMULAR=0.") }
    {% endif %}

    # El home del plato se exige también en simulación: el plato sí se mueve,
    # y sin home _INDEX.station no tiene referencia.
    {% if modo == 1 and printer['gcode_macro _INDEX'].homed | int != 1 %}
        { action_raise_error("START bloqueado en modo CARRUSEL: el plato no tiene HOME. Haz INDEX_HOME (o HOME_OP, que ya lo encadena).") }
    {% endif %}
    # Se comprueba al arrancar y no solo en _MARCO_BAJAR: fallar aquí es un
    # aviso barato, fallar en la primera pieza deja el lote a medias. La guarda
    # de _MARCO_BAJAR se mantiene porque el home puede perderse durante el lote.
    {% if sim == 0 and (printer.save_variables.variables.marco_en_ciclo) | default(0) | int == 1 and printer['gcode_macro _MARCO'].homed | int != 1 %}
        { action_raise_error("START bloqueado: el marco entra en el ciclo (MARCO=SI) pero NO tiene HOME. Haz MARCO_HOME (o HOME_OP, que ya lo encadena). Si no quieres el marco en el ciclo: SET_CYCLE MARCO=NO.") }
    {% endif %}

    # --- Máquina dejada a medio ciclo por el modo manual ---
    # El primer movimiento del ciclo es un stroke; con el squeegee abajo sería
    # un arrastre a velocidad de impresión. Se rechaza el arranque en lugar de
    # corregir la posición (sería un movimiento no pedido) o invalidar el home
    # (sigue siendo válido).
    # Solo se bloquea con certeza (pos == 2). Con posición desconocida se
    # arranca: tras un FIRMWARE_RESTART pos vuelve a 0 y, con MARCO=NO, no
    # habría forma de desbloquear la máquina.
    {% if sim == 0 and printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("START bloqueado: el MARCO quedo ABAJO (modo manual). Subelo con MARCO ARRIBA, o pulsa HOME.") }
    {% endif %}
    # gcode_position: es el sistema de coordenadas de los G1 X del ciclo.
    {% if sim == 0 and 'x' in printer.toolhead.homed_axes %}
        {% set vv = printer.save_variables.variables %}
        {% set su = (vv.squeegee_up)   | default(10) | float %}
        {% set sd = (vv.squeegee_down) | default(90) | float %}
        {% set xx = printer.gcode_move.gcode_position.x | float %}
        # Se compara por cercanía relativa y no por igualdad con squeegee_up: si
        # squeegee_up difiere de position_endstop, una comparación exacta
        # bloquearía START justo después de homear. Además no depende del signo.
        {% if su != sd and ((xx - sd) | abs) < ((xx - su) | abs) %}
            { action_raise_error("START bloqueado: el SQUEEGEE quedo ABAJO (modo manual). Subelo con SQUEEGEE ARRIBA en la pantalla MANUAL, o pulsa HOME.") }
        {% endif %}
    {% endif %}

    # Lleva la cabeza al lado de inicio para que el primer embarre recorra
    # completo aunque la cabeza haya quedado en el otro extremo (p. ej. tras un
    # STOP). El squeegee sube primero; el marco ya está arriba (pos == 2 bloquea).
    {% if sim == 0 %}
        {% set vs = printer.save_variables.variables %}
        _SQUEEGEE_A_ARRIBA
        G90
        G1 Y{ (vs.pos_left | default(0) | float) if (vs.start_side | default(0) | int) == 0 else (vs.pos_right | default(100) | float) } F{ (vs.stroke_speed) | default(7000) | float }
        M400
    {% endif %}

    {% set n = params.CYCLES | default(0) | int %}
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=count VALUE=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=target VALUE={n}
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=1

    {% if modo == 1 %}
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=saltadas VALUE=0
        {% if sim == 1 %}
            M117 CARRUSEL SIMULADO (no imprime)
            M118 *** SIMULACION: el plato indexa de verdad, la CABEZA NO SE MUEVE. No sale ninguna impresion. Quitar con SET_CYCLE SIMULAR=0. ***
        {% elif n == 0 %}
            M117 Carrusel continuo (STOP para parar)
        {% else %}
            M117 Carrusel: {n} piezas
        {% endif %}
        # CYCLES cuenta piezas impresas: una estación sin prenda no consume cuota.
        # El ciclo empieza avanzando, no imprimiendo: una prenda que ya esté bajo
        # el squeegee pasa sin imprimir. Imprimir primero obligaría a fiarse de
        # un flag del sensor que puede venir de un avance manual anterior.
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0.5
    {% else %}
        {% if n == 0 %}
            M117 Ciclo continuo (STOP para parar)
        {% else %}
            M117 Corriendo {n} ciclos
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0.5
    {% endif %}


# --- Bucle del modo cabeza: un ciclo, revisa STOP, reprograma ---
[delayed_gcode _cycle_loop]
gcode:
    {% set s = printer['gcode_macro _CYCLE_STATE'] %}
    {% if s.stop_req|int == 0 and (s.target|int == 0 or s.count|int < s.target|int) %}
        PRINT_CYCLE
        M400
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=count VALUE={s.count|int + 1}
        UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0.2
    {% else %}
        # running=0 antes del movimiento de cierre: si la subida falla, el
        # estado queda limpio y no bloquea START.
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
        _SQUEEGEE_A_ARRIBA
        M117 Terminado ({s.count|int} ciclos)
    {% endif %}


# --- Modo carrusel: bucle de dos pasos ---
# Por estación:
#   A. Avanzar una estación (el squeegee sube dentro de _INDEX_AVANZAR).
#   B. Leer el flag del sensor de parte: con prenda imprime y count += 1;
#      sin prenda se salta sin contar.
#
# Por qué dos pasos: el press_gcode de [gcode_button part_sensor] usa
# run_script(), que toma el mutex de G-code. Mientras una macro se ejecuta, la
# detección queda encolada y se despacha al terminar el comando de nivel
# superior (además, todo el Jinja de una macro se evalúa antes de su primer
# comando). Si avance y lectura fueran en el mismo tick se leería el flag
# anterior y la impresión quedaría desfasada una estación. Al separarlos, el
# mutex se libera entre ticks, entra el press_gcode y el paso B lee el flag
# actualizado. La variable 'fase' alterna entre A y B.

# --- Estado del bucle del carrusel (no llamar a mano) ---
[gcode_macro _CAROUSEL]
description: Estado del bucle del carrusel (interna, no llamar)
# fase 0 = avanzar; fase 1 = leer el flag y decidir.
variable_fase: 0
# Estaciones saltadas por falta de prenda; solo diagnóstico. El contador de
# producción es _CYCLE_STATE.count.
variable_saltadas: 0
gcode:
    # Solo almacena estado.


# --- Bucle del carrusel ---
[delayed_gcode _carousel_loop]
gcode:
    {% set s = printer['gcode_macro _CYCLE_STATE'] %}
    {% set c = printer['gcode_macro _CAROUSEL'] %}
    {% set fin = (s.stop_req | int == 1) or (s.target | int != 0 and s.count | int >= s.target | int) %}

    {% if fin and c.fase | int == 0 %}
        # Solo se sale en fase 0, con la estación en curso terminada: STOP no
        # deja el squeegee abajo sobre la prenda.
        # running=0 va antes de cualquier movimiento de cierre: si la subida
        # aborta (p. ej. "Must home axis first"), el estado no queda colgado en
        # running=1 bloqueando START e INDEX_NEXT.
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
        # _INDEX_SQUEEGEE_ARRIBA ya avisa y continúa si X no está homeado.
        _INDEX_SQUEEGEE_ARRIBA
        M117 Carrusel terminado ({s.count | int} piezas)
        M118 Carrusel terminado: {s.count | int} pieza(s) impresa(s), {c.saltadas | int} estacion(es) saltada(s) por no llevar prenda.

    {% elif c.fase | int == 0 %}
        # --- Paso A: avanzar una estación ---
        # _INDEX_AVANZAR_UNA en lugar de INDEX_NEXT: la guarda de ciclo en marcha
        # de INDEX_NEXT bloquearía este mismo bucle. Sube el squeegee y limpia el
        # flag del sensor antes de mover.
        # Con la cabeza real, el embarre corre durante el giro y se hace siempre,
        # porque aún no se sabe si la estación trae prenda; si no la trae, el
        # siguiente embarre no recorre nada.
        # Con espera_derecha=1 la cabeza queda quieta en el lado de inicio
        # durante el giro y el embarre se hace en el paso B, solo si hay prenda.
        # No cambia el sentido del stroke (eso lo define start_side).
        {% if (printer.save_variables.variables.simular_impresion) | default(0) | int == 1
              or (printer.save_variables.variables.espera_derecha) | default(0) | int == 1 %}
            _INDEX_AVANZAR_UNA
        {% else %}
            _INDEX_AVANZAR_UNA EMBARRAR=1
        {% endif %}
        M400
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=1
        # Ventana en la que el mutex queda libre y entra el press_gcode encolado
        # del sensor. Es el único retardo del bucle que no se puede recortar sin
        # romper la detección.
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0.4

    {% else %}
        # --- Paso B: leer el flag y decidir ---
        {% if printer['gcode_macro _INDEX'].part | int == 1 %}
            {% if (printer.save_variables.variables.simular_impresion) | default(0) | int == 1 %}
                _PRINT_CYCLE_SIMULADO
            {% else %}
                # Con espera_derecha=1 el embarre se hace aquí, antes de bajar el
                # marco. Sin prenda no se entra y la cabeza sigue en el lado de inicio.
                {% if (printer.save_variables.variables.espera_derecha) | default(0) | int == 1 %}
                    _EMBARRAR
                {% endif %}
                _IMPRIMIR_PASADA
            {% endif %}
            M400
            SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=count VALUE={ s.count | int + 1 }
        {% else %}
            SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=saltadas VALUE={ c.saltadas | int + 1 }
            M118 Estacion {printer['gcode_macro _INDEX'].station} sin prenda: no se imprime.
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0.2
    {% endif %}


# --- Impresión simulada ---
# Sustituye a PRINT_CYCLE en el bucle del carrusel cuando simular_impresion=1;
# no toca la cinemática. La espera mantiene ocupado el mutex el tiempo que lo
# ocuparía una impresión real, de modo que la prueba ejercita el encolado del
# sensor.
[gcode_macro _PRINT_CYCLE_SIMULADO]
description: Sustituto de PRINT_CYCLE mientras la cabeza no esta instalada
gcode:
    M118 [SIMULADO] Aqui iria PRINT_CYCLE en la estacion {printer['gcode_macro _INDEX'].station}. La cabeza NO se ha movido.
    G4 P2000
    M400


# --- Recuperación de un bucle interrumpido ---
# Si un tick aborta (pérdida de home u otro error), muere antes de
# reprogramarse y running queda en 1, bloqueando START e INDEX_NEXT. Esta
# macro limpia el estado sin reiniciar el firmware.
[gcode_macro CYCLE_RESET]
description: Desatasca el estado del ciclo si un bucle murio a medias
gcode:
    UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=0
    SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
    M118 Estado del ciclo reiniciado. OJO: esto NO homea; comprueba la posicion antes de arrancar.


# --- Invalidación del home al desenergizar ---
# Klipper borra homed_axes de la cinemática al desenergizar, pero el home de
# los manual_stepper (plato, screen, marco) vive en variables de macro que
# Klipper no conoce. Sin esta invalidación, tras un M84 se podrían mover a mano
# y el ciclo indexaría sobre un cero que ya no existe.
# Cubre M84, M18 y el [idle_timeout] de printer.cfg (que termina en M84).

[gcode_macro _INVALIDAR_HOMES]
description: Marca plato, screen y marco como SIN home (interna, no llamar)
gcode:
    {% set idx = printer['gcode_macro _INDEX'].homed | int %}
    {% set scr = printer['gcode_macro _SCREEN'].homed | int %}
    {% set mar = printer['gcode_macro _MARCO'].homed | int %}

    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=moving VALUE=0
    # El motor del plato queda suelto: 'energizado' debe reflejarlo. Es uno de
    # los puntos del embudo del enable; ver la nota en macros_index.cfg.
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=energizado VALUE=0
    # Del screen solo se invalida 'homed'; 'talla' se conserva y con homed=0 se
    # interpreta como desconocida.
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=0
    # Con el motor suelto el marco puede caer por gravedad: su cero y su
    # posición dejan de ser válidos.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # Solo se avisa si había algún home que perder.
    {% if idx == 1 or scr == 1 or mar == 1 %}
        M118 Motores desenergizados: SE PIERDE EL HOME del plato, del screen y del marco. Hay que volver a homear antes de indexar o imprimir.
    {% endif %}


# --- Acciones previas a desenergizar ---
[gcode_macro _ANTES_DE_APAGAR_MOTORES]
description: Cierra el ciclo e invalida homes antes de un M84/M18 (interna)
gcode:
    # Un ciclo en marcha se cierra aquí: si no, el siguiente tick abortaría por
    # falta de home antes de reprogramarse y dejaría running=1 colgado.
    {% if printer['gcode_macro _CYCLE_STATE'].running | int == 1 %}
        UPDATE_DELAYED_GCODE ID=_cycle_loop DURATION=0
        UPDATE_DELAYED_GCODE ID=_carousel_loop DURATION=0
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=running VALUE=0
        SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=0
        SET_GCODE_VARIABLE MACRO=_CAROUSEL VARIABLE=fase VALUE=0
        M118 AVISO: habia un ciclo EN MARCHA y se ha cortado al desenergizar los motores. La posicion se ha perdido: hay que homear antes de arrancar otra vez.
    {% endif %}
    _INVALIDAR_HOMES


# --- Interceptores de M84/M18 ---
# Mismo patrón que el override de G28 en printer.cfg: rename_existing conserva
# el comando original y la macro lo llama al final.
[gcode_macro M84]
rename_existing: M84.1
description: Desenergiza los motores E INVALIDA los homes de plato y screen
gcode:
    _ANTES_DE_APAGAR_MOTORES
    M84.1 {rawparams}

[gcode_macro M18]
rename_existing: M18.1
description: Alias de M84 (Klipper registra los dos) - misma invalidacion
gcode:
    _ANTES_DE_APAGAR_MOTORES
    M18.1 {rawparams}


# --- Parar ---
[gcode_macro STOP]
description: Detiene al terminar el ciclo en curso (el squeegee queda arriba)
gcode:
    SET_GCODE_VARIABLE MACRO=_CYCLE_STATE VARIABLE=stop_req VALUE=1
    M117 STOP: parando al terminar el ciclo...


# --- Ajustar y guardar parámetros del operador ---
# Ejemplos:
#   SET_CYCLE START_SIDE=DERECHA
#   SET_CYCLE POS_LEFT=5 POS_RIGHT=190 STROKE_SPEED=8000
[gcode_macro SET_CYCLE]
description: Guarda parametros del ciclo (se conservan tras reiniciar)
gcode:
    # Las alturas del squeegee se validan como par (valor nuevo + guardado)
    # antes de guardar nada. Un error en el Jinja aborta la macro entera, así
    # que nunca queda un valor a medio guardar.
    {% set vv = printer.save_variables.variables %}
    {% set sx = printer.configfile.settings.stepper_x %}
    {% set arriba = 1 if sx.position_endstop >= (sx.position_min + sx.position_max) / 2 else -1 %}
    {% set nu = (params.SQUEEGEE_UP   | default(vv.squeegee_up   | default(10))) | float %}
    {% set nd = (params.SQUEEGEE_DOWN | default(vv.squeegee_down | default(90))) | float %}
    {% for val in [nu, nd] %}
        {% if val < sx.position_min or val > sx.position_max %}
            { action_raise_error("Altura de squeegee " ~ val ~ " fuera de los limites de X (" ~ sx.position_min ~ " a " ~ sx.position_max ~ "). No se ha guardado nada.") }
        {% endif %}
    {% endfor %}
    {% if (nu - nd) * arriba <= 0 %}
        { action_raise_error("Squeegee ARRIBA (" ~ nu ~ ") tiene que quedar mas arriba que squeegee ABAJO (" ~ nd ~ "). En esta maquina arriba = numeros " ~ ("MAS ALTOS" if arriba == 1 else "MAS BAJOS") ~ " (tope de arriba en " ~ sx.position_endstop ~ "). No se ha guardado nada.") }
    {% endif %}
    # Posiciones del stroke: sin esta validación, un valor fuera de los límites
    # de Y lo rechazaría Klipper durante la pasada de impresión, con el
    # squeegee y el marco ya abajo y running=1 colgado.
    {% set sy   = printer.configfile.settings.stepper_y %}
    {% set ymin = sy.position_min | default(0) | float %}
    {% set ymax = sy.position_max | float %}
    {% set nl = (params.POS_LEFT  | default(vv.pos_left  | default(0)))   | float %}
    {% set nr = (params.POS_RIGHT | default(vv.pos_right | default(100))) | float %}
    {% for val in [nl, nr] %}
        {% if val < ymin or val > ymax %}
            { action_raise_error("Posicion de stroke " ~ val ~ " fuera de los limites de Y (" ~ ymin ~ " a " ~ ymax ~ "). No se ha guardado nada.") }
        {% endif %}
    {% endfor %}
    {% if nl == nr %}
        { action_raise_error("POS_LEFT y POS_RIGHT valen lo mismo (" ~ nl ~ "): el stroke no recorreria nada. No se ha guardado nada.") }
    {% endif %}
    {% if 'SQUEEGEE_UP'    in params %}SAVE_VARIABLE VARIABLE=squeegee_up    VALUE={params.SQUEEGEE_UP|float}{% endif %}
    {% if 'SQUEEGEE_DOWN'  in params %}SAVE_VARIABLE VARIABLE=squeegee_down  VALUE={params.SQUEEGEE_DOWN|float}{% endif %}
    {% if 'POS_LEFT'       in params %}SAVE_VARIABLE VARIABLE=pos_left       VALUE={params.POS_LEFT|float}{% endif %}
    {% if 'POS_RIGHT'      in params %}SAVE_VARIABLE VARIABLE=pos_right      VALUE={params.POS_RIGHT|float}{% endif %}
    {% if 'SQUEEGEE_SPEED' in params %}SAVE_VARIABLE VARIABLE=squeegee_speed VALUE={params.SQUEEGEE_SPEED|float}{% endif %}
    {% if 'STROKE_SPEED'   in params %}SAVE_VARIABLE VARIABLE=stroke_speed   VALUE={params.STROKE_SPEED|float}{% endif %}
    {% if 'SIMULAR'        in params %}
        {% if params.SIMULAR | int == 1 %}
            SAVE_VARIABLE VARIABLE=simular_impresion VALUE=1
        {% else %}
            SAVE_VARIABLE VARIABLE=simular_impresion VALUE=0
        {% endif %}
    {% endif %}
    {% if 'MODO'           in params %}
        {% set md = params.MODO | string | upper %}
        {% if md in ['CARRUSEL','CARROUSEL','C','1'] %}
            SAVE_VARIABLE VARIABLE=modo_carrusel VALUE=1
        {% elif md in ['CABEZA','HEAD','SOLO','0'] %}
            SAVE_VARIABLE VARIABLE=modo_carrusel VALUE=0
        {% else %}
            { action_raise_error("MODO solo admite CARRUSEL o CABEZA (recibido: " ~ params.MODO ~ "). No se ha cambiado nada.") }
        {% endif %}
    {% endif %}
    {% if 'START_SIDE'     in params %}
        {% set sd = params.START_SIDE|string|upper %}
        {% if sd in ['IZQUIERDA','IZQ','LEFT','L','I','0'] %}
            SAVE_VARIABLE VARIABLE=start_side VALUE=0
        {% else %}
            SAVE_VARIABLE VARIABLE=start_side VALUE=1
        {% endif %}
    {% endif %}
    # Tramo (en unidades de X) que sube el squeegee antes de que arranque el
    # marco. Debe ser > 0 y menor que el recorrido entre abajo y arriba.
    {% if 'SQUEEGEE_SUELTA' in params %}
        {% set ss = params.SQUEEGEE_SUELTA | float %}
        {% if ss <= 0 or ss >= ((nu - nd) | abs) %}
            { action_raise_error("SQUEEGEE_SUELTA debe ser mayor que 0 y menor que el recorrido del squeegee (" ~ ((nu - nd) | abs) ~ " unidades). Recibido: " ~ ss ~ ". No se ha guardado nada.") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=squeegee_suelta VALUE={ss}
    {% endif %}
    # ESPERA=IZQUIERDA (0): el embarre corre a la vez que el giro del plato.
    # ESPERA=DERECHA (1): la cabeza espera en el lado de inicio durante el giro
    # y el embarre se hace después, solo si hay prenda.
    {% if 'ESPERA' in params %}
        {% set es = params.ESPERA | string | upper %}
        {% if es in ['IZQUIERDA','IZQ','LEFT','L','I','0'] %}
            SAVE_VARIABLE VARIABLE=espera_derecha VALUE=0
        {% elif es in ['DERECHA','DER','RIGHT','R','D','1'] %}
            SAVE_VARIABLE VARIABLE=espera_derecha VALUE=1
        {% else %}
            { action_raise_error("ESPERA solo admite IZQUIERDA o DERECHA (recibido: " ~ params.ESPERA ~ "). No se ha cambiado nada.") }
        {% endif %}
    {% endif %}
    # MARCO=SI/NO decide si el marco participa en el ciclo. Por defecto NO.
    {% if 'MARCO' in params %}
        {% set mc = params.MARCO | string | upper %}
        {% if mc in ['SI','SÍ','YES','Y','S','1'] %}
            SAVE_VARIABLE VARIABLE=marco_en_ciclo VALUE=1
        {% elif mc in ['NO','N','0'] %}
            SAVE_VARIABLE VARIABLE=marco_en_ciclo VALUE=0
        {% else %}
            { action_raise_error("MARCO solo admite SI o NO (recibido: " ~ params.MARCO ~ "). No se ha cambiado nada.") }
        {% endif %}
    {% endif %}
    # Se validan aquí además de en _MARCO_BAJAR: mejor rechazar el valor al
    # teclearlo que descubrirlo en la primera pieza del lote.
    {% if 'MARCO_ABAJO' in params %}
        {% set ma = params.MARCO_ABAJO | float %}
        {% if ma <= 0 %}
            { action_raise_error("MARCO_ABAJO debe ser mayor que 0 (recibido: " ~ ma ~ "). Es la distancia HACIA ABAJO desde el cero de arriba; el sentido lo pone la macro.") }
        {% endif %}
        {% if ma > printer['gcode_macro _MARCO'].abajo_max | float %}
            { action_raise_error("MARCO_ABAJO " ~ ma ~ " pasa del techo de " ~ printer['gcode_macro _MARCO'].abajo_max ~ " unidades (variable_abajo_max en la macro _MARCO). Red anti-error de tecleo. No se ha guardado nada.") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_abajo VALUE={ma}
    {% endif %}
    # MARCO_ARRIBA admite 0 (cero exacto de MARCO_HOME) o un negativo pequeño
    # como margen. Un positivo empujaría contra el tope superior.
    {% if 'MARCO_ARRIBA' in params %}
        {% if params.MARCO_ARRIBA | float > 0 %}
            { action_raise_error("MARCO_ARRIBA no puede ser positivo (recibido: " ~ params.MARCO_ARRIBA ~ "): empujaria contra la pared de arriba. Usa 0 (cero exacto de MARCO_HOME) o un negativo chico para dejar margen.") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_arriba VALUE={params.MARCO_ARRIBA|float}
    {% endif %}
    {% if 'MARCO_SPEED' in params %}
        {% if params.MARCO_SPEED | float <= 0 %}
            { action_raise_error("MARCO_SPEED debe ser mayor que 0 (recibido: " ~ params.MARCO_SPEED ~ ").") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_speed VALUE={params.MARCO_SPEED|float}
    {% endif %}
    {% if 'MARCO_ACCEL' in params %}
        {% if params.MARCO_ACCEL | float <= 0 %}
            { action_raise_error("MARCO_ACCEL debe ser mayor que 0 (recibido: " ~ params.MARCO_ACCEL ~ ").") }
        {% endif %}
        SAVE_VARIABLE VARIABLE=marco_accel VALUE={params.MARCO_ACCEL|float}
    {% endif %}
    SHOW_CYCLE


# --- Mostrar parámetros actuales ---
[gcode_macro SHOW_CYCLE]
description: Muestra los parametros actuales del ciclo
gcode:
    {% set v = printer.save_variables.variables %}
    {% set side = (v.start_side)|default(0)|int %}
    {% set modo = (v.modo_carrusel)|default(0)|int %}
    { action_respond_info("MODO           = " ~ ("CARRUSEL (indexa el plato e imprime solo donde hay prenda)" if modo == 1 else "SOLO CABEZA (el plato no se mueve)") ~ "   [SET_CYCLE MODO=CARRUSEL|CABEZA]") }
    {% if modo == 1 %}
        { action_respond_info("  carrusel: estacion = " ~ printer['gcode_macro _INDEX'].station ~ " · home del plato = " ~ printer['gcode_macro _INDEX'].homed) }
    {% endif %}
    {% if (v.simular_impresion)|default(0)|int == 1 %}
        { action_respond_info("*** SIMULAR = 1 -> NO IMPRIME. El plato indexa de verdad, la cabeza no se mueve. Quitar con SET_CYCLE SIMULAR=0 ***") }
    {% endif %}
    { action_respond_info("start_side     = " ~ ("IZQUIERDA (imprime izq->der)" if side == 0 else "DERECHA (imprime der->izq)")) }
    { action_respond_info("espera stroke  = " ~ ("DERECHA (espera en el lado de inicio durante el giro; embarre despues del giro)" if (v.espera_derecha)|default(0)|int == 1 else "IZQUIERDA (embarre a la vez que el giro)") ~ "   [SET_CYCLE ESPERA=IZQUIERDA|DERECHA]") }
    { action_respond_info("bajada/subida  = " ~ (("marco y squeegee A LA VEZ (el squeegee suelta " ~ ((v.squeegee_suelta)|default(10)) ~ " unidades antes de subir el marco)") if (v.marco_en_ciclo)|default(0)|int == 1 else "squeegee solo (MARCO=NO)") ~ "   [SET_CYCLE SQUEEGEE_SUELTA=n]") }
    { action_respond_info("pos_left       = " ~ ((v.pos_left)|default(0))    ~ " mm  (Y extremo izquierdo)") }
    { action_respond_info("pos_right      = " ~ ((v.pos_right)|default(100)) ~ " mm  (Y extremo derecho)") }
    { action_respond_info("squeegee_up    = " ~ ((v.squeegee_up)|default(10))   ~ " mm  (X arriba/seguro)") }
    { action_respond_info("squeegee_down  = " ~ ((v.squeegee_down)|default(90)) ~ " mm  (X abajo/malla)") }
    { action_respond_info("squeegee_speed = " ~ ((v.squeegee_speed)|default(7000)) ~ " mm/min") }
    { action_respond_info("stroke_speed   = " ~ ((v.stroke_speed)|default(7000))   ~ " mm/min") }
    {% set mar = (v.marco_en_ciclo)|default(0)|int %}
    { action_respond_info("MARCO EN EL CICLO = " ~ ("SI (baja al empezar cada pieza, sube al terminarla)" if mar == 1 else "NO (el ciclo no toca el marco)") ~ "   [SET_CYCLE MARCO=SI|NO]") }
    {% if mar == 1 %}
        { action_respond_info("  marco_abajo    = " ~ ((v.marco_abajo)|default(110))  ~ " unidades por debajo del cero de arriba") }
        { action_respond_info("  marco_arriba   = " ~ ((v.marco_arriba)|default(0))   ~ " (0 = cero exacto de MARCO_HOME)") }
        { action_respond_info("  marco_speed    = " ~ ((v.marco_speed)|default(1000)) ~ " /s   ·   marco_accel = " ~ ((v.marco_accel)|default(3000))) }
        { action_respond_info("  home del marco = " ~ ("SI" if printer['gcode_macro _MARCO'].homed|int == 1 else "NO -- START esta BLOQUEADO hasta hacer MARCO_HOME")) }
    {% endif %}
    # La posición del marco se informa siempre, también con MARCO=NO: la
    # pantalla manual lo mueve igualmente y "abajo" bloquea START.
    { action_respond_info("posicion del marco = " ~ ("ARRIBA" if printer['gcode_macro _MARCO'].pos|int == 1 else ("ABAJO -- START BLOQUEADO hasta subirlo (MARCO_ARRIBA) o hacer HOME" if printer['gcode_macro _MARCO'].pos|int == 2 else "DESCONOCIDA (no impide arrancar; el squeegee si necesita saberlo para bajar en MANUAL)"))) }

# --- Home del operador (botón de la UI) ---
[gcode_macro HOME_OP]
description: Home operador: stroke por stall + marco + plato. Omite la cabeza (y el marco) si no esta montada
gcode:
    {% set sim  = (printer.save_variables.variables.simular_impresion) | default(0) | int %}
    {% set modo = (printer.save_variables.variables.modo_carrusel)     | default(0) | int %}

    # Sin cabeza montada no se homea la cabeza: el motor de X está desconectado,
    # su driver reporta OpenLoad y Klipper entra en shutdown. Se omite esa parte
    # en lugar de abortar, para que el botón siga homeando el plato.
    {% if sim == 1 %}
        M118 Cabeza no montada (SIMULAR=1): se omite su HOME. Se homea solo el plato.
    {% else %}
        # Se reutiliza HOME_ALL para que los dos homes no diverjan.
        HOME_ALL

        # MARCO_HOME solo tras un HOME_ALL correcto: si este falla, el error
        # aborta HOME_OP y no se deja ningún paso a medias.
        MARCO_HOME
    {% endif %}

    # En modo carrusel se encadena el home del plato (START exige ambos).
    # Va después de HOME_ALL para que _INDEX_SQUEEGEE_ARRIBA pueda subir el
    # squeegee de verdad, y después de MARCO_HOME porque INDEX_HOME se niega a
    # girar con el marco abajo (pos == 2).
    # En modo solo cabeza el plato no se homea: no hace falta y cuesta ~10 s.
    {% if modo == 1 %}
        INDEX_HOME
    {% endif %}

    # Sin cabeza y sin carrusel no queda nada que homear; se avisa para que el
    # operador no crea que se homeó algo.
    {% if sim == 1 and modo == 0 %}
        M118 Aviso: SIMULAR=1 en modo SOLO CABEZA. No hay nada que homear.
    {% endif %}
