# macros_marco.cfg: motor que sube y baja el marco del cuadro. Se incluye desde printer.cfg.
#
# "marco" nombra la pieza, no la función; "screen" ya es el motor de tallas.
# Home sensorless contra la pared de arriba (MARCO_HOME); el cero está arriba
# y las posiciones de abajo son negativas.
#
# TODO: calibrar rotation_distance, definir position_min/max y calibrar el
# driver_SGT del tope de abajo (MARCO_HOME_ABAJO).
#
# Seguridad: la máquina no tiene E-stop. Al probar por primera vez, mover
# despacio y con acceso al corte de corriente.


# --- Prueba de movimiento ----------------------------------------------------
# MARCO_TEST                                          -> 10 unidades a la velocidad por defecto
# MARCO_TEST DISTANCIA=5 VELOCIDAD=5                  -> movimiento corto y lento
# MARCO_TEST SENTIDO=-1                               -> sentido contrario (bajar)
# MARCO_TEST DISTANCIA=110 VELOCIDAD=1000 ACCEL=1000  -> movimiento rápido
#
# En recorridos cortos el perfil de velocidad es triangular: la velocidad pico
# real es ≈ sqrt(ACCEL · DISTANCIA). Con accel=100 y distancia=110 el pico es
# ≈ 105/s aunque se pida VELOCIDAD=1000, así que por encima de ese techo solo
# ayuda subir ACCEL. Más ACCEL exige más par: subirlo de forma gradual y
# comprobar que no se pierden pasos.
#
# Detección de pasos perdidos: Klipper no publica la posición real de un
# manual_stepper, así que la prueba es indirecta. Ejecutar MARCO_HOME antes y
# después de la prueba rápida; si el toque contra la pared es igual de limpio
# las dos veces, no se perdieron pasos. Si suena distinto, se atasca o el toque
# es más brusco, bajar ACCEL.
[gcode_macro MARCO_TEST]
description: Prueba de conexion del marco: mueve una distancia chica para validar sentido y par
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}

    {% set cfg       = printer.configfile.settings['manual_stepper marco'] %}
    {% set distancia = params.DISTANCIA | default(10) | float %}
    {% set v         = params.VELOCIDAD | default(cfg.velocity) | float %}
    {% set sentido   = params.SENTIDO   | default(1) | int %}
    {% set accel     = params.ACCEL     | default(cfg.accel) | float %}

    {% if distancia <= 0 %}
        { action_raise_error("DISTANCIA debe ser mayor que 0 (recibido: " ~ distancia ~ ").") }
    {% endif %}
    {% if sentido != 1 and sentido != -1 %}
        { action_raise_error("SENTIDO solo admite 1 o -1 (recibido: " ~ sentido ~ ").") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% if accel <= 0 %}
        { action_raise_error("ACCEL debe ser mayor que 0 (recibido: " ~ accel ~ ").") }
    {% endif %}

    {% set mov = distancia * sentido %}

    MANUAL_STEPPER STEPPER=marco ENABLE=1
    # El movimiento es relativo a la posición actual y redefine el cero, así
    # que tras la prueba el home y la posición dejan de ser fiables.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0
    MANUAL_STEPPER STEPPER=marco SET_POSITION=0
    MANUAL_STEPPER STEPPER=marco MOVE={mov} SPEED={v} ACCEL={accel}
    M400

    # M118 y no action_respond_info: la plantilla se evalúa antes de ejecutar
    # los comandos, y action_respond_info informaría éxito aunque el movimiento
    # fallara después.
    M118 Marco: {distancia} unidad(es) en sentido {sentido} a {v} /s (accel {accel}).
    # El motor queda habilitado para poder comprobar el par de retención a mano.


# --- Liberar el motor --------------------------------------------------------
[gcode_macro MARCO_OFF]
description: Libera el motor del marco para moverlo a mano
gcode:
    MANUAL_STEPPER STEPPER=marco ENABLE=0
    # Con el motor libre el marco puede moverse a mano o caer por gravedad.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0
    M118 Marco liberado: se puede mover a mano.


# --- Diagnóstico -------------------------------------------------------------
[gcode_macro MARCO_STATUS]
description: Informa la configuracion efectiva del marco
gcode:
    # Klipper no publica la posición de un manual_stepper: solo se informa la
    # configuración y el estado que llevan las macros.
    {% set cfg = printer.configfile.settings['manual_stepper marco'] %}
    {% set tmc = printer.configfile.settings['tmc5160 manual_stepper marco'] %}
    { action_respond_info("marco rotation_distance = " ~ cfg.rotation_distance ~ " (PLACEHOLDER, sin calibrar contra el mecanismo real)") }
    { action_respond_info("marco velocity/accel por defecto = " ~ cfg.velocity ~ " / " ~ cfg.accel ~ " (valores conservadores de primera prueba)") }
    { action_respond_info("marco run_current = " ~ tmc.run_current ~ " A RMS (PROVISIONAL, ajustar con la placa del motor real)") }
    { action_respond_info("marco driver_SGT = " ~ tmc.driver_sgt ~ " (calibrado en maquina real 2026-09-16 PARA VELOCIDAD=100 -- si se homea a otra velocidad, hay que recalibrar)") }
    { action_respond_info("marco: home por StallGuard contra la pared de ARRIBA (MARCO_HOME, validado 3/3 repeticiones limpias). Sin position_min/max todavia -- ETAPA 2 en curso") }

    {% set v = printer.save_variables.variables %}
    { action_respond_info("marco HOME = " ~ ("SI (el cero de arriba es de fiar)" if printer['gcode_macro _MARCO'].homed | int == 1 else "NO -- haz MARCO_HOME antes de imprimir con el marco en el ciclo")) }
    { action_respond_info("marco POSICION = " ~ ("ARRIBA" if printer['gcode_macro _MARCO'].pos | int == 1 else ("ABAJO -- START y el indexado estan BLOQUEADOS hasta subirlo (MARCO_ARRIBA)" if printer['gcode_macro _MARCO'].pos | int == 2 else "DESCONOCIDA -- el squeegee no puede bajar hasta que se sepa (MARCO_ABAJO o MARCO_HOME)"))) }
    { action_respond_info("marco EN EL CICLO = " ~ ("SI (baja al empezar cada pieza y sube al terminarla)" if (v.marco_en_ciclo) | default(0) | int == 1 else "NO (el ciclo no toca el marco -- comportamiento previo a la feature 011)") ~ "   [SET_CYCLE MARCO=SI|NO]") }
    { action_respond_info("  marco_abajo  = " ~ ((v.marco_abajo) | default(110)) ~ " unidades por debajo del cero de arriba") }
    { action_respond_info("  marco_arriba = " ~ ((v.marco_arriba) | default(0)) ~ " (0 = vuelve exacto al cero de MARCO_HOME; negativo chico = deja margen antes de la pared)") }
    { action_respond_info("  marco_speed/accel del ciclo = " ~ ((v.marco_speed) | default(1000)) ~ " / " ~ ((v.marco_accel) | default(3000)) ~ " (validados a mano por Erwin el 2026-09-17)") }


# --- Home sensorless (StallGuard) contra la pared de arriba -------------------
# El driver TMC5160 detecta el atasco contra la pared mecánica (endstop
# virtual por DIAG7/PG15), igual que X e Y. Arriba es SENTIDO=1 de MARCO_TEST.
#
# Calibrado: driver_SGT=6 (printer.cfg) a VELOCIDAD=100, ACCEL=100 y
# CORRIENTE=0.6. StallGuard depende de la velocidad, la aceleración, la
# corriente y la mecánica; si cambia cualquiera de ellas hay que recalibrar.
#
# Requisito de hardware: en la BTT Octopus el jumper DIAG de MOTOR7 debe estar
# PUESTO; sin él StallGuard nunca dispara y el motor sigue girando contra la
# pared perdiendo pasos.
#
# Calibración de driver_SGT por bisección (MARCO_HOME SGT=n, sin reiniciar),
# separando el marco de la pared entre intentos con MARCO_TEST SENTIDO=-1:
#   - Dispara antes de la pared o casi al instante -> subir driver_SGT.
#   - Llega a la pared y sigue girando sin disparar -> bajar driver_SGT.
#   - Dispara en la pared con un toque limpio y repetible -> valor correcto.
# El valor definitivo se escribe en driver_SGT de printer.cfg.
#
# Un error de homing ("No trigger... after full movement") indica que se
# agotó DISTANCIA sin que StallGuard disparara.
#
# La corriente de home es menor que la de trabajo: el motor se atasca antes
# contra la pared (detección más fiable) y castiga menos la mecánica.
[gcode_macro MARCO_HOME]
description: Sube el marco hasta la pared (StallGuard) y fija ahi el cero
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de homear el marco.") }
    {% endif %}

    {% set cfg  = printer.configfile.settings['manual_stepper marco'] %}
    {% set tmc  = printer.configfile.settings['tmc5160 manual_stepper marco'] %}
    # VELOCIDAD=100 es la velocidad a la que se calibró driver_SGT; cambiarla
    # obliga a recalibrar. DISTANCIA=500 supera con margen el recorrido real
    # (≈ 50 con el rotation_distance actual).
    {% set v    = params.VELOCIDAD | default(100) | float %}
    {% set dist = params.DISTANCIA | default(500) | float %}
    {% set home_cur = params.CORRIENTE | default(0.6) | float %}
    # SGT= permite bisectar en caliente; por defecto se usa el de printer.cfg.
    {% set sgt = params.SGT | default(tmc.driver_sgt) | int %}

    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% if dist <= 0 %}
        { action_raise_error("DISTANCIA debe ser mayor que 0 (recibido: " ~ dist ~ ").") }
    {% endif %}
    {% if home_cur <= 0 %}
        { action_raise_error("CORRIENTE debe ser mayor que 0 (recibido: " ~ home_cur ~ ").") }
    {% endif %}
    {% if sgt < -64 or sgt > 63 %}
        { action_raise_error("SGT fuera de rango: " ~ sgt ~ " (valido -64 a 63).") }
    {% endif %}
    # Se invalida el estado antes de buscar la pared: si la macro aborta a
    # medias no debe quedar el valor anterior.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # SET_TMC_* usa el nombre corto del eje (marco), no "manual_stepper marco".
    # El SGT se fija explícitamente porque una prueba previa (por ejemplo de
    # MARCO_HOME_ABAJO) puede haber dejado otro valor cargado.
    SET_TMC_FIELD STEPPER=marco FIELD=sgt VALUE={sgt}

    SET_TMC_CURRENT STEPPER=marco CURRENT={home_cur}
    # Pausa de 2 s antes del home sensorless (recomendación de Klipper en
    # TMC_Drivers.md): la bandera de stall puede seguir activa de un movimiento
    # anterior. Con 300 ms fallaba al encadenarse tras HOME_ALL en HOME_OP.
    G4 P2000

    MANUAL_STEPPER STEPPER=marco ENABLE=1
    MANUAL_STEPPER STEPPER=marco SET_POSITION=0

    # Sin despegue previo, por diseño: el home es un único movimiento. Si se
    # llama con el marco ya apoyado en la pared, StallGuard no tiene un tramo de
    # movimiento libre con el que comparar y puede saltar pasos o fallar con
    # "No trigger... after full movement" (igual que el home de X/Y). Evitar dos
    # MARCO_HOME seguidos sin mover el marco entre ellos.

    # ACCEL=100 fijo: driver_SGT se calibró con esta aceleración. Tomar el accel
    # de [manual_stepper marco] rompería el home en silencio si ese valor
    # cambia. Un home más rápido exige recalibrar driver_SGT.
    MANUAL_STEPPER STEPPER=marco MOVE={dist} SPEED={v} ACCEL=100 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=marco SET_POSITION=0
    M400

    SET_TMC_CURRENT STEPPER=marco CURRENT={tmc.run_current}
    G4 P300

    # Se marca después del movimiento: si el stall no dispara, el error aborta
    # la macro y el estado queda inválido.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=1
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=1

    # M118 y no action_respond_info: ver MARCO_TEST.
    M118 Marco arriba (home StallGuard, SGT={sgt}): cero fijado.


# --- Tope de abajo por StallGuard (pendiente de calibrar) ---------------------
# Mismo mecanismo que MARCO_HOME, en sentido negativo. El driver_SGT de subida
# no sirve: StallGuard depende de la velocidad y de la carga, y al bajar la
# gravedad ayuda en lugar de oponerse.
#
# Calibración (SET_TMC_FIELD cambia el registro en caliente, sin reiniciar):
#   MARCO_HOME                                -> cero de arriba conocido
#   MARCO_HOME_ABAJO SGT=0 VELOCIDAD=20       -> primer intento
#   MARCO_HOME_ABAJO SGT=<n> VELOCIDAD=20     -> bisección, mismo criterio que MARCO_HOME
# Repetir MARCO_HOME antes de cada intento para partir de una referencia real.
#
# TODO: guardar el driver_SGT calibrado de forma persistente (SET_TMC_FIELD se
# pierde al reiniciar) y usarlo por defecto en esta macro.
[gcode_macro MARCO_HOME_ABAJO]
description: Baja el marco hasta el tope de abajo (StallGuard) -- EN CALIBRACION, ver la nota arriba
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}

    {% set tmc  = printer.configfile.settings['tmc5160 manual_stepper marco'] %}
    {% set v    = params.VELOCIDAD | default(20) | float %}
    {% set dist = params.DISTANCIA | default(100) | float %}
    {% set home_cur = params.CORRIENTE | default(0.6) | float %}

    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% if dist <= 0 %}
        { action_raise_error("DISTANCIA debe ser mayor que 0 (recibido: " ~ dist ~ ").") }
    {% endif %}
    {% if home_cur <= 0 %}
        { action_raise_error("CORRIENTE debe ser mayor que 0 (recibido: " ~ home_cur ~ ").") }
    {% endif %}

    {% if 'SGT' in params %}
        SET_TMC_FIELD STEPPER=marco FIELD=sgt VALUE={params.SGT | int}
    {% else %}
        { action_raise_error("Todavia no hay un driver_SGT de ABAJO calibrado: pasa SGT=<valor> para probar (ver la nota de calibracion en macros_marco.cfg).") }
    {% endif %}

    SET_TMC_CURRENT STEPPER=marco CURRENT={home_cur}
    # Pausa de 2 s: ver MARCO_HOME.
    G4 P2000

    MANUAL_STEPPER STEPPER=marco ENABLE=1
    # Sin SET_POSITION=0: se parte del cero de arriba (MARCO_HOME justo antes)
    # para que la distancia recorrida tenga significado.
    # El signo va en una variable: ver la nota en _MARCO_GO_ABAJO.
    # TODO: validar en máquina el sentido de bajada de esta macro.
    {% set destino = 0.0 - dist %}
    MANUAL_STEPPER STEPPER=marco MOVE={destino} SPEED={v} STOP_ON_ENDSTOP=home
    M400

    SET_TMC_CURRENT STEPPER=marco CURRENT={tmc.run_current}
    G4 P300

    # Es una macro de calibración: si StallGuard no dispara se pierden pasos
    # contra el tope, así que el cero deja de ser fiable y hace falta otro
    # MARCO_HOME antes de que el ciclo pueda bajar el marco.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    # La posición sí se conoce (abajo), y declararla hace que START se bloquee.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=2

    M118 Marco abajo (home StallGuard): tope detectado.


# --- Integración con el ciclo de impresión ------------------------------------
# Con marco_en_ciclo=1 (SET_CYCLE MARCO=SI) el marco baja al inicio de
# _IMPRIMIR_PASADA, tras el embarre, y sube al terminar la pieza. Así el plato
# nunca indexa con el marco abajo. Con marco_en_ciclo=0 (valor por defecto)
# _MARCO_BAJAR y _MARCO_SUBIR no emiten ningún comando.
#
# La bajada va a una distancia fija medida desde el cero de arriba, no a un
# tope por StallGuard: golpear el tope de abajo en cada pieza castigaría la
# mecánica sin necesidad.
#
# Valores por defecto validados en máquina:
#   marco_abajo = 110   ·   marco_speed = 1000   ·   marco_accel = 3000
# El accel se pasa explícito en cada MANUAL_STEPPER (es mayor que el de
# [manual_stepper marco]) para que un cambio en la config no altere estos
# movimientos. No afecta a MARCO_HOME, que fija su propio ACCEL=100.


# --- Estado del marco (interna) ----------------------------------------------
# Klipper no publica la posición de un manual_stepper, así que el estado se
# registra a mano en cada movimiento. Sin 'homed', el ciclo podría bajar el
# marco desde una referencia inventada contra la paleta.
[gcode_macro _MARCO]
description: Estado del marco (interna, no llamar)
# 0 = el cero no es fiable (sin home o perdido); 1 = home válido.
variable_homed: 0
# Posición: 0 = DESCONOCIDA, 1 = ARRIBA, 2 = ABAJO.
# Tres estados y no un booleano porque las guardas piden certezas opuestas:
#   - bajar el squeegee exige certeza de ABAJO      -> DESCONOCIDA bloquea
#   - bloquear START / INDEX exige certeza de ABAJO -> DESCONOCIDA deja pasar
# Si START exigiera pos == ARRIBA, una máquina con MARCO=NO quedaría bloqueada
# tras cada reinicio (pos vuelve a 0). Solo el valor 2 bloquea.
# Se escribe siempre después del M400, para que un movimiento interrumpido no
# deje registrada una posición final que no se alcanzó.
variable_pos: 0
# Límite contra errores de tecleo en la distancia de bajada (p. ej. 1100 en
# lugar de 110). No es un límite mecánico medido.
variable_abajo_max: 200
gcode:
    # Solo guarda estado.


# --- Movimiento del marco -----------------------------------------------------
# Todo movimiento de posición pasa por _MARCO_GO_ABAJO / _MARCO_GO_ARRIBA:
#   _MARCO_BAJAR / _MARCO_SUBIR  -> ciclo automático (solo con MARCO=SI)
#   MARCO_ABAJO  / MARCO_ARRIBA  -> operador (pantalla MANUAL o consola), siempre
# Cada llamador aplica su propia política de guardas:
#   - al bajar sin home se aborta: bajar desde un cero falso estrella el marco
#     contra la paleta, y el error detiene PRINT_CYCLE.
#   - al subir sin home se avisa y se continúa: es el paso de cierre, y abortar
#     dejaría el marco abajo y el ciclo a medias.


# --- Movimiento de bajada (interna) -------------------------------------------
# Sin guardas de ciclo ni de home: las aplican los llamadores.
[gcode_macro _MARCO_GO_ABAJO]
description: Mueve el marco a la posicion de abajo (interna, no llamar)
gcode:
    {% set v     = printer.save_variables.variables %}
    {% set abajo = params.DISTANCIA | default((v.marco_abajo) | default(110))  | float %}
    {% set spd   = params.VELOCIDAD | default((v.marco_speed) | default(1000)) | float %}
    {% set acc   = params.ACCEL     | default((v.marco_accel) | default(3000)) | float %}
    {% set techo = printer['gcode_macro _MARCO'].abajo_max | float %}

    {% if abajo <= 0 %}
        { action_raise_error("marco_abajo debe ser mayor que 0 (vale " ~ abajo ~ "). Se mide como distancia HACIA ABAJO desde el cero de arriba. Ajusta con SET_CYCLE MARCO_ABAJO=110.") }
    {% endif %}
    {% if abajo > techo %}
        { action_raise_error("marco_abajo " ~ abajo ~ " pasa del techo de " ~ techo ~ " unidades (variable_abajo_max en la macro _MARCO). Es una red anti-error de tecleo, no un limite mecanico. El marco NO se ha movido.") }
    {% endif %}
    {% if spd <= 0 or acc <= 0 %}
        { action_raise_error("marco_speed y marco_accel deben ser mayores que 0 (valen " ~ spd ~ " / " ~ acc ~ ").") }
    {% endif %}

    # Posición desconocida mientras el marco se mueve.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # Posición absoluta respecto al cero de arriba (negativa = abajo), para que
    # dos bajadas seguidas no se acumulen.
    MANUAL_STEPPER STEPPER=marco ENABLE=1
    # El signo se calcula en una variable porque MOVE={-1.0 * abajo} no
    # funciona: Klipper usa { } como delimitadores de variable, y "{-" se
    # interpreta como control de espacios de Jinja. La expresión queda
    # positiva sin dar error y el marco subiría contra la pared.
    {% set destino = 0.0 - abajo %}
    {% if params.SYNC | default(1) | int == 0 %}
        # SYNC=0: el movimiento se encola y la macro retorna sin esperar, con
        # pos=0. Arranca al final de la cola del toolhead, de modo que el
        # siguiente G1 encolado arranca a la vez. El llamador debe cerrar con
        # _MARCO_ESPERAR_ABAJO.
        MANUAL_STEPPER STEPPER=marco MOVE={destino} SPEED={spd} ACCEL={acc} SYNC=0
    {% else %}
        MANUAL_STEPPER STEPPER=marco MOVE={destino} SPEED={spd} ACCEL={acc}
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=2
    {% endif %}


# --- Movimiento de subida (interna) -------------------------------------------
[gcode_macro _MARCO_GO_ARRIBA]
description: Devuelve el marco a la posicion de arriba (interna, no llamar)
gcode:
    {% set v      = printer.save_variables.variables %}
    {% set arriba = (v.marco_arriba) | default(0) | float %}
    {% set spd    = params.VELOCIDAD | default((v.marco_speed) | default(1000)) | float %}
    {% set acc    = params.ACCEL     | default((v.marco_accel) | default(3000)) | float %}

    {% if spd <= 0 or acc <= 0 %}
        { action_raise_error("marco_speed y marco_accel deben ser mayores que 0 (valen " ~ spd ~ " / " ~ acc ~ ").") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # marco_arriba=0 devuelve el marco exactamente al cero de MARCO_HOME (la
    # pared). Si el toque contra la pared resulta brusco o salta pasos, un valor
    # negativo pequeño (SET_CYCLE MARCO_ARRIBA=-2) deja margen.
    MANUAL_STEPPER STEPPER=marco ENABLE=1
    {% if params.SYNC | default(1) | int == 0 %}
        # Ver SYNC=0 en _MARCO_GO_ABAJO; cerrar con _MARCO_ESPERAR_ARRIBA.
        MANUAL_STEPPER STEPPER=marco MOVE={arriba} SPEED={spd} ACCEL={acc} SYNC=0
    {% else %}
        MANUAL_STEPPER STEPPER=marco MOVE={arriba} SPEED={spd} ACCEL={acc}
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=1
    {% endif %}


# --- Bajar el marco en el ciclo -----------------------------------------------
[gcode_macro _MARCO_BAJAR]
description: Baja el marco a la posicion de impresion (interna, no llamar)
gcode:
    {% set v = printer.save_variables.variables %}
    {% if (v.marco_en_ciclo) | default(0) | int == 1 %}
        # Sin home se aborta (no basta avisar): un cero falso estrellaría el
        # marco contra la paleta. El error detiene PRINT_CYCLE completo.
        {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
            { action_raise_error("El marco NO tiene HOME: no se puede bajar al imprimir. Haz MARCO_HOME (o HOME_OP, que ya lo encadena). Si no quieres el marco en el ciclo: SET_CYCLE MARCO=NO.") }
        {% endif %}
        {% if params.SYNC | default(1) | int == 0 %}
            _MARCO_GO_ABAJO SYNC=0
        {% else %}
            _MARCO_GO_ABAJO
        {% endif %}
    {% endif %}


# --- Subir el marco en el ciclo -----------------------------------------------
[gcode_macro _MARCO_SUBIR]
description: Devuelve el marco a la posicion de arriba (interna, no llamar)
gcode:
    {% set v = printer.save_variables.variables %}
    {% if (v.marco_en_ciclo) | default(0) | int == 1 %}
        # Sin home se avisa y no se aborta: es el paso de cierre del ciclo
        # (ver _carousel_loop en macros_ciclo.cfg). Tampoco se mueve, porque sin
        # cero no se sabe cuánto subir.
        {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
            M118 AVISO: el marco no tiene HOME, no se sube. Comprueba a mano donde quedo antes de mover el plato.
        {% elif params.SYNC | default(1) | int == 0 %}
            _MARCO_GO_ARRIBA SYNC=0
        {% else %}
            _MARCO_GO_ARRIBA
        {% endif %}
    {% endif %}


# --- Esperar a que termine el movimiento del marco ------------------------------
# Cierran un _MARCO_BAJAR/_MARCO_SUBIR llamado con SYNC=0. MANUAL_STEPPER
# SYNC=1 sin MOVE hace que el toolhead espere al marco (M400 solo espera al
# toolhead); después se registra la posición. Aplican las mismas condiciones
# que BAJAR/SUBIR: si no hubo movimiento, no se espera ni se registra nada.
[gcode_macro _MARCO_ESPERAR_ABAJO]
description: Espera a que el marco termine de bajar y apunta pos=ABAJO (interna, feature 015)
gcode:
    {% if (printer.save_variables.variables.marco_en_ciclo) | default(0) | int == 1 and printer['gcode_macro _MARCO'].homed | int == 1 %}
        MANUAL_STEPPER STEPPER=marco SYNC=1
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=2
    {% endif %}


[gcode_macro _MARCO_ESPERAR_ARRIBA]
description: Espera a que el marco termine de subir y apunta pos=ARRIBA (interna, feature 015)
gcode:
    {% if (printer.save_variables.variables.marco_en_ciclo) | default(0) | int == 1 and printer['gcode_macro _MARCO'].homed | int == 1 %}
        MANUAL_STEPPER STEPPER=marco SYNC=1
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=1
    {% endif %}


# --- Bajar el marco a mano (pantalla MANUAL) ----------------------------------
# No consulta marco_en_ciclo: incluir el marco en el ciclo automático es una
# decisión del ciclo, no del operador que trabaja paso a paso.
[gcode_macro MARCO_ABAJO]
description: Baja el marco a la posicion de impresion (pantalla MANUAL / rescate)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}
    {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
        { action_raise_error("El marco no tiene HOME: bajarlo desde un cero falso lo estrella contra la paleta. Haz MARCO_HOME (o HOME_OP, que ya lo encadena).") }
    {% endif %}
    # No confundir con el parámetro SET_CYCLE MARCO_ABAJO, que guarda la
    # distancia. Comparten nombre en espacios distintos (macro y parámetro).
    _MARCO_GO_ABAJO {rawparams}
    M118 Marco abajo.


# --- Subir el marco a mano (pantalla MANUAL / rescate) ------------------------
# Si PRINT_CYCLE aborta a media pieza el marco queda abajo; esta macro lo
# devuelve arriba sin rehomear ni reiniciar.
[gcode_macro MARCO_ARRIBA]
description: Devuelve el marco a la posicion de arriba (pantalla MANUAL / rescate tras un ciclo abortado)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}
    {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
        { action_raise_error("El marco no tiene HOME: no se sabe donde esta el arriba. Haz MARCO_HOME.") }
    {% endif %}

    _MARCO_GO_ARRIBA {rawparams}
    M118 Marco arriba.
