# ============================================================
# macros_marco.cfg  -  MARCO (sube/baja el cuadro quemado). ETAPA 1: alta del motor
# ------------------------------------------------------------
# Se carga desde printer.cfg con:  [include macros_marco.cfg]
#
# NOMBRE: 'marco' es la pieza (el marco donde va montado el cuadro
# quemado), no una funcion como 'index' -- se eligio asi a proposito para
# no chocar con 'screen', que ya es el nombre del motor que mueve tallas en
# horizontal (feature 004). Ver la nota completa en printer.cfg.
#
# Empezo como ETAPA 1 (solo probar el motor: MARCO_TEST). Hoy tiene tambien
# home sensorless contra la pared de arriba (MARCO_HOME), integracion con el
# ciclo (feature 011) y botones de la pantalla MANUAL (feature 012). Siguen
# pendientes los limites reales (position_min/max) y calibrar
# rotation_distance y el tope de abajo (MARCO_HOME_ABAJO).
#
# SEGURIDAD: la maquina NO tiene E-stop. Primer giro con el motor a ser
# posible DESACOPLADO del mecanismo, despacio y con la mano en el corte de
# corriente.
# ============================================================


# --- Prueba de movimiento ---------------------------------------------------
# MARCO_TEST                              -> mueve un poco (10 unidades) a velocidad por defecto
# MARCO_TEST DISTANCIA=5 VELOCIDAD=5      -> movimiento chico y lento (recomendado para la primera vez)
# MARCO_TEST SENTIDO=-1                   -> mismo movimiento al reves
# MARCO_TEST DISTANCIA=110 VELOCIDAD=1000 ACCEL=1000  -> mas rapido, ver la nota de ACCEL abajo
#
# !! POR QUE HACE FALTA ACCEL AQUI (detectado 2026-09-16, viendo la maquina):
#   con accel=100 (el de printer.cfg) y un recorrido de 110, el perfil de
#   velocidad es TRIANGULAR: no le alcanza distancia para acelerar hasta la
#   VELOCIDAD pedida antes de tener que frenar. La velocidad pico real en un
#   perfil simetrico es sqrt(ACCEL * DISTANCIA), asi que con accel=100 y
#   distancia=110 el pico real es ~105 /s, aunque se pida VELOCIDAD=1000.
#   Subir VELOCIDAD sin subir ACCEL no sirve de nada una vez pasado ese techo
#   -- exactamente la misma lccion que ya dejo documentada el INDEX (ver
#   macros_index.cfg). Subir ACCEL SI ayuda, pero pide mas par instantaneo del
#   motor -- subir DE A POCO y comprobar que no pierde pasos (ver nota abajo),
#   no asumir que aguanta porque no dio ningun error.
#
# !! COMO SABER SI PERDIO PASOS: esta version de Klipper NO publica la
#   posicion real del manual_stepper (mismo problema que index/screen), asi
#   que no hay forma directa de leerlo. La prueba es indirecta: MARCO_HOME
#   antes y despues de la prueba rapida -- si el "toque" contra la pared de
#   arriba se siente/suena igual de limpio las dos veces, no perdio pasos. Si
#   suena distinto, se atasca a medio camino, o el toque final es mas brusco,
#   bajar ACCEL.
[gcode_macro MARCO_TEST]
description: Prueba de conexion del marco: mueve una distancia chica para validar sentido y par
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}

    {% set cfg       = printer.configfile.settings['manual_stepper marco'] %}
    {% set distancia = params.DISTANCIA | default(10) | float %}
    {% set v         = params.VELOCIDAD | default(cfg.velocity) | float %}
    {% set sentido   = params.SENTIDO   | default(1) | int %}
    {% set accel     = params.ACCEL     | default(cfg.accel) | float %}

    {% if distancia <= 0 %}
        { action_raise_error("DISTANCIA debe ser mayor que 0 (recibido: " ~ distancia ~ ").") }
    {% endif %}
    {% if sentido != 1 and sentido != -1 %}
        { action_raise_error("SENTIDO solo admite 1 o -1 (recibido: " ~ sentido ~ ").") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% if accel <= 0 %}
        { action_raise_error("ACCEL debe ser mayor que 0 (recibido: " ~ accel ~ ").") }
    {% endif %}

    {% set mov = distancia * sentido %}

    # SET_POSITION=0 antes de cada prueba: el marco todavia NO tiene home,
    # asi que el cero no significa nada; cada prueba es un movimiento
    # relativo a donde este ahora.
    MANUAL_STEPPER STEPPER=marco ENABLE=1
    # Y con ello se INVALIDA el home (feature 011): este SET_POSITION=0 refija
    # el cero DONDE ESTE el marco, asi que despues de un MARCO_TEST el cero de
    # arriba ya no es de fiar y el ciclo no debe bajar el marco.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    # Y la POSICION pasa a DESCONOCIDA (feature 012): esta macro mueve una
    # distancia arbitraria en el sentido que le pidan, asi que despues de
    # usarla no se sabe si el marco quedo arriba, abajo o a media altura.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0
    MANUAL_STEPPER STEPPER=marco SET_POSITION=0
    MANUAL_STEPPER STEPPER=marco MOVE={mov} SPEED={v} ACCEL={accel}
    M400

    # M118 y no action_respond_info: el jinja de una macro se evalua ANTES de
    # ejecutar sus comandos, asi que un action_respond_info aqui cantaria
    # "listo" aunque el movimiento fallara despues. Mismo criterio que
    # INDEX_TEST (ya le paso a la feature 004).
    M118 Marco: {distancia} unidad(es) en sentido {sentido} a {v} /s (accel {accel}).
    # El motor QUEDA HABILITADO a proposito, para poder comprobar el par de
    # retencion a mano. MARCO_OFF lo libera.


# --- Liberar el motor --------------------------------------------------------
[gcode_macro MARCO_OFF]
description: Libera el motor del marco para moverlo a mano
gcode:
    MANUAL_STEPPER STEPPER=marco ENABLE=0
    # Motor suelto = el marco se puede mover a mano (o caerse por gravedad):
    # su cero deja de valer (feature 011) y su posicion tambien (feature 012).
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0
    M118 Marco liberado: se puede mover a mano.


# --- Diagnostico (banco y soporte, no para el operador) ----------------------
[gcode_macro MARCO_STATUS]
description: Informa la configuracion efectiva del marco
gcode:
    # OJO: esta version de Klipper NO publica el objeto 'manual_stepper' en el
    # status (ya comprobado con index/screen), asi que NO se puede informar la
    # posicion real. Solo se informa la configuracion.
    {% set cfg = printer.configfile.settings['manual_stepper marco'] %}
    {% set tmc = printer.configfile.settings['tmc5160 manual_stepper marco'] %}
    { action_respond_info("marco rotation_distance = " ~ cfg.rotation_distance ~ " (PLACEHOLDER, sin calibrar contra el mecanismo real)") }
    { action_respond_info("marco velocity/accel por defecto = " ~ cfg.velocity ~ " / " ~ cfg.accel ~ " (valores conservadores de primera prueba)") }
    { action_respond_info("marco run_current = " ~ tmc.run_current ~ " A RMS (PROVISIONAL, ajustar con la placa del motor real)") }
    { action_respond_info("marco driver_SGT = " ~ tmc.driver_sgt ~ " (calibrado en maquina real 2026-09-16 PARA VELOCIDAD=100 -- si se homea a otra velocidad, hay que recalibrar)") }
    { action_respond_info("marco: home por StallGuard contra la pared de ARRIBA (MARCO_HOME, validado 3/3 repeticiones limpias). Sin position_min/max todavia -- ETAPA 2 en curso") }

    # --- Estado e integracion con el ciclo (feature 011) ---
    {% set v = printer.save_variables.variables %}
    { action_respond_info("marco HOME = " ~ ("SI (el cero de arriba es de fiar)" if printer['gcode_macro _MARCO'].homed | int == 1 else "NO -- haz MARCO_HOME antes de imprimir con el marco en el ciclo")) }
    # POSICION (feature 012): no se lee del motor -- no se puede -- sino que se
    # apunta a mano en cada movimiento. Es lo que gobierna las guardas del
    # squeegee, del indexado y de START.
    { action_respond_info("marco POSICION = " ~ ("ARRIBA" if printer['gcode_macro _MARCO'].pos | int == 1 else ("ABAJO -- START y el indexado estan BLOQUEADOS hasta subirlo (MARCO_ARRIBA)" if printer['gcode_macro _MARCO'].pos | int == 2 else "DESCONOCIDA -- el squeegee no puede bajar hasta que se sepa (MARCO_ABAJO o MARCO_HOME)"))) }
    { action_respond_info("marco EN EL CICLO = " ~ ("SI (baja al empezar cada pieza y sube al terminarla)" if (v.marco_en_ciclo) | default(0) | int == 1 else "NO (el ciclo no toca el marco -- comportamiento previo a la feature 011)") ~ "   [SET_CYCLE MARCO=SI|NO]") }
    { action_respond_info("  marco_abajo  = " ~ ((v.marco_abajo) | default(110)) ~ " unidades por debajo del cero de arriba") }
    { action_respond_info("  marco_arriba = " ~ ((v.marco_arriba) | default(0)) ~ " (0 = vuelve exacto al cero de MARCO_HOME; negativo chico = deja margen antes de la pared)") }
    { action_respond_info("  marco_speed/accel del ciclo = " ~ ((v.marco_speed) | default(1000)) ~ " / " ~ ((v.marco_accel) | default(3000)) ~ " (validados a mano por Erwin el 2026-09-17)") }


# ==========================================================================
# HOME DEL MARCO POR SENSORLESS (StallGuard) -- etapa 2, primera pieza
# ==========================================================================
# A diferencia de index (sensor inductivo fisico), marco NO tiene ni
# necesita un fin de carrera instalado: el propio driver TMC5160 detecta que
# el motor se atasca contra la pared mecanica de ARRIBA (direccion confirmada
# por Erwin en maquina real, 2026-09-15 -- el mismo sentido en que sube el
# marco, SENTIDO=1 de MARCO_TEST). Es EXACTAMENTE el mismo mecanismo que ya
# usan X e Y (virtual_endstop del driver, DIAG7/PG15 en este caso), asi que
# aqui tampoco hay sensor fisico que cablear.
#
# ✅ CALIBRADO Y VALIDADO EN MAQUINA REAL (2026-09-15/16), 3/3 repeticiones
# limpias con DISTANCIA=50 VELOCIDAD=100 y driver_SGT=6 (en printer.cfg).
# Por el camino aparecieron dos problemas de hardware/config reales, no de
# ajuste fino -- ver docs/BITACORA.md para el detalle completo:
#   1. El jumper de DIAG del zocalo MOTOR7 estaba QUITADO. En esta placa
#      (BTT Octopus, USES_DIAG_JUMPERS) el jumper PUESTO es el que conecta la
#      senal real del driver al pin -- lo contrario de index, que lo quita
#      porque usa sensor fisico (screen tambien lo lleva PUESTO desde que es
#      sensorless, 2026-10-08). Sin el puesto, StallGuard NUNCA
#      disparaba pasara lo que pasara con driver_SGT (el marco llegaba a la
#      pared y seguia girando, perdiendo pasos).
#   2. StallGuard depende de la VELOCIDAD de home (lo dice la propia guia de
#      Klipper, docs/TMC_Drivers.md): el driver_SGT bueno a VELOCIDAD=20 (3)
#      NO sirve a VELOCIDAD=100 (hace falta 6). Si algun dia cambia la
#      VELOCIDAD de MARCO_HOME, la corriente de home, o algo de la mecanica,
#      HAY QUE REPETIR la biseccion completa.
#
# COMO SE HIZO LA BISECCION (por si hay que repetirla): con el marco lejos de
# la pared (MARCO_TEST SENTIDO=-1 para despegarlo entre intento e intento),
# se prueba MARCO_HOME a la VELOCIDAD final deseada con distintos driver_SGT:
#   - Dispara ANTES de llegar a la pared, o "casi de inmediato" -> muy
#     sensible -> SUBIR driver_SGT.
#   - Llega a la pared y SIGUE GIRANDO/pierde pasos sin disparar -> poco
#     sensible -> BAJAR driver_SGT.
#   - Llega y dispara ahi mismo, de un solo toque limpio, repetible -> listo.
# Desde el 2026-10-08 se bisecta EN CALIENTE con MARCO_HOME SGT=n (sin
# reiniciar). Cuando se encuentra el bueno, escribirlo en driver_SGT de
# printer.cfg, desplegar y FIRMWARE_RESTART: MARCO_HOME lo lee de ahi.
#
# Si Klipper da un error de homing (en vez de terminar "listo"), NO es un
# bug: significa que se acabo la DISTANCIA pedida sin que StallGuard
# disparara. Sube DISTANCIA (el marco no tiene position_max todavia que lo
# impida) y reintenta.
#
# CORRIENTE DE HOME REDUCIDA -- mismo criterio ya aplicado en el G28 de X/Y
# (calca Y_CURRENT_HOME de Marlin): menos corriente hace que el motor se
# atasque antes al topar con la pared (deteccion de stall mas fiable) y
# castiga menos un mecanismo que nunca ha tocado su tope real. CORRIENTE=0.6
# (por defecto abajo) es lo que se uso durante toda la calibracion, sin
# problemas -- no se afino mas a fondo que eso.
# ==========================================================================

[gcode_macro MARCO_HOME]
description: Sube el marco hasta la pared (StallGuard) y fija ahi el cero
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de homear el marco.") }
    {% endif %}

    {% set cfg  = printer.configfile.settings['manual_stepper marco'] %}
    {% set tmc  = printer.configfile.settings['tmc5160 manual_stepper marco'] %}
    # VELOCIDAD y DISTANCIA por defecto son los de PRODUCCION, calibrados en
    # maquina real el 2026-09-16 (ver la nota larga arriba): VELOCIDAD=100 es
    # la velocidad para la que se bisecto driver_SGT=6 en printer.cfg -- si se
    # cambia aqui, HAY QUE RECALIBRAR driver_SGT. DISTANCIA=500 es a proposito
    # mucho mayor que lo que hace falta (~50 con la calibracion actual de
    # rotation_distance) para dar margen si el marco arranca lejos de la
    # pared o si rotation_distance cambia mas adelante.
    {% set v    = params.VELOCIDAD | default(100) | float %}
    {% set dist = params.DISTANCIA | default(500) | float %}
    {% set home_cur = params.CORRIENTE | default(0.6) | float %}
    # driver_SGT SALE DE printer.cfg (2026-10-08). Antes iba escrito a mano (6)
    # en el SET_TMC_FIELD de abajo, asi que recalibrar en printer.cfg -- que es
    # lo que dicen todos los comentarios -- NO cambiaba nada. SGT= permite
    # bisectar en caliente sin reiniciar, igual que SCREEN_HOME.
    {% set sgt = params.SGT | default(tmc.driver_sgt) | int %}

    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% if dist <= 0 %}
        { action_raise_error("DISTANCIA debe ser mayor que 0 (recibido: " ~ dist ~ ").") }
    {% endif %}
    {% if home_cur <= 0 %}
        { action_raise_error("CORRIENTE debe ser mayor que 0 (recibido: " ~ home_cur ~ ").") }
    {% endif %}
    {% if sgt < -64 or sgt > 63 %}
        { action_raise_error("SGT fuera de rango: " ~ sgt ~ " (valido -64 a 63).") }
    {% endif %}
    # El home se INVALIDA antes de empezar a buscarlo: mientras el marco se
    # mueve hacia la pared su cero no vale, y si la macro aborta a medias tiene
    # que quedar invalidado, no con el valor viejo (feature 011). La POSICION
    # va igual (feature 012): durante la busqueda el marco esta en transito.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # 🐞 STEPPER=marco, NO "manual_stepper marco" (medido en maquina, 2026-09-15,
    # error real: "The value 'manual_stepper marco' is not valid for STEPPER.
    # Options: 'stepper_x', 'stepper_y', 'screen', 'index', 'marco'"). El comando
    # SET_TMC_CURRENT usa el nombre CORTO del eje (la ultima palabra de la
    # seccion [tmc5160 manual_stepper marco]), igual que MANUAL_STEPPER de abajo
    # -- no el nombre completo de la seccion. (El intento anterior con comillas
    # arreglo el "Malformed command" pero el valor seguia siendo el equivocado.)
    # driver_SGT EXPLICITO aqui (no fiarse del que quedo cargado desde
    # printer.cfg): desde que existe MARCO_HOME_ABAJO (2026-09-16), el sgt
    # en caliente puede haber quedado en el valor de la calibracion de ABAJO
    # (que es distinto). Cada macro de home fija el suyo antes de moverse.
    SET_TMC_FIELD STEPPER=marco FIELD=sgt VALUE={sgt}

    SET_TMC_CURRENT STEPPER=marco CURRENT={home_cur}
    # 🐞 G4 P2000 (2 s), NO P300 (detectado 2026-09-17): encadenado justo
    # despues de HOME_ALL dentro de HOME_OP, MARCO_HOME fallaba con "No
    # trigger... after full movement" -- pero llamado solo (con el tiempo que
    # tarda en escribirse el siguiente comando de por medio) homeaba bien. Es
    # la pausa que pide la propia guia de Klipper (docs/TMC_Drivers.md):
    # "pause al menos 2 segundos antes de homear sensorless, o la bandera de
    # stall del driver puede seguir marcada de un movimiento anterior". 300 ms
    # no alcanzaba cuando no hay nada mas de por medio.
    G4 P2000

    MANUAL_STEPPER STEPPER=marco ENABLE=1
    MANUAL_STEPPER STEPPER=marco SET_POSITION=0

    # 🚨 SIN DESPEGUE, A PEDIDO DE ERWIN (2026-09-17): hubo una version que
    # bajaba un poco (DESPEGUE) antes de buscar la pared, para evitar que si
    # el marco ya estaba en el home, el primer paso hacia arriba encontrara
    # resistencia total desde el instante cero y se saltaran pasos en vez de
    # disparar limpio (StallGuard necesita ver un tramo de movimiento normal
    # antes de poder distinguir un atasco -- mismo principio que el despegue
    # de INDEX_HOME). El log de la maquina real mostraba que SI funcionaba
    # (varios MARCO_HOME seguidos, todos limpios), pero Erwin no queria el
    # movimiento en dos tiempos y pidio quitarlo. CONSECUENCIA CONOCIDA: si
    # se llama MARCO_HOME con el marco YA tocando la pared, puede volver a
    # saltarse pasos o fallar con "No trigger... after full movement" (el
    # bug original). Mismo comportamiento que tiene HOME_ALL de X/Y en ese
    # mismo caso (tambien es un sintoma general de StallGuard, no exclusivo
    # de marco). Mitigacion operativa: evitar pedir MARCO_HOME dos veces
    # seguidas sin mover el marco de por medio.

    # SENTIDO SIEMPRE POSITIVO (arriba): la pared de arriba, la unica
    # calibrada como CERO de referencia. La de abajo la maneja MARCO_HOME_ABAJO.
    #
    # 🚨 ACCEL=100 FIJO A PROPOSITO (2026-09-16), no el accel general de
    # printer.cfg (subido a 2000 para los movimientos normales del marco, ver
    # la nota junto a [manual_stepper marco]). driver_SGT=6 se calibro CON
    # accel=100: si esta macro tomara el accel general y alguien lo vuelve a
    # subir mas adelante, el home de arriba se rompe en silencio (dispara
    # distinto, o deja de disparar) sin que nada avise. Si algun dia hace
    # falta un home mas rapido aqui, hay que RECALIBRAR driver_SGT con el
    # accel nuevo, no solo cambiar este numero.
    MANUAL_STEPPER STEPPER=marco MOVE={dist} SPEED={v} ACCEL=100 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=marco SET_POSITION=0
    M400

    SET_TMC_CURRENT STEPPER=marco CURRENT={tmc.run_current}
    G4 P300

    # HOME VALIDO (feature 011): a partir de aqui el cero del marco significa
    # algo y el ciclo puede bajarlo. Va DESPUES del movimiento, no antes: si el
    # stall no dispara, el error aborta la macro y homed se queda en 0.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=1
    # Y el home deja el marco contra la pared de ARRIBA, que es justo lo que
    # necesita saber la pantalla MANUAL para habilitar sus botones (012).
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=1

    # M118 y no action_respond_info: el jinja se evalua ANTES de ejecutar los
    # comandos, asi que un action_respond_info aqui cantaria "listo" aunque el
    # home fallara despues (mismo criterio que MARCO_TEST/INDEX_HOME).
    M118 Marco arriba (home StallGuard, SGT={sgt}): cero fijado.


# ==========================================================================
# TOPE DE ABAJO POR SENSORLESS (StallGuard) -- calibrando (2026-09-16)
# ==========================================================================
# Igual mecanismo que MARCO_HOME (arriba), pero en sentido NEGATIVO (bajar) y
# contra el tope de ABAJO -- la posicion donde Erwin quiere que el marco
# llegue en operacion normal (estimado en ~50 unidades desde el cero de
# arriba; DISTANCIA=100 por defecto da margen mientras se confirma).
#
# 🚨 SIN CALIBRAR TODAVIA. driver_SGT de subir (6, a VELOCIDAD=100) NO tiene
# por que servir para bajar: StallGuard depende de la velocidad Y de la carga,
# y bajando la gravedad AYUDA en vez de estorbar (par distinto al de subir).
# Hay que bisectar de nuevo, igual criterio que en printer.cfg / docs/BITACORA.md.
#
# 🚀 ATAJO PARA CALIBRAR SIN REINICIAR: a diferencia de la calibracion de
# arriba (que se hizo escribiendo driver_SGT en printer.cfg + FIRMWARE_RESTART
# en cada intento), aqui se prueba con SET_TMC_FIELD, que cambia el registro
# EN CALIENTE, sin reiniciar Klipper. Por eso esta macro acepta SGT= como
# parametro de prueba. Uso para calibrar:
#   MARCO_HOME                                -> asegura el cero de arriba
#   MARCO_HOME_ABAJO SGT=0 VELOCIDAD=20        -> primera prueba
#   MARCO_HOME_ABAJO SGT=<otro> VELOCIDAD=20   -> repetir subiendo/bajando SGT
#     - dispara antes de llegar al tope (o "casi de inmediato") -> muy
#       sensible -> SUBIR SGT
#     - llega al tope y sigue girando/salta pasos sin disparar -> poco
#       sensible -> BAJAR SGT
#     - llega y dispara ahi, de un solo toque limpio, repetible -> listo
# Antes de cada intento, SUBIR el marco de vuelta al cero con MARCO_HOME (no
# MARCO_TEST): asi cada prueba arranca desde una referencia real conocida, no
# desde donde haya quedado tras el intento anterior.
# UNA VEZ encontrado el valor bueno: escribirlo en printer.cfg como
# driver_SGT_MARCO_ABAJO (variable de la macro, ver abajo) y desplegar, para
# que sobreviva a un FIRMWARE_RESTART -- SET_TMC_FIELD NO es permanente, se
# pierde en cada reinicio.
# ==========================================================================

[gcode_macro MARCO_HOME_ABAJO]
description: Baja el marco hasta el tope de abajo (StallGuard) -- EN CALIBRACION, ver la nota arriba
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}

    {% set tmc  = printer.configfile.settings['tmc5160 manual_stepper marco'] %}
    {% set v    = params.VELOCIDAD | default(20) | float %}
    {% set dist = params.DISTANCIA | default(100) | float %}
    {% set home_cur = params.CORRIENTE | default(0.6) | float %}

    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% if dist <= 0 %}
        { action_raise_error("DISTANCIA debe ser mayor que 0 (recibido: " ~ dist ~ ").") }
    {% endif %}
    {% if home_cur <= 0 %}
        { action_raise_error("CORRIENTE debe ser mayor que 0 (recibido: " ~ home_cur ~ ").") }
    {% endif %}

    {% if 'SGT' in params %}
        # Prueba en caliente durante la calibracion -- ver la nota larga arriba.
        SET_TMC_FIELD STEPPER=marco FIELD=sgt VALUE={params.SGT | int}
    {% else %}
        { action_raise_error("Todavia no hay un driver_SGT de ABAJO calibrado: pasa SGT=<valor> para probar (ver la nota de calibracion en macros_marco.cfg).") }
    {% endif %}

    SET_TMC_CURRENT STEPPER=marco CURRENT={home_cur}
    # G4 P2000 (2 s), no P300 -- misma razon que en MARCO_HOME (ver su nota):
    # sin pausa suficiente, la bandera de stall del driver puede seguir
    # marcada del movimiento anterior (docs/TMC_Drivers.md de Klipper).
    G4 P2000

    MANUAL_STEPPER STEPPER=marco ENABLE=1
    # NO se hace SET_POSITION=0 aqui: el punto de partida tiene que ser el
    # cero real de arriba (correr MARCO_HOME justo antes), para que la
    # distancia recorrida signifique algo.
    # 🐞 MISMO BUG DEL SIGNO que en _MARCO_BAJAR, pero este es PREEXISTENTE
    # (venia de la version original de esta macro, 2026-09-16): MOVE={-1.0 * dist}
    # se renderiza POSITIVO, asi que esta macro SUBIA en vez de bajar. Ver la
    # explicacion completa en _MARCO_BAJAR, mas abajo. Arreglado el 2026-09-17
    # al validar la feature 011. 🚨 NO ESTABA PROBADO EN MAQUINA: la calibracion
    # de su driver_SGT quedo a medias, asi que esto nunca llego a verse.
    {% set destino = 0.0 - dist %}
    MANUAL_STEPPER STEPPER=marco MOVE={destino} SPEED={v} STOP_ON_ENDSTOP=home
    M400

    SET_TMC_CURRENT STEPPER=marco CURRENT={tmc.run_current}
    G4 P300

    # INVALIDA el home (feature 011): esta macro deja el marco ABAJO y es de
    # CALIBRACION -- si StallGuard no dispara, el eje salta pasos contra el tope
    # y la posicion logica deja de valer. Tras usarla hay que volver a MARCO_HOME
    # antes de que el ciclo pueda bajar el marco.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=homed VALUE=0
    # Pero la POSICION si se sabe, y es ABAJO (feature 012): el cero no vale,
    # pero el marco esta apoyado en el tope de abajo. Decirlo es lo que hace que
    # START lo bloquee, que es lo correcto -- callarlo dejaria arrancar el ciclo
    # con el cuadro abajo.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=2

    M118 Marco abajo (home StallGuard): tope detectado.


# ==========================================================================
# INTEGRACION CON EL CICLO DE IMPRESION  (feature 011)
# ==========================================================================
# QUE HACE: el marco BAJA antes de imprimir una pieza y SUBE al terminarla.
# Baja al principio de _IMPRIMIR_PASADA (tras el embarre, feature 013) y sube al final, asi que TODO el movimiento
# de la cabeza (viaje en vacio + pasada que imprime) ocurre con el marco abajo,
# y al terminar el marco SIEMPRE queda arriba -> el plato nunca indexa con el
# marco bajado. Decision de Erwin (2026-09-17) frente a la alternativa de
# bajarlo solo alrededor de la pasada de impresion.
#
# 🚨 EL CICLO QUE YA ESTABA VALIDADO NO SE TOCA. En PRINT_CYCLE solo se
# insertan DOS llamadas (_MARCO_BAJAR al principio, _MARCO_SUBIR al final);
# los cuatro movimientos de la cabeza quedan letra por letra como estaban. Y
# con marco_en_ciclo = 0 (el DEFAULT) las dos macros no hacen absolutamente
# nada: el comportamiento es identico al de antes de esta feature. Se activa
# a proposito con  SET_CYCLE MARCO=SI.
#
# POSICION POR DISTANCIA FIJA, NO POR STALLGUARD. El marco baja a una posicion
# ABSOLUTA medida desde el cero de arriba que fija MARCO_HOME. No se usa
# MARCO_HOME_ABAJO en el ciclo por dos razones: (1) su driver_SGT no esta
# calibrado todavia (la macro aborta si no le pasas SGT= a mano), y (2) topar
# contra el tope de abajo en CADA pieza castiga la mecanica sin necesidad.
#
# VALORES POR DEFECTO = LOS QUE ERWIN VALIDO A MANO EN MAQUINA (2026-09-17)
# con  MARCO_TEST SENTIDO=-1 DISTANCIA=110 VELOCIDAD=1000 ACCEL=3000:
#   marco_abajo = 110   ·   marco_speed = 1000   ·   marco_accel = 3000
# OJO con ACCEL: 3000 es MAS que el accel de [manual_stepper marco] (2000), por
# eso se pasa EXPLICITO en cada MANUAL_STEPPER de aqui. No heredar el de la
# config -- si alguien la cambia, estos movimientos cambiarian en silencio.
# OJO tambien: estos valores NO afectan a MARCO_HOME, que fija su propio
# ACCEL=100 porque driver_SGT=6 se calibro con ese accel (ver su nota).
# ==========================================================================


# --- Estado del marco (NO llamar a mano) ----------------------------------
# 'homed' existe por la misma razon que en index y screen: esta version de
# Klipper NO publica el objeto manual_stepper en el status, asi que la unica
# forma de saber si el cero del marco significa algo es llevarlo a mano.
# Sin este flag, el ciclo bajaria 110 unidades desde una referencia inventada
# -- contra la paleta, y sin E-stop.
[gcode_macro _MARCO]
description: Estado del marco (interna, no llamar)
# 0 = el cero del marco NO es de fiar (nunca se homeo, o se perdio)
variable_homed: 0
# DONDE ESTA EL MARCO (feature 012). Existe por la misma razon que 'homed':
# Klipper NO publica el objeto manual_stepper, asi que la unica posicion
# conocida es la que se apunta a mano al mandar cada movimiento.
#   0 = DESCONOCIDA   ·   1 = ARRIBA   ·   2 = ABAJO
# TRES estados y no un booleano porque las dos guardas que lo usan piden
# certezas OPUESTAS:
#   - bajar el squeegee exige certeza de ABAJO      -> DESCONOCIDA bloquea
#   - bloquear START / INDEX exige certeza de ABAJO -> DESCONOCIDA deja pasar
# Si START exigiera "pos == ARRIBA", una maquina con MARCO=NO y el cuadro
# bajado a mano quedaria bloqueada tras cada FIRMWARE_RESTART (donde pos
# vuelve a 0) sin forma de desbloquearla. Por eso SOLO el 2 bloquea.
# Y se escribe SIEMPRE despues del M400, nunca antes: si el movimiento se
# corta a medias, el estado no debe decir ARRIBA con el cuadro a media altura.
variable_pos: 0
# Techo anti-tecleo del recorrido de bajada, en unidades del eje. NO es un
# limite mecanico medido (el marco sigue sin position_min/max): es la misma
# red de seguridad que _INDEX.vel_max, para que un MARCO_ABAJO=1100 en vez de
# 110 se cace antes de mover nada.
variable_abajo_max: 200
gcode:
    # (vacio a proposito: solo guarda estado)


# ==========================================================================
# EL MOVIMIENTO DEL MARCO VIVE EN UN SOLO SITIO  (refactor de la feature 012)
# ==========================================================================
# Hay CUATRO formas de mover el marco y UNA sola pareja de macros que lo mueve:
#
#   _MARCO_BAJAR / _MARCO_SUBIR  ->  el ciclo automatico (solo si MARCO=SI)
#   MARCO_ABAJO  / MARCO_ARRIBA  ->  el operador (pantalla MANUAL, o consola)
#                                     SIEMPRE, tambien con MARCO=NO
#          ambas llaman a:
#   _MARCO_GO_ABAJO / _MARCO_GO_ARRIBA   <- el movimiento de verdad
#
# POR QUE: la feature 012 necesita que los botones del marco muevan aunque el
# marco NO entre en el ciclo (MARCO=NO), y _MARCO_BAJAR/_MARCO_SUBIR no emiten
# ni un comando en ese caso -- es su razon de ser. Copiar el MANUAL_STEPPER en
# una macro nueva habria dejado DOS sitios que hay que mantener iguales, que es
# justo lo que el repo se prohibe a si mismo en _INDEX_AVANZAR_UNA.
#
# 🚨 LO QUE EJECUTA EL CICLO NO CAMBIA. _MARCO_BAJAR con MARCO=NO sigue sin
# emitir nada, y con MARCO=SI emite exactamente el mismo movimiento de antes.
# La asimetria de la feature 011 se conserva letra por letra:
#   - al BAJAR se ABORTA si no hay home (bajar desde un cero falso estrella el
#     marco contra la paleta, y el error corta PRINT_CYCLE entero)
#   - al SUBIR se AVISA y se sigue (es el paso de cierre: abortar dejaria el
#     marco abajo y el ciclo muerto a medias -- leccion del _carousel_loop)
# ==========================================================================


# --- El movimiento de bajada (interna, no llamar) -------------------------
# Sin guarda de ciclo y sin guarda de home A PROPOSITO: las ponen los cuatro
# llamadores, cada uno con su politica. Mismo reparto que _INDEX_AVANZAR.
[gcode_macro _MARCO_GO_ABAJO]
description: Mueve el marco a la posicion de abajo (interna, no llamar)
gcode:
    {% set v     = printer.save_variables.variables %}
    {% set abajo = params.DISTANCIA | default((v.marco_abajo) | default(110))  | float %}
    {% set spd   = params.VELOCIDAD | default((v.marco_speed) | default(1000)) | float %}
    {% set acc   = params.ACCEL     | default((v.marco_accel) | default(3000)) | float %}
    {% set techo = printer['gcode_macro _MARCO'].abajo_max | float %}

    {% if abajo <= 0 %}
        { action_raise_error("marco_abajo debe ser mayor que 0 (vale " ~ abajo ~ "). Se mide como distancia HACIA ABAJO desde el cero de arriba. Ajusta con SET_CYCLE MARCO_ABAJO=110.") }
    {% endif %}
    {% if abajo > techo %}
        { action_raise_error("marco_abajo " ~ abajo ~ " pasa del techo de " ~ techo ~ " unidades (variable_abajo_max en la macro _MARCO). Es una red anti-error de tecleo, no un limite mecanico. El marco NO se ha movido.") }
    {% endif %}
    {% if spd <= 0 or acc <= 0 %}
        { action_raise_error("marco_speed y marco_accel deben ser mayores que 0 (valen " ~ spd ~ " / " ~ acc ~ ").") }
    {% endif %}

    # POSICION DESCONOCIDA MIENTRAS SE MUEVE (feature 012), y el valor bueno
    # solo despues del M400. Si el movimiento se corta a medias, el estado dice
    # DESCONOCIDA -- que es la verdad -- en vez de ARRIBA o ABAJO.
    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # Posicion ABSOLUTA respecto del cero de arriba: negativa = abajo
    # (SENTIDO=-1 de MARCO_TEST). Absoluta y no relativa a proposito -- asi
    # dos bajadas seguidas por un fallo no se suman una encima de otra.
    MANUAL_STEPPER STEPPER=marco ENABLE=1
    # 🐞 EL SIGNO VA EN UNA VARIABLE, NO EN LA EXPRESION DEL MOVE.
    # Escribir MOVE={-1.0 * abajo} NO FUNCIONA y no da ningun error: Klipper
    # crea el entorno jinja con los delimitadores de variable { y } (no las
    # dobles llaves de jinja normal), asi que el "-" pegado a la llave se
    # come como el marcador de control de espacios en blanco ({- ... }) y la
    # expresion queda en 1.0 * abajo -> POSITIVO -> el marco SUBE contra la
    # pared a 1000/s en vez de bajar. Detectado el 2026-09-17 renderizando
    # las macros con jinja2 antes de desplegar, no en la maquina.
    # Desde la feature 012 el validador lo caza solo: falla si encuentra "{-".
    {% set destino = 0.0 - abajo %}
    {% if params.SYNC | default(1) | int == 0 %}
        # FEATURE 015: SYNC=0 -> se ENCOLA el movimiento y se vuelve YA, sin M400 y SIN
        # apuntar pos=2 (queda 0 = DESCONOCIDA, que es la verdad mientras se mueve).
        # Arranca en el final de la cola del toolhead (manual_stepper.sync_print_time),
        # asi que el G1 que se encole DESPUES arranca en el mismo instante.
        # Quien llame con SYNC=0 TIENE que cerrar con _MARCO_ESPERAR_ABAJO.
        MANUAL_STEPPER STEPPER=marco MOVE={destino} SPEED={spd} ACCEL={acc} SYNC=0
    {% else %}
        MANUAL_STEPPER STEPPER=marco MOVE={destino} SPEED={spd} ACCEL={acc}
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=2
    {% endif %}


# --- El movimiento de subida (interna, no llamar) -------------------------
[gcode_macro _MARCO_GO_ARRIBA]
description: Devuelve el marco a la posicion de arriba (interna, no llamar)
gcode:
    {% set v      = printer.save_variables.variables %}
    {% set arriba = (v.marco_arriba) | default(0) | float %}
    {% set spd    = params.VELOCIDAD | default((v.marco_speed) | default(1000)) | float %}
    {% set acc    = params.ACCEL     | default((v.marco_accel) | default(3000)) | float %}

    {% if spd <= 0 or acc <= 0 %}
        { action_raise_error("marco_speed y marco_accel deben ser mayores que 0 (valen " ~ spd ~ " / " ~ acc ~ ").") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=0

    # marco_arriba = 0 (default) devuelve el marco EXACTAMENTE al cero de
    # MARCO_HOME, que es la pared de arriba: sube los mismos 110 que bajo, en
    # sentido contrario. Si algun dia el toque contra la pared al subir suena
    # brusco o salta pasos a 1000/s, se le deja margen con un valor NEGATIVO
    # chico (SET_CYCLE MARCO_ARRIBA=-2) sin tocar ninguna macro.
    MANUAL_STEPPER STEPPER=marco ENABLE=1
    {% if params.SYNC | default(1) | int == 0 %}
        # FEATURE 015: igual que en _MARCO_GO_ABAJO. Cerrar con _MARCO_ESPERAR_ARRIBA.
        MANUAL_STEPPER STEPPER=marco MOVE={arriba} SPEED={spd} ACCEL={acc} SYNC=0
    {% else %}
        MANUAL_STEPPER STEPPER=marco MOVE={arriba} SPEED={spd} ACCEL={acc}
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=1
    {% endif %}


# --- Bajar el marco (paso 0 del ciclo) ------------------------------------
[gcode_macro _MARCO_BAJAR]
description: Baja el marco a la posicion de impresion (interna, no llamar)
gcode:
    {% set v = printer.save_variables.variables %}
    {% if (v.marco_en_ciclo) | default(0) | int == 1 %}
        # 🚨 GUARDA DE HOME. Se aborta, no se avisa: bajar el marco desde un
        # cero falso lo estrella contra la paleta. El error corta PRINT_CYCLE
        # entero, asi que el squeegee tampoco baja.
        {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
            { action_raise_error("El marco NO tiene HOME: no se puede bajar al imprimir. Haz MARCO_HOME (o HOME_OP, que ya lo encadena). Si no quieres el marco en el ciclo: SET_CYCLE MARCO=NO.") }
        {% endif %}
        # Sin SYNC la linea es EXACTAMENTE la de antes de la feature 015.
        {% if params.SYNC | default(1) | int == 0 %}
            _MARCO_GO_ABAJO SYNC=0
        {% else %}
            _MARCO_GO_ABAJO
        {% endif %}
    {% endif %}


# --- Subir el marco (paso final del ciclo) --------------------------------
[gcode_macro _MARCO_SUBIR]
description: Devuelve el marco a la posicion de arriba (interna, no llamar)
gcode:
    {% set v = printer.save_variables.variables %}
    {% if (v.marco_en_ciclo) | default(0) | int == 1 %}
        # AQUI SE AVISA, NO SE ABORTA (al reves que al bajar). Este es el paso
        # de CIERRE: si aborta, deja el marco abajo y el ciclo muerto a medias,
        # que es peor que no subirlo. Misma leccion ya aprendida en la salida
        # del _carousel_loop (ver macros_ciclo.cfg). Subir sin home no se
        # intenta porque sin cero no se sabe cuanto hay que subir.
        {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
            M118 AVISO: el marco no tiene HOME, no se sube. Comprueba a mano donde quedo antes de mover el plato.
        {% elif params.SYNC | default(1) | int == 0 %}
            _MARCO_GO_ARRIBA SYNC=0
        {% else %}
            _MARCO_GO_ARRIBA
        {% endif %}
    {% endif %}


# --- Esperar a que el marco acabe (feature 015) ---------------------------
# Cierran un _MARCO_BAJAR/_MARCO_SUBIR llamado con SYNC=0: MANUAL_STEPPER SYNC=1
# SIN MOVE hace que el toolhead espere hasta que el marco termine (M400 solo
# espera al toolhead, igual que con el plato en la feature 013), y solo DESPUES
# se apunta la posicion. Mismas guardas que BAJAR/SUBIR: si BAJAR/SUBIR no movio
# nada (MARCO=NO, o subir sin home) tampoco se espera ni se apunta nada.
[gcode_macro _MARCO_ESPERAR_ABAJO]
description: Espera a que el marco termine de bajar y apunta pos=ABAJO (interna, feature 015)
gcode:
    {% if (printer.save_variables.variables.marco_en_ciclo) | default(0) | int == 1 and printer['gcode_macro _MARCO'].homed | int == 1 %}
        MANUAL_STEPPER STEPPER=marco SYNC=1
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=2
    {% endif %}


[gcode_macro _MARCO_ESPERAR_ARRIBA]
description: Espera a que el marco termine de subir y apunta pos=ARRIBA (interna, feature 015)
gcode:
    {% if (printer.save_variables.variables.marco_en_ciclo) | default(0) | int == 1 and printer['gcode_macro _MARCO'].homed | int == 1 %}
        MANUAL_STEPPER STEPPER=marco SYNC=1
        M400
        SET_GCODE_VARIABLE MACRO=_MARCO VARIABLE=pos VALUE=1
    {% endif %}


# --- Bajar el marco a mano (operador / pantalla MANUAL) -------------------
# NO MIRA marco_en_ciclo A PROPOSITO (feature 012): el boton que se ve, mueve.
# Que el marco entre o no en el ciclo automatico es una decision del ciclo, no
# del operador que esta trabajando paso a paso.
[gcode_macro MARCO_ABAJO]
description: Baja el marco a la posicion de impresion (pantalla MANUAL / rescate)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}
    {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
        { action_raise_error("El marco no tiene HOME: bajarlo desde un cero falso lo estrella contra la paleta. Haz MARCO_HOME (o HOME_OP, que ya lo encadena).") }
    {% endif %}
    # OJO, NO CONFUNDIR: esta macro (MARCO_ABAJO) mueve el marco. El parametro
    # SET_CYCLE MARCO_ABAJO=110 guarda la DISTANCIA. Se llaman igual pero viven
    # en espacios de nombres distintos (macro vs parametro), asi que Klipper no
    # se queja -- y no hay que "arreglarlo" renombrando ninguno de los dos.
    _MARCO_GO_ABAJO {rawparams}
    M118 Marco abajo.


# --- Subir el marco a mano (operador / rescate) ---------------------------
# Para que sirve: si PRINT_CYCLE aborta a media pieza (se pierde el home de la
# cabeza, un error cualquiera), el marco se queda ABAJO -- igual que el
# squeegee se quedaria donde estuviera. Esto lo devuelve arriba sin tener que
# rehomear ni reiniciar. Tambien es el boton MARCO ARRIBA de la pantalla MANUAL.
[gcode_macro MARCO_ARRIBA]
description: Devuelve el marco a la posicion de arriba (pantalla MANUAL / rescate tras un ciclo abortado)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el marco.") }
    {% endif %}
    {% if printer['gcode_macro _MARCO'].homed | int != 1 %}
        { action_raise_error("El marco no tiene HOME: no se sabe donde esta el arriba. Haz MARCO_HOME.") }
    {% endif %}

    _MARCO_GO_ARRIBA {rawparams}
    M118 Marco arriba.
