[include fluidd.cfg]
[include macros_ciclo.cfg]
[include macros_screen.cfg]
[include macros_index.cfg]
[include macros_marco.cfg]
[include macros_manual.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_47002D000951303532383235-if00

[virtual_sdcard]
path: /home/aspe/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 350
max_accel: 3000
max_z_velocity: 20
max_z_accel: 100

[force_move]
enable_force_move: True

# --- Ejes CoreXY: X = squeegee (X+ sube, lado seguro), Y = stroke ---

# El home de X va al máximo para que caiga del lado seguro (squeegee arriba).
# rotation_distance no está calibrado a la geometría real: X está en unidades
# lógicas, no en mm (recorrido físico del squeegee ≈ 130 mm).
[stepper_x]
position_min: -300
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
# 32 microsteps reducen el ruido del stroke. Las posiciones no dependen de este
# valor; si G28 deja de disparar limpio, recalibrar driver_SGT.
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: 280
position_max: 300
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
# En CoreXY el stroke mueve los dos motores: microsteps igual que stepper_x.
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 0
position_max: 200
# StallGuard depende de la velocidad de home: si cambia homing_speed, recalibrar
# driver_SGT de [tmc5160 stepper_y] por bisección.
homing_speed: 50
homing_retract_dist: 0

# Placeholder sin hardware: la cinemática corexy exige [stepper_z].
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0
position_max: 100
homing_speed: 10

# Driver TMC5160T Plus (0.022 Ω). Motor 23HS32-4004S: 4.0 A pico/fase,
# RMS seguro ≈ 4.0 × 0.707 × 0.8 ≈ 2.26 A; 2.0 A deja margen. Verificar el
# modelo de motor montado antes de subir run_current.
[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
run_current: 2.000
sense_resistor: 0.022
stealthchop_threshold: 0
diag1_pin: ^!PG6
driver_SGT: 6  # TODO: recalibrar; se ajustó con el driver anterior (0.075 Ω)

# Mismo driver y motor que stepper_x.
[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
run_current: 2.000
sense_resistor: 0.022
stealthchop_threshold: 0
diag1_pin: ^!PG9
driver_SGT: 6  # TODO: confirmar que el home es repetible con homing_speed 50


# --- Homing sensorless con corriente reducida ---
# Baja X/Y a 0.9 A durante el G28 (menos fuerza contra el tope y StallGuard más
# sensible) y restaura run_current al terminar.
# Usar G28 X / G28 Y / G28 X Y; un G28 sin ejes intentaría homear el Z placeholder.
[gcode_macro G28]
rename_existing: G28.1
gcode:
    # Con la cabeza desmontada el motor de X está desconectado: al energizarlo el
    # driver reporta OpenLoad y Klipper entra en shutdown. simular_impresion es la
    # única señal de "cabeza no montada"; no se duplica en otra variable.
    {% if (printer.save_variables.variables.simular_impresion) | default(0) | int == 1 %}
        { action_raise_error("SIMULACION activa: la cabeza no esta montada y el motor de X esta desconectado, asi que G28 apagaria Klipper. Cuando montes la cabeza: SET_CYCLE SIMULAR=0") }
    {% endif %}

    {% set HOME_CUR = 0.900 %}
    {% set RUN_X = printer.configfile.settings['tmc5160 stepper_x'].run_current %}
    {% set RUN_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G4 P300
    G28.1 {rawparams}
    G4 P300
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_Y}


# --- Screen: indexado de tallas (MOTOR3) ---
# Home sensorless (StallGuard) contra el tope mecánico del mínimo, girando el
# motor en sentido horario visto desde el eje. Macro: SCREEN_HOME en
# macros_screen.cfg.
#   - El jumper DIAG de MOTOR3 debe estar puesto: lleva la señal DIAG del driver
#     a PG11. Sin él StallGuard nunca dispara y el carro choca saltando pasos.
#   - No conectar ningún switch a DIAG3: compartiría la línea con el driver.
# rotation_distance 49.87: piñón de 20 dientes 32 DP sobre cremallera
# (McMaster 6832K52, diámetro de paso 0.625" → π × 0.625"), valor de catálogo.
#   Las tallas de macros_screen.cfg están en mm y dependen de él: si XS→3XL no
#   mide 685.8 mm, corregir a 49.87 × 685.8 / medido.
# position_max 700: 3XL a 685.8 mm del tope más margen para offset_mm; no es el
#   recorrido físico medido.
# El [tmc5160] debe declararse antes que el [manual_stepper]: este resuelve su
# endstop_pin al cargar y el pin virtual "tmc5160_screen" aún no existiría
# ("Unknown pin chip name").

[tmc5160 manual_stepper screen]
cs_pin: PC7
spi_bus: spi1
run_current: 2.000
sense_resistor: 0.075
stealthchop_threshold: 0
interpolate: True
diag1_pin: ^!PG11
driver_SGT: 4  # Calibrado a ~1 vuelta/s, CORRIENTE=1.0 y ~25 vueltas/s² (0 dispara antes del tope, 5 no dispara). Si cambia velocidad, corriente o accel del home, rebisecar con SCREEN_HOME SGT=n.

[manual_stepper screen]
step_pin: PG4
# Polaridad verificada con el cableado actual. Si se recablea el motor,
# comprobar el sentido con una DISTANCIA corta antes de homear.
dir_pin: !PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 49.87
velocity: 80
accel: 1000
endstop_pin: tmc5160_screen:virtual_endstop
position_min: -3
position_max: 700


# --- Index: carrusel de 4 estaciones (MOTOR4), reducción 6:1 ---
# Macros en macros_index.cfg. La unidad del eje es el grado del plato:
# rotation_distance = 360 / 6 = 60 (MOVE=90 avanza una estación). Si la
# reducción real cambia, se corrige solo aquí. SENTIDO=1 = horario visto desde arriba.
#
# Alimentación: el TMC5160T Plus no se alimenta del zócalo, necesita su bornero
# HVIN/GND. Sin él el motor queda suelto con Klipper en 'ready' y sin errores
# (el SPI funciona con la lógica). HVIN a 24 V, nunca a 48 V: el módulo comparte
# el zócalo con la placa y 48 V podrían entrar al riel de 24 V de la Octopus.
#
# Cableado: identificar el conector por su rótulo impreso, no contando
# posiciones (MOTOR2 tiene dos conectores, así que la numeración se desfasa).
# No conectar ni desconectar el motor con los 24 V puestos.
#
# run_current 2.8 A ≈ 70 % de los 4.0 A RMS nominales del 86HS8040A4JEP: el eje
# queda energizado sujetando posición entre avances y al 100 % se calentaría.
# TODO: validar con el plato cargado (varios avances de 90°, QUERY_ENDSTOPS y
# temperatura). Hay margen hasta 4.0 A si sigue perdiendo pasos.

[manual_stepper index]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
# 32 microsteps suavizan la aspereza de SpreadCycle a baja velocidad (INDEX_HOME
# corre a 15 °/s). 90° siguen siendo un número exacto de pasos:
# 200 × 32 / 60 × 90 = 9600. Si no basta, este eje puede usar StealthChop: no
# depende de StallGuard porque homea con el inductivo de PG12.
microsteps: 32
rotation_distance: 60
# velocity: valor por defecto de _INDEX_AVANZAR, INDEX_NEXT, INDEX_GOTO,
# INDEX_DEMO e INDEX_TEST. A 300 °/s el plato cargado deriva (25° en 720°): la
# fuerza contraelectromotriz a 24 V se come el par. 180 deja un 40 % de margen,
# necesario porque la pérdida de pasos aquí es silenciosa.
# accel 800: la pérdida de pasos aparece en la rampa de arranque, que exige más
# par al subir accel. TODO: revalidar con el plato cargado y run_current 2.8 A.
# INDEX_HOME usa su propia velocidad (15 °/s) porque su parada no tiene rampa.
velocity: 180
accel: 800
endstop_pin: ^!PG12    # Inductivo NPN NO del home; ver polaridad abajo.
# Sin position_min/position_max: el eje gira sin límite. El endstop solo se
# consulta con STOP_ON_ENDSTOP, así que no limita INDEX_TEST.
#
# Polaridad (NPN normalmente abierto con pull-up): sin target el pin queda alto
# → 'open'; con target conduce a GND → 'TRIGGERED'. Un sensor desconectado debe
# leer 'open'. Si QUERY_ENDSTOPS sale al revés, usar '^PG12'.

[tmc5160 manual_stepper index]
cs_pin: PF2
spi_bus: spi1
run_current: 2.800
# El TMC5160T Plus usa 0.022 Ω. Con 0.075 la corriente real sería ~3.4 veces la pedida.
sense_resistor: 0.022
stealthchop_threshold: 0
interpolate: True


# --- Marco: sube/baja el cuadro (MOTOR7) ---
# MOTOR6 no se usa porque su DIAG comparte PG14 con el paro de emergencia.
# No confundir con 'screen', que mueve las tallas en horizontal.
#
# Precauciones de hardware (las mismas que en index):
#   - Identificar el zócalo por el rótulo "MOTOR7", no contando posiciones.
#   - El TMC5160T Plus necesita su bornero HVIN a 24 V (nunca 48 V).
#   - No conectar ni desconectar el motor con los 24 V puestos.
#   - El jumper DIAG de MOTOR7 debe estar puesto (home sensorless). Sin él
#     StallGuard no dispara ni con driver_SGT=-64 y el motor sigue girando
#     contra el tope. En index, que homea con sensor físico, va quitado.
#
# SENTIDO=1 sube, SENTIDO=-1 baja (verificado con dir_pin PA14).
# rotation_distance 40 es un placeholder: falta conocer el mecanismo de elevación.
# run_current, velocity y accel son conservadores hasta tener datos del motor.
# Home sensorless contra el tope mecánico de arriba (detección por DIAG7/PG15).
# TODO: definir position_min/max cuando se conozca la posición segura inferior.
#
# El [tmc5160] debe declararse antes que el [manual_stepper]: este resuelve su
# endstop_pin al cargar y el pin virtual "tmc5160_marco" aún no existiría. X/Y no
# tienen este problema porque sus steppers se cargan después, desde la cinemática.
[tmc5160 manual_stepper marco]
cs_pin: PD3
spi_bus: spi1
run_current: 1.200
sense_resistor: 0.022
stealthchop_threshold: 0
interpolate: True
diag1_pin: ^!PG15
driver_SGT: 6  # Calibrado para MARCO_HOME con VELOCIDAD=100 y ACCEL=100 (3 dispara antes de tiempo; 10 no dispara). StallGuard depende de la velocidad: si cambian velocidad, corriente de home o mecánica, rebisecar.

[manual_stepper marco]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
velocity: 10
# accel para movimientos normales. MARCO_HOME fija su propio ACCEL=100 en
# macros_marco.cfg porque driver_SGT se calibró con ese valor.
accel: 2000
endstop_pin: tmc5160_marco:virtual_endstop


# --- Sensor de parte (fotoeléctrico difuso NPN) ---
# Fotoeléctrico porque un inductivo no detecta la prenda. Polaridad ^!PG13:
# sin objeto RELEASED, con objeto PRESSED (QUERY_BUTTON BUTTON=part_sensor).
#
# El callback de [gcode_button] usa run_script(), que toma el mutex del gcode:
# mientras corre una macro, el gcode del botón se encola y se ejecuta al terminar
# el comando de nivel superior. Consecuencias:
#   - El flag 'part' se lee en el tick siguiente del bucle del ciclo, nunca en el
#     mismo; entre ticks se libera el mutex y entra el gcode del botón.
#   - No hay release_gcode a propósito: la cola descarga los pares press/release
#     en orden y termina en release, así que limpiar 'part' ahí borraría siempre
#     la detección.
# _INDEX_PART_CLEAR limpia el flag al empezar cada avance y en INDEX_HOME, así
# que part = 1 significa "pasó una pieza durante el último avance".
# TODO: confirmar que la detección cae dentro del avance carga→pintado y que el
# sensor no ve la prenda que sale.

# --- Idle timeout ---
# Su M84 pasa por el interceptor de macros_ciclo.cfg, que invalida los homes de
# index y screen. No dispara durante un ciclo: el bucle se reagenda cada 0.2-0.4 s.
# Advertencia: mientras el squeegee no tenga tope físico, desenergizar X puede
# dejarlo caer sobre la malla; reducir el timeout es una decisión de seguridad.
[idle_timeout]
timeout: 600
gcode:
    {% if 'heaters' in printer %}
        TURN_OFF_HEATERS
    {% endif %}
    M118 Inactividad de 10 min: se desenergizan los motores.
    M84


[gcode_button part_sensor]
pin: ^!PG13
press_gcode:
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part VALUE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part_eventos VALUE={ (printer['gcode_macro _INDEX'].part_eventos | int) + 1 }
# Sin release_gcode a propósito (ver la nota del sensor de parte).


# --- Paro de emergencia ---
# Seta con dos contactos:
#   - NC en serie con los 24 V de los drivers de motor (no de la Pi ni la placa):
#     corta los motores por hardware, sin depender de Klipper.
#   - NA en PG14: avisa a Klipper.
# TODO: cablear el NC. Mientras tanto, el único paro es el shutdown por software
# del press_gcode.
#
# action_emergency_stop() se ejecuta durante el render de la plantilla, antes de
# que gcode_button pida el mutex del gcode, así que para en decenas de ms (igual
# que el E-STOP de Fluidd). Un gcode normal (M84, PARO_EMERGENCIA) esperaría al
# fin del comando en curso, y M84 además espera a vaciar la cola de movimientos.
# Consecuencias del shutdown:
#   - Solo se sale con FIRMWARE_RESTART (botón RESET de la pantalla), que
#     invalida todos los homes.
#   - Nada después del action_ se ejecuta; el shutdown ya desenergiza los motores.
#   - Se pierden las variables de macro (p. ej. _CYCLE_STATE.count); lo guardado
#     en variables.cfg se conserva.
#   - Si la seta sigue enclavada al reiniciar, vuelve a disparar: hay que
#     liberarla antes de recuperar.
#
# Polaridad ^!PG14: con ^PG14 QUERY_BUTTON leía PRESSED en reposo. Si se
# recablea, reverificar con QUERY_BUTTON BUTTON=paro_emergencia.
#
# _ESTOP, PARO_EMERGENCIA y RESET_ESTOP permiten el aviso por gcode sin shutdown;
# para usarlo, cambiar el press_gcode por PARO_EMERGENCIA.

[gcode_macro _ESTOP]
# active: aviso visible en pantalla. fisico: el NA está presionado ahora.
variable_active: 0
variable_fisico: 0
gcode:
    # Solo guarda estado.

[gcode_macro PARO_EMERGENCIA]
description: Aviso de que se presiono el paro de emergencia (NA). El corte real de los motores ya lo hizo el NC en hardware; esto solo deja a Klipper y a la pantalla al tanto.
gcode:
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=fisico VALUE=1
    M84
    M118 PARO DE EMERGENCIA: motores cortados por hardware. Hay que homear de nuevo.

[gcode_macro RESET_ESTOP]
description: Oculta el aviso de paro de emergencia SOLO si el boton fisico ya no esta presionado. NO reenergiza ni homea - eso lo sigue haciendo HOME/HOME_OP.
gcode:
    {% if printer['gcode_macro _ESTOP'].fisico|int == 1 %}
        { action_raise_error("El paro de emergencia sigue presionado. Suelta el boton antes de RESET.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=active VALUE=0

[gcode_button paro_emergencia]
pin: ^!PG14
press_gcode:
    {action_respond_info("PARO DE EMERGENCIA: boton fisico presionado, shutdown inmediato.")}
    {action_emergency_stop("paro de emergencia fisico (boton NA en PG14)")}
release_gcode:
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=fisico VALUE=0
