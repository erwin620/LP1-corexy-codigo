[include fluidd.cfg]
[include macros_ciclo.cfg]
[include macros_screen.cfg]
[include macros_index.cfg]
[include macros_marco.cfg]
[include macros_manual.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_47002D000951303532383235-if00

[virtual_sdcard]
path: /home/aspe/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 350
max_accel: 3000
max_z_velocity: 20
max_z_accel: 100

[force_move]
enable_force_move: True

[stepper_x]
position_min: -300
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
# microsteps 16 -> 32 (2026-09-25, Erwin: el stroke suena mucho). Mismo remedio
# que suavizo el index el 2026-08-17. Las posiciones NO cambian (Klipper los
# saca de rotation_distance). Si G28 deja de disparar limpio, recalibrar driver_SGT.
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: 280
position_max: 300
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
# microsteps 16 -> 32 (2026-09-25): ver la nota de stepper_x. En CoreXY el
# stroke mueve los DOS motores, asi que van siempre iguales.
microsteps: 32
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 0
position_max: 200
# homing_speed 130->50 (2026-09-17), a pedido de Erwin: el home del stroke se
# sentia demasiado rapido comparado con el squeegee. Igualado a la misma
# velocidad que X (homing_speed: 50).
# 🚨 OJO: driver_SGT: 10 de abajo (tmc5160 stepper_y) estaba calibrado PARA
# homing_speed=130. StallGuard depende de la velocidad de home (aprendido en
# vivo calibrando marco, ver docs/BITACORA.md) -- si G28 Y deja de disparar
# limpio (no para en la pared, o para antes de tiempo), hay que RECALIBRAR
# driver_SGT con el mismo procedimiento de biseccion, no asumir que 10 sigue
# sirviendo.
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0
position_max: 100
homing_speed: 10

[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
run_current: 2.000
# sense_resistor 0.022: TMC5160T PLUS (cambiado desde el TMC5160 de 0.075R). Motor
# 23HS32-4004S = 4.0A pico/fase -> RMS seguro = 4.0*0.707*0.8 ~= 2.26A; se deja 2.0A
# con margen. NO subir sin verificar que el motor real montado en X sea este mismo.
sense_resistor: 0.022
stealthchop_threshold: 0
diag1_pin: ^!PG6
driver_SGT: 6  # PENDIENTE re-tunear: calibrado a 1.5A con el driver viejo

[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
run_current: 2.000
# sense_resistor 0.022: TMC5160T PLUS (cambiado desde el TMC5160 de 0.075R). Motor
# 23HS32-4004S = 4.0A pico/fase -> RMS seguro = 4.0*0.707*0.8 ~= 2.26A; se deja 2.0A
# con margen para uso continuo (ciclos repetidos, no impresion unica).
sense_resistor: 0.022
stealthchop_threshold: 0
diag1_pin: ^!PG9
driver_SGT: 6  # ⚠️ Editado directo en la Pi, sin pasar por este repo (detectado 2026-09-17 al refrescar el espejo antes de cerrar la sesion). homing_speed bajo de 130->50 el mismo dia y el driver_SGT:10 viejo quedo roto ("No trigger on stepper_y"); probablemente se reafino a mano con SET_TMC_FIELD. PENDIENTE confirmar con Erwin que 6 es el valor bueno y que quedo validado repetible. Ver docs/BITACORA.md.


# ------------------------------------------------------------------
# Homing sensorless con corriente reducida (calcar Y_CURRENT_HOME 900 de Marlin).
# Baja X/Y a 0.9A durante el G28 y restaura run_current (el de [tmc5160
# stepper_x/y], hoy 2.0A) al terminar.
# Usar: G28 X / G28 Y / G28 X Y  (NO bare G28: Z es placeholder sin motor).
# ------------------------------------------------------------------
[gcode_macro G28]
rename_existing: G28.1
gcode:
    # GUARDA (2026-08-19) - ESTO EVITA QUE UN BOTON TUMBE KLIPPER.
    # Sin la cabeza montada el motor de stepper_x esta DESCONECTADO. En cuanto se
    # le excita, su driver reporta OpenLoad_B (mas un ShortToSupply_A espurio, que
    # es lo que reporta un circuito abierto) y KLIPPER SE APAGA por seguridad. El
    # operador veia "Klipper se desconecto" sin ninguna pista de por que.
    # Con el motor ausente NO hay riesgo de dano: no hay nada que cortocircuitar.
    # El problema es de usabilidad, y en una maquina para vender es inaceptable.
    #
    # Se usa simular_impresion como FUENTE UNICA: ya significa "la cabeza no se
    # toca". Anadir un flag cabeza_montada aparte crearia dos verdades que
    # tarde o temprano se contradicen.
    {% if (printer.save_variables.variables.simular_impresion) | default(0) | int == 1 %}
        { action_raise_error("SIMULACION activa: la cabeza no esta montada y el motor de X esta desconectado, asi que G28 apagaria Klipper. Cuando montes la cabeza: SET_CYCLE SIMULAR=0") }
    {% endif %}

    {% set HOME_CUR = 0.900 %}
    {% set RUN_X = printer.configfile.settings['tmc5160 stepper_x'].run_current %}
    {% set RUN_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G4 P300
    G28.1 {rawparams}
    G4 P300
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_Y}


# ------------------------------------------------------------------
# Feature 004 - screen (indexado de tallas).  Slot MOTOR3 de la Octopus.
# El [stepper_z] placeholder NO se toca (corexy lo exige).
#
# !! HOME SENSORLESS (StallGuard) DESDE 2026-10-08 -- ya NO hay switch fisico.
#   Decision de Erwin: el screen se homea chocando contra el TOPE MECANICO del
#   lado donde estaba el switch (sentido HORARIO, hacia el minimo), igual que
#   marco y X/Y. Macro: SCREEN_HOME en macros_screen.cfg.
#   - 🚨 JUMPER DE DIAG DE MOTOR3: AHORA VA **PUESTO** (al reves que antes).
#     Con switch fisico habia que quitarlo; con sensorless el jumper es lo que
#     lleva la senal DIAG del driver a PG11. Sin el, StallGuard NUNCA dispara
#     y el screen se estampa contra el tope saltando pasos (ya paso con marco).
#   - El switch viejo se DESCONECTA de DIAG3: compartiria la linea con el driver.
#
# !! dir_pin: el home es con el motor girando en sentido HORARIO (mirando el
#   motor de frente, por el lado del eje). El barrido de home va al MINIMO,
#   asi que el sentido NEGATIVO del eje debe ser el horario. Hoy es !PC1
#   (invertido el 2026-10-08, ver la nota junto a dir_pin). Si al probar un
#   movimiento minimo resulta al contrario, quitar o poner el '!'.
#
# !! rotation_distance: 49.87 (2026-10-08) = PINON 20 dientes 32 DP sobre
#   cremallera (McMaster 6832K52, diametro de paso 0.625" -> pi x 0.625"),
#   valor de CATALOGO (eleccion de Erwin; una medicion vieja daba 50.21).
#   Las tallas de macros_screen.cfg estan en mm y DEPENDEN de este valor:
#   si XS->3XL no mide 685.8 mm, corregir aqui = 49.87 * 685.8 / medido.
#   ANTES era 40 (hipotesis de correa GT2 20T, nunca fue la mecanica real).
#
# !! position_max 700: 3XL esta a 685.8 mm del tope + margen para offset_mm.
#   NO es el recorrido fisico medido: si el carro choca antes de 3XL, bajarlo.
#
# !! ORDEN: el [tmc5160 ...] va ANTES que el [manual_stepper ...] A PROPOSITO.
#   manual_stepper resuelve su endstop_pin en el acto, y el pin virtual
#   "tmc5160_screen" solo existe cuando ya cargo el driver (mismo caso que
#   marco: "Unknown pin chip name"). NO reordenar.
# ------------------------------------------------------------------

[tmc5160 manual_stepper screen]
cs_pin: PC7
spi_bus: spi1
run_current: 2.000
sense_resistor: 0.075
stealthchop_threshold: 0
interpolate: True
diag1_pin: ^!PG11
driver_SGT: 4  # CALIBRADO 2026-10-08 a ~1 vuelta/s (VELOCIDAD=40 con rotation_distance 40; hoy 50 con 49.87), CORRIENTE=1.0, ~25 vueltas/s2 (biseccion de Erwin, jumper DIAG PUESTO): 0 = para antes del tope, 5 = "No trigger" casi siempre, 4 = el bueno. Si cambia velocidad/corriente/accel del home, rebisecar con SCREEN_HOME SGT=n.

[manual_stepper screen]
step_pin: PG4
# !PC1 desde 2026-10-08: tras reconectar el motor, SCREEN_HOME iba al tope
# CONTRARIO (bobina invertida al reconectar). Si se vuelve a recablear el
# motor, reverificar el sentido con DISTANCIA corta antes de confiar.
dir_pin: !PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 49.87
velocity: 80
accel: 1000
endstop_pin: tmc5160_screen:virtual_endstop
position_min: -3
position_max: 700


# ------------------------------------------------------------------
# INDEX - CARRUSEL DE ESTACIONES.  ETAPA 1: alta del motor.  Slot MOTOR4.
# Plato de 4 estaciones, reduccion 6:1.  Macros en macros_index.cfg.
#
# El eje se llama 'index' (el nombre de la funcion), no 'carrusel' (el nombre
# de la pieza): es el mismo criterio que 'screen'. El plato SIGUE siendo el
# carrusel en la documentacion y en los mensajes al operador.
#
# ESTADO (validado en maquina el 2026-08-07): el motor GIRA y TIENE PAR, la
# vuelta completa CIERRA EXACTA (confirma el 6:1 y que rotation_distance=60 es
# correcto) y el sentido con SENTIDO=1 es HORARIO visto desde arriba.
# Falta la ETAPA 2: home por inductivo, indexado de las 4 estaciones, sensor
# de parte e integracion con PRINT_CYCLE.
#
# LA UNIDAD DEL EJE ES EL GRADO DEL PLATO:  rotation_distance = 360/6 = 60
#   MOVE=360 -> una vuelta completa del carrusel
#   MOVE=90  -> una estacion
# Si la reduccion real no es 6:1, se corrige AQUI y en ningun otro sitio.
#
# !! ALIMENTACION - EL FALLO SILENCIOSO QUE COSTO UNA SESION ENTERA:
#   El TMC5160T Plus NO se alimenta del zocalo. Lleva su propio bornero
#   HVIN/GND y SIN EL el motor queda COMPLETAMENTE SUELTO, con Klipper 'ready'
#   y sin un solo error (el chip habla por SPI, que va de la logica, pero no
#   hay tension en las bobinas). Los otros tres drivers (X, Y, screen) son
#   modulos mas pequenos y si se alimentan del zocalo: de ahi la confusion.
#   >> HVIN a 24 V, **NUNCA a 48 V**: el modulo aguanta 56 V, pero comparte
#      conexion con la placa por el zocalo y no esta documentado que aisle los
#      dominios -> 48 V pueden entrar hacia atras al riel de 24 V y llevarse
#      la Octopus entera.
#
# !! CABLEADO - la trampa que ya costo una sesion en la feature 004:
#   El numerado de ZOCALOS y el de CONECTORES no coincide. Zocalos MOTOR0-7
#   (MOTOR4 = 5. zocalo), pero hay 9 conectores de salida porque MOTOR2 tiene
#   dos (MOTOR2_1 y MOTOR2_2) -> el conector rotulado MOTOR4 es el 6. de la
#   fila. FIARSE DEL ROTULO IMPRESO, NUNCA DE CONTAR POSICIONES.
#   Nunca enchufar/desenchufar el motor con los 24 V puestos.
#
# !! run_current 2.800 - SUBIDO EL 2026-09-09: motor real es el 86HS8040A4JEP,
#   4.0 A RMS/eficaz de placa (confirmado por Erwin, NO pico -- motor de mas
#   capacidad que el original de 3.0 A pico que tenia esta cifra antes).
#   4.0 A ES EL TECHO, NO EL VALOR DE TRABAJO. Se adopta 2.8 A (~70% del
#   nominal, el mismo criterio ya usado aqui) porque este eje QUEDA
#   ENERGIZADO sujetando posicion entre avances: al 100% seria calor
#   continuo sin movimiento que lo disipe.
#   Motivo: "a veces se atasca y se brinca pasos" con el 1.500 viejo,
#   heredado del motor anterior ya sustituido.
#   PENDIENTE validar con el PLATO CARGADO: varios avances de 90 grados,
#   comprobar que vuelve exacto a la marca (QUERY_ENDSTOPS) y vigilar
#   temperatura de motor y driver. Si sigue perdiendo pasos hay margen
#   hasta el techo de 4.0 A, pero subir con un dato, no por si acaso.
#
# !! dir_pin: sentido ya ANOTADO (SENTIDO=1 = horario). Fijara la polaridad
#   cuando llegue el home de la etapa 2.
# ------------------------------------------------------------------

[manual_stepper index]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
# microsteps 32 (era 16) - SUBIDO EL 2026-08-17 CONTRA LA VIBRACION A BAJA
# VELOCIDAD. Diagnostico: Erwin, viendo el barrido de velocidades, observo que
# "vibro mas en las lentas, a 90 y 120 va suave". Eso descarta resonancia (seria
# en una BANDA concreta) y descarta mecanica (EMPEORARIA al subir): vibrar en
# lento y suavizarse en rapido es aspereza de SpreadCycle, y mas microsteps la
# reparten en pasos mas pequenos. Importa sobre todo para INDEX_HOME, que corre
# a 15 grados/s, justo en la zona aspera.
#
# NO HAY QUE RECALIBRAR NADA: Klipper saca los pasos de rotation_distance y
# microsteps, asi que la unidad del eje sigue siendo el GRADO DEL PLATO y el
# cero del home no se mueve. Y 90 grados siguen siendo un numero EXACTO de
# pasos: 200 x 32 = 6400 pasos/vuelta de motor / 60 grados de plato por vuelta
# = 106.667 pasos/grado, x90 = 9600 pasos justos. Sin residuo que se acumule.
#
# COSTE: el doble de frecuencia de paso. A 180 grados/s de plato son 19200
# pasos/s, que para la STM32F446 no es nada (va sobrada de margen).
#
# SI ESTO NO BASTA, el siguiente paso es STEALTHCHOP PARA ESTE EJE: la regla
# "SpreadCycle siempre" del proyecto viene de Marlin y existe porque el HOMING
# SENSORLESS (StallGuard) lo exige. El index NO usa StallGuard, homea con el
# inductivo de PG12 -> aqui SI se puede usar StealthChop. En X/Y no.
microsteps: 32
rotation_distance: 60
# velocity 180 - VALORES DE PRODUCCION VALIDADOS EL 2026-08-18. Venian de 30
# (provisional del alta del motor). Es EL UNICO SITIO donde se declara la
# velocidad de indexado: _INDEX_AVANZAR, INDEX_NEXT, INDEX_GOTO e INDEX_DEMO
# tiran de aqui por defecto.
#
# !! POR QUE 180 Y NO MAS - HAY UN LIMITE MEDIDO, NO UNA CORAZONADA:
#   180/800 -> OK    180/1500 -> OK    300/1500 -> DERIVA de 25 grados en
#   720 grados de recorrido (medido con el plato cargado el 2026-08-18).
#   El que rompe es LA VELOCIDAD, no la aceleracion: 1500 ya habia pasado a
#   180 grados/s. A 300 grados/s de plato el motor va a 300 rpm y la fuerza
#   contraelectromotriz a 24 V se come el par. NO SE PUEDE SUBIR LA TENSION:
#   el HVIN va a 24 V y 48 V se llevarian la Octopus por el zocalo.
#   >> 180 deja un 40% de margen hasta el fallo conocido. Ese margen ES el
#      ajuste: una maquina de produccion no se pone al borde de donde patina,
#      porque la carga del plato varia y el fallo aqui ES SILENCIOSO (el motor
#      pierde pasos, Klipper no se entera y station sigue diciendo la estacion
#      correcta con el plato fuera de sitio).
#
# !! accel 1500 -> 800 BAJADO EL 2026-09-09: Erwin reporto perdida de pasos
#   AL ARRANCAR (justo la rampa de aceleracion) incluso ya con el sense_resistor
#   corregido y run_current en 2.8 A. Subir accel pide MAS par instantaneo en
#   ese mismo punto -> se baja, no se sube. 800 es el otro valor YA MEDIDO como
#   OK arriba (misma sesion del 2026-08-18), pero esa medicion se hizo con la
#   corriente real inflada por el bug del sense_resistor (0.075 en vez de
#   0.022): habia mucho mas par real disponible del que hay ahora con el 2.8 A
#   ya correcto. VOLVER A VALIDAR CON EL PLATO CARGADO, no asumir que sigue OK.
#
# OJO - EFECTO LATERAL: INDEX_TEST tambien toma su velocidad/aceleracion por
# defecto de aqui.
#
# EL HOME NO SE TOCA: INDEX_HOME lleva su propio defecto de 15 grados/s a
# proposito, porque su parada es BRUSCA (sin rampa de frenado). Homear rapido
# seria un frenazo seco contra el target.
velocity: 180
accel: 800
endstop_pin: ^!PG12    # DIAG4 - sensor inductivo NPN NO del home. VER NOTA (*) ABAJO.
# Sin position_min / position_max A PROPOSITO: todavia no hay home, asi que no
# hay un cero real y unos limites rechazarian los giros de prueba.
# Declarar el endstop NO limita INDEX_TEST: MANUAL_STEPPER MOVE solo consulta el
# endstop si se le pasa STOP_ON_ENDSTOP.
#
# (*) POLARIDAD - ES LA HIPOTESIS QUE SE ESTA MIDIENDO, no un valor confirmado.
#   Con NPN normalmente abierto (NO) y pull-up:
#     sin target -> el sensor no conduce -> el pull-up sube el pin -> invertido = open
#     con target -> conduce a GND -> pin bajo -> invertido = TRIGGERED
#   Si QUERY_ENDSTOPS sale AL REVES, quitar el '!' y dejar '^PG12'.
#   Un sensor DESCONECTADO tiene que leer 'open' (nunca un cero falso).

[tmc5160 manual_stepper index]
cs_pin: PF2
spi_bus: spi1
run_current: 2.800
# sense_resistor 0.022 - CORREGIDO EL 2026-09-09 (antes 0.075). El driver es
# el TMC5160T Plus (bornero HVIN aparte, no se alimenta del zocalo --
# confirmado por Erwin), y ese modulo usa 0.022R, no 0.075R. Con el valor
# viejo Klipper entregaba real ~3.4x lo pedido (a run_current=1.500 comandado,
# ~5.1 A reales, por encima del motor). Mismo bug ya encontrado y corregido
# en X/Y el 2026-09-07.
sense_resistor: 0.022
stealthchop_threshold: 0
interpolate: True


# ------------------------------------------------------------------
# MARCO - sube/baja el marco donde va montado el cuadro quemado.
# ETAPA 1: alta del motor. Slot MOTOR7 (libre; se descarto MOTOR6 porque su
# conector DIAG comparte PG14 con el paro de emergencia de la feature 010).
#
# NOMBRE: se llama 'marco' (la pieza que sube/baja), no 'screen' -- ese
# nombre ya esta tomado por el motor que mueve tallas en HORIZONTAL (feature
# 004, mas arriba en este archivo). No confundir los dos.
#
# !! ANTES DE ENERGIZAR EL MOTOR (mismas trampas ya sufridas con index):
#   - El zocalo se identifica por el ROTULO IMPRESO "MOTOR7", nunca contando
#     posiciones: el numerado de zocalos y el de conectores de la Octopus NO
#     coincide (MOTOR2 tiene dos conectores de salida).
#   - El TMC5160T Plus NO se alimenta del zocalo. Lleva su propio bornero
#     HVIN/GND aparte -- sin el, el motor queda COMPLETAMENTE SUELTO y
#     Klipper arranca 'ready' sin un solo error. HVIN a 24 V, NUNCA a 48 V:
#     el zocalo compartido no aisla los dominios y 48 V pueden llevarse la
#     Octopus entera.
#   - Nunca enchufar/desenchufar el conector del motor con los 24 V puestos.
#   - Sin E-stop fisico en la maquina: primera prueba con el motor
#     desacoplado del mecanismo si es posible, despacio y con la mano en el
#     corte de corriente.
#   - 🚨 JUMPER DE DIAG DE MOTOR7: AL REVES QUE EN index. marco es
#     SENSORLESS (StallGuard), igual que X/Y y screen -- necesita el jumper
#     PUESTO (conecta la senal real del driver al pin DIAG del zocalo).
#     Quitarlo es lo correcto en index/MOTOR4 (usa sensor fisico y el jumper
#     puesto "pelea con el sensor"; screen/MOTOR3 tambien lo quitaba hasta
#     que paso a sensorless el 2026-10-08), pero aqui haria lo contrario:
#     dejaria el pin sin la senal del driver, y StallGuard nunca dispara
#     aunque el marco este atascado de verdad contra la pared (sintoma
#     detectado en maquina real 2026-09-15: llega al tope y sigue girando
#     incluso con driver_SGT=-64, maxima sensibilidad -- ver bitacora).
#     NUNCA SE VERIFICO EL ESTADO DE ESTE JUMPER AL ARMAR marco. Confirmar
#     fisicamente que este PUESTO, igual que en MOTOR0/MOTOR1.
#
# !! dir_pin: sentido VALIDADO en maquina real (2026-09-15): SENTIDO=1 sube,
#   SENTIDO=-1 baja. dir_pin: PA14 (sin invertir) ya es correcto, no tocar.
#
# !! rotation_distance: 40 es UN PLACEHOLDER, no una hipotesis de mecanismo
#   como en screen/X/Y: todavia no se conoce el paso real del mecanismo de
#   elevacion. Sirve para la prueba de sentido/conectividad; calibrar cuando
#   se sepa que mecanismo mueve el marco (husillo, correa, etc).
#
# !! run_current 1.200 y velocity/accel bajos: son PROVISIONALES para la
#   primera energizacion, a proposito mas conservadores que index/screen
#   porque este motor nunca se ha movido. Subir solo con datos reales del
#   motor (placa de caracteristicas) y de la mecanica, igual criterio que ya
#   se aplico en index (ver nota de run_current ahi arriba).
#
# !! HOME SENSORLESS (StallGuard), no fin de carrera fisico (2026-09-15/16):
#   Erwin confirmo que la pared/tope mecanico esta ARRIBA, el mismo sentido
#   que sube el marco (SENTIDO=1, ya validado). Se homea igual que X/Y: el
#   propio driver TMC5160 detecta el atasco contra la pared por DIAG7/PG15,
#   sin sensor fisico que instalar ni cablear. endstop_pin apunta al
#   virtual_endstop del driver de abajo. driver_SGT=6 CALIBRADO Y VALIDADO en
#   maquina real (2026-09-16) para MARCO_HOME a VELOCIDAD=100 -- ver la nota
#   junto a driver_SGT abajo y docs/BITACORA.md para el proceso completo
#   (incluye el jumper de DIAG de MOTOR7 que estaba quitado y hubo que poner).
#
# Sin position_min/max TODAVIA A PROPOSITO: el home fija el cero de arriba,
# pero el limite de abajo (posicion segura minima) no se conoce -- etapa 2
# futura, igual que paso con index/screen tras validar su home.
# ------------------------------------------------------------------

# !! ORDEN DE LAS DOS SECCIONES DE ABAJO: el driver TMC va PRIMERO A PROPOSITO
#   (2026-09-15, tras un FIRMWARE_RESTART fallido en maquina real: "Unknown pin
#   chip name 'tmc5160_marco'"). Klipper carga los modulos en el orden del
#   archivo; [manual_stepper ...] SI pasa por esa carga generica (existe
#   extras/manual_stepper.py) y resuelve su endstop_pin EN EL ACTO, mientras
#   que [tmc5160 ...] recien registra el pin virtual "tmc5160_marco" cuando
#   a EL le toca cargar. Si manual_stepper va primero en el archivo, busca un
#   pin que todavia no existe. (X/Y no sufren esto porque sus [stepper_x/y]
#   se cargan mas tarde, desde 'toolhead'/kinematics, momento en el que TODOS
#   los [tmc5160 ...] ya cargaron.) NO reordenar sin volver a probar en vivo.
[tmc5160 manual_stepper marco]
cs_pin: PD3
spi_bus: spi1
run_current: 1.200
sense_resistor: 0.022
stealthchop_threshold: 0
interpolate: True
diag1_pin: ^!PG15
driver_SGT: 6  # ✅ CALIBRADO EN MAQUINA REAL (2026-09-16), pero SOLO PARA VELOCIDAD=100 -- StallGuard depende de la velocidad de home (lo dice la propia guia de Klipper, docs/TMC_Drivers.md): a VELOCIDAD=20 el valor bueno era 3, no 6. Repetido limpio 3/3 veces con MARCO_HOME DISTANCIA=50 VELOCIDAD=100. Si algun dia cambia la VELOCIDAD de MARCO_HOME, la corriente de home, o algo de la mecanica, HAY QUE REPETIR la biseccion (rango probado a esta velocidad: 3=dispara antes de tiempo, 10 y 18=llega a la pared y salta pasos sin disparar). Ver docs/BITACORA.md para el proceso completo.

[manual_stepper marco]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
velocity: 10
# accel: 2000 -- VALIDADO EN MAQUINA REAL (2026-09-16) para movimientos
# normales del marco (bajar hacia la paleta, etc.): se subio de a poco desde
# el 100 original de la primera energizacion (100->500->1000->1500->2000),
# comprobando cada vez que MARCO_HOME seguia disparando limpio contra la
# pared de arriba (sin eso no hay forma de detectar pasos perdidos, esta
# version de Klipper no publica la posicion real del manual_stepper).
# 🚨 OJO: MARCO_HOME fija su propio ACCEL=100 en macros_marco.cfg a
# proposito, NO usa este valor -- driver_SGT=6 se calibro con accel=100, y
# subir el accel del home sin recalibrar puede romperlo en silencio. Este
# 2000 de aqui es solo para MARCO_TEST y cualquier movimiento que no
# especifique su propio ACCEL.
accel: 2000
endstop_pin: tmc5160_marco:virtual_endstop


# ==================================================================
# SENSOR DE PARTE - manejador real (etapa 2, feature 005)
# ==================================================================
# Sustituye a la seccion TEMPORAL de verificacion del 2026-08-14.
# El sensor es FOTOELECTRICO DIFUSO NPN (no inductivo: un inductivo solo ve
# metal y no detectaria la prenda). Polaridad ^!PG13 verificada en maquina:
# sin objeto -> RELEASED, con objeto -> PRESSED. Comprobar con
# QUERY_BUTTON BUTTON=part_sensor.
#
# ------------------------------------------------------------------
# COMO FUNCIONA DE VERDAD ESTE BOTON - MEDIDO, NO SUPUESTO (2026-08-14)
# ------------------------------------------------------------------
# El callback de [gcode_button] llama a run_script(), que TOMA EL MUTEX DEL
# GCODE. Mientras una macro corre (incluidas sus macros anidadas y sus M400) el
# mutex esta ocupado, asi que el gcode del boton NO se ejecuta en el momento del
# disparo: SE ENCOLA Y SE DESPACHA AL TERMINAR EL COMANDO DE NIVEL SUPERIOR.
#
# EVIDENCIA: durante un giro de 36 s se paso la mano por delante del sensor
# varias veces; salieron 14 pares press/release TODOS con marca de tiempo
# t = +36.5 s, o sea al acabar el movimiento. 14 pasadas fisicas no caben en
# medio segundo -> el sensor DETECTA durante el giro, pero su gcode ESPERA.
#
# CONSECUENCIA 1 - el flag se lee en el PASO SIGUIENTE del bucle, nunca en el
#   mismo. De ahi el BUCLE DE DOS PASOS del ciclo: un tick avanza, el tick
#   siguiente lee el flag y decide imprimir o saltar. Entre tick y tick el mutex
#   se libera y es cuando entra el gcode del boton.
#
# CONSECUENCIA 2 - 🚨 EL FLAG NO SE PUEDE LIMPIAR EN release_gcode.
#   La cola descarga los pares press/release EN ORDEN y termina en un release
#   (el objeto acaba de pasar y el sensor queda libre). Si release_gcode pusiera
#   part=0, BORRARIA la deteccion legitima que el press acababa de armar, cada
#   vez, y el ciclo no imprimiria nunca. POR ESO NO HAY release_gcode AQUI:
#   no es un olvido, es la unica forma correcta.
#   >> Si alguien anade un release_gcode que toque 'part', rompe la feature.
#
# QUIEN LIMPIA EL FLAG: _INDEX_PART_CLEAR, llamada al EMPEZAR cada avance
#   (desde _INDEX_AVANZAR) y en INDEX_HOME. Semantica resultante:
#   part = 1  <=>  paso una pieza durante el ULTIMO avance.
#
# ⏳ PENDIENTE DE GEOMETRIA: que 'part' signifique "la prenda que llega a
#   pintado" depende de que la deteccion caiga DENTRO del avance carga->pintado
#   y de que el sensor NO vea la prenda que se va. Sin eso confirmado, el
#   mecanismo es correcto pero el significado no esta cerrado.
# ==================================================================

# ==================================================================
# IDLE TIMEOUT - declarado explicitamente para dejar por escrito que este
# camino tambien INVALIDA LOS HOMES (2026-08-18).
# ==================================================================
# Antes se usaba el default de Klipper, que ya acababa en M84. Ahora ese M84
# pasa por el interceptor de macros_ciclo.cfg, que es quien pone _INDEX.homed y
# _SCREEN.homed a 0. Se declara la seccion para que el comportamiento este a la
# vista en el config y no dependa de recordar cual es el default.
#
# 600 s es el default de Klipper y NO se cambia. ⚠️ OJO SI SE BAJA: mientras el
# squeegee no tenga tope fisico, desenergizar X puede dejarlo caer por gravedad
# sobre la malla. Bajar este numero es una decision de seguridad, no de confort.
#
# NO dispara durante un ciclo: el bucle del carrusel reagenda cada 0.2-0.4 s,
# asi que la maquina nunca esta inactiva mientras trabaja.
[idle_timeout]
timeout: 600
gcode:
    {% if 'heaters' in printer %}
        TURN_OFF_HEATERS
    {% endif %}
    M118 Inactividad de 10 min: se desenergizan los motores.
    M84


[gcode_button part_sensor]
pin: ^!PG13
press_gcode:
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part VALUE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part_eventos VALUE={ (printer['gcode_macro _INDEX'].part_eventos | int) + 1 }
# release_gcode: NO EXISTE A PROPOSITO. Ver la CONSECUENCIA 2 de arriba.


# ==================================================================
# PARO DE EMERGENCIA - feature 010 (2026-09-11)
# ==================================================================
# DISENO: el boton de emergencia tiene DOS contactos (NA y NC), como
# cualquier hongo industrial estandar - no hace falta comprar nada nuevo.
#
#   - NC, en serie con la rama de 24V que alimenta los DRIVERS DE LOS
#     MOTORES (NO la alimentacion de la Pi/Octopus/pantalla): al presionar,
#     el NC ABRE y corta la energia de los motores POR HARDWARE, sin pasar
#     por Klipper, sin el mutex del gcode. Corte real e instantaneo. ESTO es
#     lo que de verdad detiene la maquina, no lo que sigue abajo.
#
#   - NA, cableado al pin de abajo (GPIO libre), SOLO avisa a Klipper que se
#     presiono, para dejar constancia de que hay que homear de nuevo. Como
#     cualquier [gcode_button], su press_gcode queda encolado en el mutex del
#     gcode hasta que termine el comando de nivel superior en curso - con el
#     ciclo corriendo, hasta ~4.6s (la duracion de un tick del bucle; el
#     bucle SI libera el mutex entre ticks, por eso no son los 36.5s que se
#     midieron con un INDEX_TEST de un solo movimiento largo). Ese retraso NO
#     IMPORTA PARA LA SEGURIDAD: los motores ya estan muertos por el NC en el
#     instante en que se presiono.
#
#     OJO: el aviso EN PANTALLA ya NO depende de este camino lento. La UI se
#     suscribe al objeto "gcode_button paro_emergencia", cuyo estado Klipper
#     escribe en el callback ANTES de renderizar el press_gcode y ANTES de
#     pedir el mutex (gcode_button.py:38) - se publica cada 250ms. Ver la
#     seccion PARO DE EMERGENCIA de ui/index.html.
#
# POR QUE NO M112/FIRMWARE_RESTART: la primera version de este diseno usaba
# M112 (shutdown nativo de Klipper) porque parecia la unica forma de que
# Klipper "supiera" que hay que parar YA - pero recuperarse de un shutdown
# exige FIRMWARE_RESTART (reconecta el MCU), y Erwin no quiere que el RESET
# de pantalla reinicie el firmware: solo quiere que la maquina quede en un
# estado que exija homear de nuevo antes de poder dar START. Como el corte
# real ya lo hace el NC, Klipper no necesita entrar en shutdown para nada -
# basta un M84 normal, que EN ESTE PROYECTO YA ESTA INTERCEPTADO (ver mas
# arriba, seccion IDLE TIMEOUT / macros_ciclo.cfg) para abortar cualquier
# ciclo en marcha e invalidar los homes de X/Y/index/screen. Se reutiliza
# ese camino ya validado en vez de inventar uno nuevo.
#
# (2026-09-23) Reconfirmado leyendo el fuente de Klipper en el commit que
# corre esta maquina: {action_emergency_stop()} dentro del press_gcode SI
# saltaria el mutex - el render de jinja ocurre antes de run_script - y
# pararia en decenas de ms. Se descarta igual: es invoke_shutdown(), o sea
# el mismo shutdown que exige FIRMWARE_RESTART. Y no existe ninguna otra via:
# Klipper no puede abortar movimientos ya encolados sin shutdown (el propio
# mantenedor lo intento dos veces y lo abandono). El corte en <1s es del NC,
# punto. Tambien ojo: M84 NO corta a mitad ni cuando consigue el mutex,
# porque M84.1 llama a toolhead.wait_moves(), que espera a vaciar la cola.
#
# 🚨 EL NC TODAVIA NO ESTA CABLEADO (al 2026-09-23 solo esta el NA). Mientras
# siga asi, esto es un aviso en pantalla SIN capacidad real de detener la
# maquina. No confiar en el como paro de emergencia.
#
# NOTA DE POLARIDAD: el pin es ^!PG14 (invertido). Con ^PG14 a secas,
# QUERY_BUTTON leia PRESSED en reposo. Si se recablea el boton, reverificar
# con QUERY_BUTTON BUTTON=paro_emergencia antes de confiar en el.
# ==================================================================

[gcode_macro _ESTOP]
# active: controla el aviso en pantalla. fisico: refleja si el NA esta
# presionado AHORA MISMO (lo actualizan press_gcode/release_gcode del boton).
variable_active: 0
variable_fisico: 0
gcode:
    # (vacio a proposito: solo guarda variables de estado)

[gcode_macro PARO_EMERGENCIA]
description: Aviso de que se presiono el paro de emergencia (NA). El corte real de los motores ya lo hizo el NC en hardware; esto solo deja a Klipper y a la pantalla al tanto.
gcode:
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=fisico VALUE=1
    M84
    M118 PARO DE EMERGENCIA: motores cortados por hardware. Hay que homear de nuevo.

[gcode_macro RESET_ESTOP]
description: Oculta el aviso de paro de emergencia SOLO si el boton fisico ya no esta presionado. NO reenergiza ni homea - eso lo sigue haciendo HOME/HOME_OP.
gcode:
    {% if printer['gcode_macro _ESTOP'].fisico|int == 1 %}
        { action_raise_error("El paro de emergencia sigue presionado. Suelta el boton antes de RESET.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=active VALUE=0

# --- Boton fisico (NA) - ACTIVO desde 2026-09-23 (NA cableado, NC pendiente) ---
#
# 🔴 PRUEBA 2026-09-23: press_gcode dispara action_emergency_stop() EN VEZ DE
# PARO_EMERGENCIA. Erwin pidio probar la via del shutdown tras ver que el aviso
# rapido en pantalla no le bastaba.
#
# POR QUE ESTO SI PARA DE VERDAD: las funciones action_*() se ejecutan durante
# el RENDER de la plantilla jinja, y gcode_button.py hace template.render()
# (linea 43) ANTES de gcode.run_script() (linea 46) -- o sea ANTES de pedir el
# mutex del gcode. action_emergency_stop() llama directo a invoke_shutdown(),
# que manda emergency_stop al MCU; el MCU vacia la cola de pasos y frena en
# seco (stepper.c: move_queue_clear + stepper_stop). Latencia: decenas de ms.
# Es exactamente lo mismo que hace el boton E-STOP de Fluidd.
#
# ⚠️ CONSECUENCIAS, TODAS ESPERADAS:
#   - Klipper queda en estado `shutdown`. Se sale SOLO con FIRMWARE_RESTART
#     (lo hace el boton RESET de la pantalla).
#   - NADA de lo que se ponga despues del action_ se ejecuta: al entrar en
#     shutdown Klipper desregistra todas las macros. Por eso aqui NO se llama a
#     PARO_EMERGENCIA ni a M84: no correrian. No hace falta -- el shutdown ya
#     desenergiza (los enable pins caen a su valor de shutdown) y el
#     FIRMWARE_RESTART ya invalida todos los homes.
#   - Se pierden las variables de las macros (incluido el CONTADOR DE PIEZAS
#     _CYCLE_STATE.count, que vuelve a 0). Lo de save_variables/variables.cfg
#     (tallas, posiciones) NO se pierde: eso esta en disco.
#   - Si el hongo sigue ENCLAVADO al reiniciar, el boton se lee presionado al
#     arrancar y vuelve a disparar el shutdown. Es deseable: obliga a girar el
#     hongo para liberarlo antes de poder recuperar.
#
# Las macros _ESTOP / PARO_EMERGENCIA / RESET_ESTOP de arriba se dejan tal cual
# a proposito: siguen sirviendo para disparar el aviso por gcode, y si esta
# prueba no convence se vuelve atras cambiando solo el press_gcode de aqui.
[gcode_button paro_emergencia]
pin: ^!PG14
press_gcode:
    {action_respond_info("PARO DE EMERGENCIA: boton fisico presionado, shutdown inmediato.")}
    {action_emergency_stop("paro de emergencia fisico (boton NA en PG14)")}
release_gcode:
    SET_GCODE_VARIABLE MACRO=_ESTOP VARIABLE=fisico VALUE=0
