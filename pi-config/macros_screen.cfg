# ============================================================
# macros_screen.cfg  -  Feature 004: indexado de tallas del screen
# ------------------------------------------------------------
# Se carga desde printer.cfg con:  [include macros_screen.cfg]
#
# El screen es un motor INDEPENDIENTE de la cabeza que desplaza
# HORIZONTALMENTE un screen ancho con 7 tallas grabadas en fila.
#
# FLUJO DEL OPERADOR:
#   1) SCREEN_HOME                 -> obligatorio; sin el no se puede elegir talla
#   2) SELECCIONAR_TALLA TALLA=n   -> 1=XS  2=S  3=M  4=L  5=XL  6=2XL  7=3XL
#
# LA TABLA ESTA EN PULSOS Y ES LA FUENTE DE VERDAD.
# Son los mismos valores ya validados en produccion con el PLC
# (driver del PLC a 3200 pulsos/rev).
#   El paso es constante 7762 EXCEPTO el salto XS->S, que es 7710:
#   la talla XS esta ajustada a mano. NO "corregir" ese 7710 y NO
#   generar la tabla por formula, porque se perderia el ajuste.
#
# Conversion a mm:   mm = pulsos * rotation_distance / 3200
#
# ⚠️ CORRECCION 2026-08-18 - ESTE COMENTARIO DECIA ALGO FALSO.
# Decia: "rotation_distance se LEE de la config y NO se copia aqui: asi, al
# recalibrarlo, las 7 tallas se corrigen de golpe". NO ES CIERTO, y de ahi salio
# un pendiente equivocado en la bitacora ("calibrar rotation_distance").
# Haciendo la cuenta completa, rotation_distance SE CANCELA:
#     mm    = pulsos * rd / 3200            <- lo calcula esta macro
#     pasos = mm / rd * (200 * microsteps)  <- lo calcula Klipper
#     pasos = (pulsos*rd/3200) / rd * 3200  =  pulsos
# O sea que la posicion fisica la fija SOLO la tabla de pulsos (que ya venia
# calibrada del PLC). Recalibrar rotation_distance NO mueve ninguna talla.
# Lo que si depende de rotation_distance: los limites position_min/max (van en
# mm), el significado real de velocity/accel, y los mm que se informan al
# operador. Por eso vale la pena tenerlo bien, pero NO por precision de talla.
#
# 🚨 LA DEPENDENCIA DE VERDAD, Y ES SILENCIOSA:
#     pulsos_por_rev  TIENE QUE SER IGUAL A  full_steps_per_rotation * microsteps
#     hoy: 3200 = 200 * 16  ✅
# Si alguien cambia los microsteps del screen (p.ej. a 32 "para suavizar", que es
# lo que se hizo en el eje index el 2026-08-18), los mm calculados NO cambian
# -> position_max NO se queja -> pero Klipper genera EL DOBLE DE PASOS y CADA
# TALLA SE VA AL DOBLE DE DISTANCIA, sin un solo error. El carro se estampa.
# Por eso SELECCIONAR_TALLA lleva ahora una guarda que compara los dos numeros y
# aborta si no cuadran. NO quitarla.
#
# Home: switch fisico en Z2-STOP (PG11); el motor gira en sentido
# HORARIO al ir hacia el cero (por eso el barrido va al minimo).
#
# Ejes de la cabeza:  X = squeegee (X- = arriba/seguro)   Y = stroke
# ============================================================


# --- Tabla de tallas y estado (NO llamar a mano) ---------------------------
[gcode_macro _SCREEN]
description: Tabla de tallas y estado del screen (interna, no llamar)
variable_pulsos: [300, 8010, 15772, 23534, 31296, 39058, 46820]
variable_nombres: ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL']
variable_pulsos_por_rev: 3200
variable_homed: 0
variable_talla: 0
gcode:
    # (vacio a proposito: solo guarda la tabla y el estado)


# --- Home del screen (paso obligatorio antes de elegir talla) --------------
# homed vive en esta macro y NO en save_variables A PROPOSITO: se pierde en
# cada arranque y FIRMWARE_RESTART, que es justo lo que se quiere (tras un
# reinicio la posicion real del screen es desconocida -> hay que rehomear).
[gcode_macro SCREEN_HOME]
description: Lleva el screen al cero (switch fisico) y habilita el indexado
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de homear el screen.") }
    {% endif %}
    # Se invalida el home ANTES de nada: si algo falla a medias no queda un
    # estado que engane al operador.
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=talla VALUE=0

    # DESPEGUE PREVIO INCONDICIONAL (5 mm alejandose del switch).
    # Imprescindible: al terminar un home correcto el screen queda APOYADO en el
    # switch (la posicion 0 es justo el punto donde dispara), asi que un SEGUNDO
    # home lo veria "ya pulsado" y la guarda lo rechazaria para siempre.
    # Despegando 5 mm se libera si solo estaba aparcado encima. Si el switch esta
    # averiado o sin cablear seguira pulsado, y _SCREEN_HOME_GO lo caza igual.
    MANUAL_STEPPER STEPPER=screen ENABLE=1
    MANUAL_STEPPER STEPPER=screen SET_POSITION=20
    MANUAL_STEPPER STEPPER=screen MOVE=25 SPEED=10

    # El estado del endstop solo esta fresco en la macro SIGUIENTE, porque todo
    # el jinja de una macro se evalua ANTES de que se ejecuten sus comandos.
    QUERY_ENDSTOPS
    _SCREEN_HOME_GO VELOCIDAD={params.VELOCIDAD | default(40)}


# Segunda mitad de SCREEN_HOME. Separada para poder leer el resultado del
# QUERY_ENDSTOPS que lanza la primera. NO llamar a mano.
[gcode_macro _SCREEN_HOME_GO]
description: Segunda mitad de SCREEN_HOME (interna, no llamar)
gcode:
    # GUARDA ANTI-HOME-FALSO: si el switch SIGUE pulsado despues del despegue de
    # 5 mm, no es que el screen estuviera aparcado encima: el switch esta averiado,
    # trabado o sin cablear. Sin esta guarda el barrido pararia en el primer
    # instante y el home "terminaria" sin mover el motor, dejando homed=1 y una
    # posicion completamente falsa. Ya paso una vez: abortar en vez de mentir.
    {% set q = printer.query_endstops.last_query %}
    {% if q['manual_stepper screen'] | default(0) | int == 1 %}
        { action_raise_error("El switch de home del screen sigue pulsado tras despegar 5 mm: esta trabado, averiado o sin cablear. Revisalo en el conector DIAG3 (PG11) y comprueba que el jumper de DIAG de MOTOR3 este QUITADO.") }
    {% endif %}
    {% set cfg    = printer.configfile.settings['manual_stepper screen'] %}
    {% set pmax   = cfg.position_max | float %}
    {% set v_fast = params.VELOCIDAD | default(40) | float %}
    {% set v_slow = [v_fast / 8, 2] | max %}

    MANUAL_STEPPER STEPPER=screen ENABLE=1

    # 1a pasada, rapida, hacia el cero (giro HORARIO).
    # Se fija la posicion al techo del rango porque position_min limita los
    # MOVE pero NO el SET_POSITION: asi el barrido completo cabe en el rango.
    MANUAL_STEPPER STEPPER=screen SET_POSITION={pmax}
    MANUAL_STEPPER STEPPER=screen MOVE=-1 SPEED={v_fast} STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=screen SET_POSITION=0

    # despegar del switch y 2a pasada lenta (repetibilidad)
    MANUAL_STEPPER STEPPER=screen MOVE=4 SPEED={v_fast / 2}
    MANUAL_STEPPER STEPPER=screen MOVE=-1 SPEED={v_slow} STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=screen SET_POSITION=0
    M400

    # M118 y no action_respond_info: los mensajes tienen que salir en tiempo de
    # EJECUCION. El jinja se evalua antes de correr los comandos, asi que un
    # action_respond_info aqui avisaria "listo" aunque el home fallara despues.
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=1
    M118 Screen en cero. Ya puedes elegir talla.


# --- Elegir talla ----------------------------------------------------------
# SELECCIONAR_TALLA TALLA=4              -> va a la talla L
# SELECCIONAR_TALLA TALLA=7 VELOCIDAD=40 -> va a 3XL mas despacio
[gcode_macro SELECCIONAR_TALLA]
description: Posiciona el screen en el centro de la talla (1=XS ... 7=3XL)
gcode:
    {% set s       = printer['gcode_macro _SCREEN'] %}
    {% set cfg     = printer.configfile.settings['manual_stepper screen'] %}
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% set n       = params.TALLA | default(0) | int %}
    {% set v       = params.VELOCIDAD | default(cfg.velocity) | float %}
    {% set ntallas = s.pulsos | length %}

    # --- guardas: todas ANTES de mover nada ---
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de cambiar de talla.") }
    {% endif %}
    {% if s.homed | int != 1 %}
        { action_raise_error("El screen no tiene home. Ejecuta SCREEN_HOME primero.") }
    {% endif %}
    {% if n < 1 or n > ntallas %}
        { action_raise_error("Talla fuera de rango: " ~ n ~ " (validas 1 a " ~ ntallas ~ ").") }
    {% endif %}

    # 🚨 GUARDA ANTI-ESCALADO SILENCIOSO (anadida 2026-08-18).
    # La tabla esta en PULSOS y se convierte a mm con rotation_distance; Klipper
    # la convierte de vuelta a pasos con (full_steps_per_rotation * microsteps).
    # La conversion solo es fiel si esos dos numeros COINCIDEN con pulsos_por_rev.
    # Si alguien cambia los microsteps del screen, los mm no cambian, position_max
    # NO se queja, y CADA TALLA SE VA A UN MULTIPLO de la distancia correcta SIN
    # UN SOLO ERROR -> el carro se estampa. Se caza aqui, antes de mover.
    {% set pasos_klipper = (cfg.full_steps_per_rotation | default(200) | int) * (cfg.microsteps | int) %}
    {% if pasos_klipper != (s.pulsos_por_rev | int) %}
        { action_raise_error("CONFIG INCOHERENTE - NO SE MUEVE NADA. La tabla de tallas asume pulsos_por_rev=" ~ s.pulsos_por_rev ~ " pero Klipper genera " ~ pasos_klipper ~ " pasos/rev (full_steps_per_rotation x microsteps). Cada talla iria a " ~ (pasos_klipper / (s.pulsos_por_rev | float)) | round(2) ~ "x la distancia correcta. Arregla los microsteps de [manual_stepper screen] en printer.cfg, o pulsos_por_rev en _SCREEN si el cambio es intencionado.") }
    {% endif %}

    {% set pulsos = s.pulsos[n - 1] %}
    {% set mm = pulsos * (cfg.rotation_distance | float) / (s.pulsos_por_rev | float) %}

    _SCREEN_SQUEEGEE_ARRIBA
    MANUAL_STEPPER STEPPER=screen ENABLE=1
    MANUAL_STEPPER STEPPER=screen MOVE={mm} SPEED={v}
    M400
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=talla VALUE={n}
    SAVE_VARIABLE VARIABLE=screen_talla VALUE={n}
    # M118 y no action_respond_info: el jinja se evalua ANTES de ejecutar los
    # comandos, asi que un action_respond_info aqui anunciaria "Talla lista"
    # aunque la guarda del squeegee abortara la macro despues. Ya paso.
    M118 Talla {s.nombres[n - 1]} lista ({pulsos} pulsos = {mm | round(2)} mm)


# --- Guarda de seguridad: subir el squeegee antes de mover el screen -------
# Usa el MISMO parametro del operador que PRINT_CYCLE (squeegee_up), para no
# tener dos definiciones de "squeegee arriba".
[gcode_macro _SCREEN_SQUEEGEE_ARRIBA]
description: Sube el squeegee antes de mover el screen SI se puede (interna)
gcode:
    # EL INDEXADO DE TALLAS ES INDEPENDIENTE DE LA CABEZA (decision de Erwin):
    # elegir talla NO exige el HOME de la maquina (stroke/squeegee); el unico
    # requisito es el HOME DEL SCREEN.
    #
    # Aun asi, si X tiene posicion conocida se sube el squeegee como cortesia,
    # porque mover el screen con el squeegee apoyado lo arrastra sobre la malla.
    # Si X no tiene posicion, se avisa y se sigue: no se bloquea.
    {% if 'x' in printer.toolhead.homed_axes %}
        {% set v = printer.save_variables.variables %}
        G90
        G1 X{ v.squeegee_up | default(10) | float } F{ v.squeegee_speed | default(7000) | float }
        M400
    {% else %}
        M118 Aviso: sin HOME de maquina el squeegee no se sube solo; comprueba que no roce la malla.
    {% endif %}


# --- Diagnostico (banco y soporte, no para el operador) -------------------
[gcode_macro SCREEN_STATUS]
description: Informa home, talla actual y posicion del screen (mm y pulsos)
gcode:
    # OJO: esta version de Klipper NO publica el objeto 'manual_stepper screen'
    # en el status (comprobado: el objeto no existe y printer['manual_stepper
    # screen'] lanza UndefinedError). Asi que la posicion se DERIVA de la talla
    # seleccionada, que es lo que si sabemos con certeza.
    {% set s   = printer['gcode_macro _SCREEN'] %}
    {% set cfg = printer.configfile.settings['manual_stepper screen'] %}
    {% set n   = s.talla | int %}
    {% set pul = s.pulsos[n - 1] if n else 0 %}
    {% set mm  = pul * (cfg.rotation_distance | float) / (s.pulsos_por_rev | float) %}
    { action_respond_info("screen home  = " ~ ("SI" if s.homed | int else "NO")) }
    { action_respond_info("screen talla = " ~ (s.nombres[n - 1] if n else "-")) }
    {% if s.homed | int %}
        { action_respond_info("screen pos   = " ~ (mm | round(2)) ~ " mm  (" ~ pul ~ " pulsos)") }
    {% else %}
        { action_respond_info("screen pos   = desconocida (falta home)") }
    {% endif %}
    { action_respond_info("rotation_distance = " ~ cfg.rotation_distance ~ " mm/rev") }
