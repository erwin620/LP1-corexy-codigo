# macros_screen.cfg: indexado horizontal de tallas del screen. Se incluye desde printer.cfg.
#
# Motor independiente de la cabeza que desplaza un screen con 7 tallas en fila.
# Uso:
#   1) SCREEN_HOME                 -> obligatorio antes de elegir talla
#   2) SELECCIONAR_TALLA TALLA=n   -> 1=XS  2=S  3=M  4=L  5=XL  6=2XL  7=3XL
#
# La tabla de tallas está en mm y es la fuente de verdad. Transmisión: piñón
# de 20 dientes 32 DP (diámetro primitivo 0.625") sobre cremallera, directo al
# motor. Avance por vuelta = π · 0.625" = 49.87 mm (rotation_distance, valor
# de catálogo). Paso entre tallas: 4.5" = 114.3 mm. XS queda junto al tope
# (cero) y 3XL en el extremo opuesto.
#
# Si la separación entre tallas crece o se acorta de XS a 3XL, el error está en
# rotation_distance, no en la tabla: medir XS -> 3XL (debe dar 685.8 mm) y
# corregir rotation_distance = 49.87 · 685.8 / medido.
#
# Si todas las tallas están corridas lo mismo, corregir offset_mm (distancia
# del tope a la XS centrada). Para probar sin reiniciar:
#   SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=offset_mm VALUE=n
#   SELECCIONAR_TALLA TALLA=1
# y luego fijar el valor en variable_offset_mm.


# --- Tabla de tallas y estado (interna) ---------------------------------------
[gcode_macro _SCREEN]
description: Tabla de tallas y estado del screen (interna, no llamar)
# mm desde el tope, antes de sumar offset_mm.
variable_mm: [0.0, 114.3, 228.6, 342.9, 457.2, 571.5, 685.8]
variable_nombres: ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL']
# TODO: medir la distancia del tope a la XS centrada.
variable_offset_mm: 0.0
variable_homed: 0
variable_talla: 0
gcode:
    # Solo guarda la tabla y el estado.


# --- Home sensorless (StallGuard) contra el tope mecánico ---------------------
# 'homed' vive en la macro y no en save_variables: se pierde en cada reinicio,
# que es lo correcto porque tras reiniciar la posición real es desconocida.
#
# El screen avanza en sentido horario hacia el tope y el driver detecta el
# atasco por DIAG3/PG11 (jumper DIAG de MOTOR3 puesto; ver printer.cfg).
#
#   SCREEN_HOME                          -> producción
#   SCREEN_HOME SGT=n                    -> calibrar driver_SGT en caliente
#   SCREEN_HOME SGT=n DISTANCIA=50       -> pruebas cerca del tope
#
# Calibración de driver_SGT por bisección, siempre a la velocidad de
# producción (StallGuard depende de la velocidad):
#   - Para antes del tope o casi al instante         -> subir SGT.
#   - Llega al tope y sigue zumbando o saltando pasos -> bajar SGT.
#   - Para en el tope con un toque limpio y repetible -> valor correcto;
#     escribirlo en driver_SGT de printer.cfg.
# Entre intentos, alejar el screen del tope (SELECCIONAR_TALLA o MANUAL_STEPPER).
#
# Sin despegue previo, por diseño (igual que MARCO_HOME). Si se llama con el
# screen ya apoyado en el tope puede saltar pasos o fallar con "No trigger on
# manual_stepper screen after full movement": mover el screen y repetir.
#
# Home falso conocido del sensorless: con el motor desconectado StallGuard
# dispara al instante y el home se da por bueno sin movimiento. Si SCREEN_HOME
# termina sin que el screen se haya movido, revisar el conector de MOTOR3.
[gcode_macro SCREEN_HOME]
description: Lleva el screen al tope (StallGuard) y habilita el indexado
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de homear el screen.") }
    {% endif %}
    {% set cfg  = printer.configfile.settings['manual_stepper screen'] %}
    {% set tmc  = printer.configfile.settings['tmc5160 manual_stepper screen'] %}
    {% set pmax = cfg.position_max | float %}
    # 50 mm/s ≈ 1 vuelta/s, la velocidad de motor a la que se calibró
    # driver_SGT=4. StallGuard depende de las vueltas/s, no de los mm/s: si
    # cambia este valor o rotation_distance, mantener ≈ 1 vuelta/s o recalibrar.
    {% set v        = params.VELOCIDAD | default(50) | float %}
    {% set dist     = params.DISTANCIA | default(pmax + 3) | float %}
    {% set home_cur = params.CORRIENTE | default(1.0) | float %}
    {% set sgt      = params.SGT | default(tmc.driver_sgt) | int %}

    {% if v <= 0 or dist <= 0 or home_cur <= 0 %}
        { action_raise_error("VELOCIDAD, DISTANCIA y CORRIENTE deben ser mayores que 0.") }
    {% endif %}
    {% if sgt < -64 or sgt > 63 %}
        { action_raise_error("SGT fuera de rango: " ~ sgt ~ " (valido -64 a 63).") }
    {% endif %}

    # Se invalida el estado antes de mover: un fallo a medias no debe dejar un
    # home aparente.
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=talla VALUE=0

    # SET_TMC_* usa el nombre corto del eje. El SGT se fija explícitamente para
    # descartar un valor de prueba que haya quedado cargado.
    SET_TMC_FIELD STEPPER=screen FIELD=sgt VALUE={sgt}
    # Corriente de home reducida: atasca antes contra el tope (detección más
    # fiable y menos impacto en la mecánica).
    SET_TMC_CURRENT STEPPER=screen CURRENT={home_cur}
    # Pausa de 2 s: la bandera de stall puede seguir activa de un movimiento
    # anterior (Klipper, TMC_Drivers.md).
    G4 P2000

    MANUAL_STEPPER STEPPER=screen ENABLE=1
    # Se parte de position_max porque position_min limita los MOVE pero no el
    # SET_POSITION; así el barrido hacia el tope cabe en el rango.
    MANUAL_STEPPER STEPPER=screen SET_POSITION={pmax}
    # ACCEL=1250 fijo: driver_SGT se calibró a 25 vueltas/s², que con
    # rotation_distance 49.87 son ≈ 1250 mm/s². Un cambio en el accel de
    # [manual_stepper screen] no debe afectar al home.
    MANUAL_STEPPER STEPPER=screen MOVE={pmax - dist} SPEED={v} ACCEL=1250 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=screen SET_POSITION=0
    M400

    SET_TMC_CURRENT STEPPER=screen CURRENT={tmc.run_current}
    G4 P300

    # homed=1 después del movimiento: si el stall no dispara, el error aborta la
    # macro y homed queda en 0. M118 y no action_respond_info porque la plantilla
    # se evalúa antes de ejecutar los comandos.
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=1
    M118 Screen en cero (home StallGuard, SGT={sgt}). Ya puedes elegir talla.


# --- Elegir talla -------------------------------------------------------------
# SELECCIONAR_TALLA TALLA=4              -> talla L
# SELECCIONAR_TALLA TALLA=7 VELOCIDAD=40 -> 3XL a menor velocidad
[gcode_macro SELECCIONAR_TALLA]
description: Posiciona el screen en el centro de la talla (1=XS ... 7=3XL)
gcode:
    {% set s       = printer['gcode_macro _SCREEN'] %}
    {% set cfg     = printer.configfile.settings['manual_stepper screen'] %}
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% set n       = params.TALLA | default(0) | int %}
    {% set v       = params.VELOCIDAD | default(cfg.velocity) | float %}
    {% set ntallas = s.mm | length %}

    # Todas las guardas se evalúan antes de mover nada.
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de cambiar de talla.") }
    {% endif %}
    {% if s.homed | int != 1 %}
        { action_raise_error("El screen no tiene home. Ejecuta SCREEN_HOME primero.") }
    {% endif %}
    {% if n < 1 or n > ntallas %}
        { action_raise_error("Talla fuera de rango: " ~ n ~ " (validas 1 a " ~ ntallas ~ ").") }
    {% endif %}

    {% set mm   = (s.mm[n - 1] | float) + (s.offset_mm | default(0) | float) %}
    {% set pmin = cfg.position_min | default(0) | float %}
    {% set pmax = cfg.position_max | float %}
    # Klipper también rechazaría el movimiento, pero a mitad de la macro (con el
    # squeegee ya movido) y con un mensaje menos claro.
    {% if mm < pmin or mm > pmax %}
        { action_raise_error("Talla " ~ s.nombres[n - 1] ~ " a " ~ (mm | round(2)) ~ " mm queda fuera del recorrido (" ~ pmin ~ " a " ~ pmax ~ " mm). Revisa offset_mm en _SCREEN o position_max en [manual_stepper screen].") }
    {% endif %}

    _SCREEN_SQUEEGEE_ARRIBA
    MANUAL_STEPPER STEPPER=screen ENABLE=1
    MANUAL_STEPPER STEPPER=screen MOVE={mm} SPEED={v}
    M400
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=talla VALUE={n}
    SAVE_VARIABLE VARIABLE=screen_talla VALUE={n}
    # M118 y no action_respond_info: ver SCREEN_HOME.
    M118 Talla {s.nombres[n - 1]} lista ({mm | round(2)} mm)


# --- Subir el squeegee antes de mover el screen -------------------------------
# Usa el mismo parámetro squeegee_up que PRINT_CYCLE, para que exista una sola
# definición de "squeegee arriba".
[gcode_macro _SCREEN_SQUEEGEE_ARRIBA]
description: Sube el squeegee antes de mover el screen SI se puede (interna)
gcode:
    # El indexado de tallas no exige el home de la cabeza, solo el del screen.
    # Si X tiene posición conocida se sube el squeegee para no arrastrarlo sobre
    # la malla; si no, se avisa y se continúa.
    # _SQUEEGEE_A_ARRIBA (macros_ciclo.cfg) nunca baja el squeegee.
    {% if 'x' in printer.toolhead.homed_axes %}
        _SQUEEGEE_A_ARRIBA
    {% else %}
        M118 Aviso: sin HOME de maquina el squeegee no se sube solo; comprueba que no roce la malla.
    {% endif %}


# --- Diagnóstico ---------------------------------------------------------------
[gcode_macro SCREEN_STATUS]
description: Informa home, talla actual y posicion del screen (mm)
gcode:
    # Klipper no publica el objeto 'manual_stepper screen' (acceder a él lanza
    # UndefinedError); la posición se deriva de la talla seleccionada.
    {% set s   = printer['gcode_macro _SCREEN'] %}
    {% set cfg = printer.configfile.settings['manual_stepper screen'] %}
    {% set n   = s.talla | int %}
    {% set mm  = ((s.mm[n - 1] | float) + (s.offset_mm | default(0) | float)) if n else 0 %}
    { action_respond_info("screen home  = " ~ ("SI" if s.homed | int else "NO")) }
    { action_respond_info("screen talla = " ~ (s.nombres[n - 1] if n else "-")) }
    {% if s.homed | int %}
        { action_respond_info("screen pos   = " ~ (mm | round(2)) ~ " mm") }
    {% else %}
        { action_respond_info("screen pos   = desconocida (falta home)") }
    {% endif %}
    { action_respond_info("rotation_distance = " ~ cfg.rotation_distance ~ " mm/rev") }
    { action_respond_info("offset_mm = " ~ s.offset_mm ~ " (tope -> XS, sumado a toda la tabla)") }
    { action_respond_info("driver_SGT (config) = " ~ printer.configfile.settings['tmc5160 manual_stepper screen'].driver_sgt ~ " -- home StallGuard contra el tope") }
