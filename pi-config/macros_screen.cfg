# ============================================================
# macros_screen.cfg  -  Feature 004: indexado de tallas del screen
# ------------------------------------------------------------
# Se carga desde printer.cfg con:  [include macros_screen.cfg]
#
# El screen es un motor INDEPENDIENTE de la cabeza que desplaza
# HORIZONTALMENTE un screen ancho con 7 tallas grabadas en fila.
#
# FLUJO DEL OPERADOR:
#   1) SCREEN_HOME                 -> obligatorio; sin el no se puede elegir talla
#   2) SELECCIONAR_TALLA TALLA=n   -> 1=XS  2=S  3=M  4=L  5=XL  6=2XL  7=3XL
#
# LA TABLA ESTA EN MM (desde 2026-10-08) Y ES LA FUENTE DE VERDAD.
# Mecanica nueva: PINON 20 dientes 32 DP (McMaster 6832K52, diametro de
# paso 0.625") sobre CREMALLERA, directo al eje del motor. Avance por
# vuelta = pi x 0.625" = 49.87 mm -> rotation_distance: 49.87 en
# printer.cfg (valor de CATALOGO, eleccion de Erwin; la medicion vieja
# de 9144 pulsos = 143.48 mm daba 50.21).
#   Las tallas estan a 4.5" = 114.3 mm una de otra (medida del screen).
#   XS queda JUNTO AL TOPE (cero) y 3XL en el extremo lejano. OJO: en el
#   PLC es al reves en NUMEROS (XS=D710=44003, 3XL=D770=0) porque el cero
#   del PLC estaba en el OTRO extremo; fisicamente XS esta del lado del tope.
#
# Al estar en mm, la posicion de cada talla depende de rotation_distance
# (y YA NO de los microsteps: Klipper los aplica solo). Si las tallas se
# van separando de mas o de menos de XS a 3XL, el que esta mal es
# rotation_distance, no la tabla: medir XS->3XL (debe dar 685.8 mm) y
# corregir rotation_distance = 49.87 * 685.8 / medido.
# (Antes la tabla iba en PULSOS del PLC con una guarda pulsos_por_rev vs
# microsteps; con la tabla en mm esa dependencia desaparece y se quito.)
#
# Home: SENSORLESS (StallGuard) contra el TOPE MECANICO del lado
# horario, desde 2026-10-08 (antes: switch fisico en DIAG3/PG11).
# El motor gira en sentido HORARIO al ir hacia el cero (por eso el
# barrido va al minimo). Ver la nota en printer.cfg (jumper PUESTO).
#
# OFFSET DE TALLAS: offset_mm se suma a TODA la tabla. Es la distancia
# entre el tope (cero) y la XS bien centrada. Si TODAS las tallas estan
# corridas lo mismo, se corrige aqui. Para probar sin reiniciar:
#   SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=offset_mm VALUE=n
#   SELECCIONAR_TALLA TALLA=1
# y cuando quede bien, escribir el valor en variable_offset_mm.
#
# Ejes de la cabeza:  X = squeegee (X+ = arriba/seguro, X- = abajo/malla)   Y = stroke
#   (polaridad vigente desde 2026-09-03; puede volver a invertirse al tocar
#   la mecanica)
# ============================================================


# --- Tabla de tallas y estado (NO llamar a mano) ---------------------------
[gcode_macro _SCREEN]
description: Tabla de tallas y estado del screen (interna, no llamar)
# mm desde el cero (tope), ANTES de sumar offset_mm. Paso 114.3 mm (4.5").
variable_mm: [0.0, 114.3, 228.6, 342.9, 457.2, 571.5, 685.8]
variable_nombres: ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL']
# 🚨 SIN MEDIR (2026-10-08): tope -> XS centrada, en mm. Ver cabecera.
variable_offset_mm: 0.0
variable_homed: 0
variable_talla: 0
gcode:
    # (vacio a proposito: solo guarda la tabla y el estado)


# --- Home del screen (paso obligatorio antes de elegir talla) --------------
# homed vive en esta macro y NO en save_variables A PROPOSITO: se pierde en
# cada arranque y FIRMWARE_RESTART, que es justo lo que se quiere (tras un
# reinicio la posicion real del screen es desconocida -> hay que rehomear).
#
# SENSORLESS (StallGuard) DESDE 2026-10-08, calcado de MARCO_HOME (validado):
# el screen va en sentido HORARIO hasta chocar con el TOPE MECANICO y el
# driver detecta el atasco por DIAG3/PG11 (jumper de DIAG de MOTOR3 PUESTO).
#
#   SCREEN_HOME                          -> produccion
#   SCREEN_HOME SGT=n                    -> calibrar driver_SGT EN CALIENTE
#   SCREEN_HOME SGT=n DISTANCIA=50       -> primeras pruebas, cerca del tope
#
# CALIBRAR driver_SGT (biseccion, como con marco), siempre a la VELOCIDAD de
# produccion -- StallGuard depende de la velocidad y el SGT bueno a una no
# vale a otra:
#   - Para ANTES de llegar al tope, o casi al instante -> SUBIR SGT.
#   - Llega al tope y SIGUE ZUMBANDO/saltando pasos     -> BAJAR SGT.
#   - Para en el tope, de un toque limpio, repetible    -> ese es. Escribirlo
#     en driver_SGT de printer.cfg, desplegar y FIRMWARE_RESTART.
# Entre intento e intento, alejar el screen del tope (SELECCIONAR_TALLA, o
# MANUAL_STEPPER STEPPER=screen MOVE=...).
#
# 🚨 SIN DESPEGUE, A PEDIDO DE ERWIN (2026-10-08), mismo criterio que marco:
# un solo movimiento hacia el tope. CASO LIMITE CONOCIDO: si se pide
# SCREEN_HOME con el screen YA pegado al tope, StallGuard no tiene tramo de
# movimiento normal con el que comparar y puede saltar pasos o fallar con
# "No trigger on manual_stepper screen after full movement". NO es un bug
# nuevo: mover el screen (elegir una talla) y volver a homear.
#
# 🚨 SIN GUARDA DE SWITCH: la guarda anti-home-falso de la version con switch
# (QUERY_ENDSTOPS + _SCREEN_HOME_GO) se quito con el switch. OJO, el sensorless
# tiene su propio home falso ya visto con X/Y (2026-08-14): con el MOTOR
# DESCONECTADO StallGuard dispara al instante y da el home por bueno sin
# moverse. Si SCREEN_HOME termina "en cero" sin que el screen se haya movido,
# revisar el conector de MOTOR3.
[gcode_macro SCREEN_HOME]
description: Lleva el screen al tope (StallGuard) y habilita el indexado
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de homear el screen.") }
    {% endif %}
    {% set cfg  = printer.configfile.settings['manual_stepper screen'] %}
    {% set tmc  = printer.configfile.settings['tmc5160 manual_stepper screen'] %}
    {% set pmax = cfg.position_max | float %}
    # VELOCIDAD 50 mm/s = ~1 vuelta/s con rotation_distance 49.87. driver_SGT=4
    # se calibro a 1 vuelta/s (40 mm/s con el rotation_distance viejo de 40):
    # StallGuard depende de la velocidad DEL MOTOR, no de los mm/s. Si cambia el
    # default o rotation_distance, mantener ~1 vuelta/s o RECALIBRAR driver_SGT.
    {% set v        = params.VELOCIDAD | default(50) | float %}
    {% set dist     = params.DISTANCIA | default(pmax + 3) | float %}
    {% set home_cur = params.CORRIENTE | default(1.0) | float %}
    {% set sgt      = params.SGT | default(tmc.driver_sgt) | int %}

    {% if v <= 0 or dist <= 0 or home_cur <= 0 %}
        { action_raise_error("VELOCIDAD, DISTANCIA y CORRIENTE deben ser mayores que 0.") }
    {% endif %}
    {% if sgt < -64 or sgt > 63 %}
        { action_raise_error("SGT fuera de rango: " ~ sgt ~ " (valido -64 a 63).") }
    {% endif %}

    # Se invalida el home ANTES de nada: si algo falla a medias no queda un
    # estado que engane al operador.
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=talla VALUE=0

    # Nombre CORTO del eje (screen), no "manual_stepper screen" -- ver MARCO_HOME.
    # SGT explicito: si una prueba con SGT= dejo otro valor cargado en caliente,
    # el home de produccion vuelve siempre al de printer.cfg.
    SET_TMC_FIELD STEPPER=screen FIELD=sgt VALUE={sgt}
    # Corriente de home reducida (mismo criterio que X/Y y marco): atasca antes
    # contra el tope -> deteccion mas fiable y menos golpe a la mecanica.
    SET_TMC_CURRENT STEPPER=screen CURRENT={home_cur}
    # 2 s, no menos: la bandera de stall puede seguir marcada de un movimiento
    # anterior (guia de Klipper, docs/TMC_Drivers.md; ya fallo con marco a 300 ms).
    G4 P2000

    MANUAL_STEPPER STEPPER=screen ENABLE=1
    # Se fija la posicion al techo del rango porque position_min limita los
    # MOVE pero NO el SET_POSITION: asi el barrido cabe en el rango.
    MANUAL_STEPPER STEPPER=screen SET_POSITION={pmax}
    # ACCEL=1250 FIJO A PROPOSITO: driver_SGT se calibro con 1000 mm/s2 a
    # rotation_distance 40 = 25 vueltas/s2; con 49.87 eso son ~1250 mm/s2. Si se
    # cambia el accel de [manual_stepper screen] el home NO se entera.
    MANUAL_STEPPER STEPPER=screen MOVE={pmax - dist} SPEED={v} ACCEL=1250 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=screen SET_POSITION=0
    M400

    SET_TMC_CURRENT STEPPER=screen CURRENT={tmc.run_current}
    G4 P300

    # M118 y no action_respond_info: los mensajes tienen que salir en tiempo de
    # EJECUCION. El jinja se evalua antes de correr los comandos, asi que un
    # action_respond_info aqui avisaria "listo" aunque el home fallara despues.
    # homed=1 va DESPUES del movimiento: si el stall no dispara, el error aborta
    # la macro y homed se queda en 0.
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=homed VALUE=1
    M118 Screen en cero (home StallGuard, SGT={sgt}). Ya puedes elegir talla.


# --- Elegir talla ----------------------------------------------------------
# SELECCIONAR_TALLA TALLA=4              -> va a la talla L
# SELECCIONAR_TALLA TALLA=7 VELOCIDAD=40 -> va a 3XL mas despacio
[gcode_macro SELECCIONAR_TALLA]
description: Posiciona el screen en el centro de la talla (1=XS ... 7=3XL)
gcode:
    {% set s       = printer['gcode_macro _SCREEN'] %}
    {% set cfg     = printer.configfile.settings['manual_stepper screen'] %}
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% set n       = params.TALLA | default(0) | int %}
    {% set v       = params.VELOCIDAD | default(cfg.velocity) | float %}
    {% set ntallas = s.mm | length %}

    # --- guardas: todas ANTES de mover nada ---
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de cambiar de talla.") }
    {% endif %}
    {% if s.homed | int != 1 %}
        { action_raise_error("El screen no tiene home. Ejecuta SCREEN_HOME primero.") }
    {% endif %}
    {% if n < 1 or n > ntallas %}
        { action_raise_error("Talla fuera de rango: " ~ n ~ " (validas 1 a " ~ ntallas ~ ").") }
    {% endif %}

    # + offset_mm: corrimiento comun de toda la tabla respecto al tope (cero).
    {% set mm   = (s.mm[n - 1] | float) + (s.offset_mm | default(0) | float) %}
    {% set pmin = cfg.position_min | default(0) | float %}
    {% set pmax = cfg.position_max | float %}
    # Fuera de recorrido -> error claro ANTES de subir el squeegee o mover nada
    # (Klipper tambien lo rechazaria, pero a mitad de la macro y con un mensaje
    # que no dice que hacer).
    {% if mm < pmin or mm > pmax %}
        { action_raise_error("Talla " ~ s.nombres[n - 1] ~ " a " ~ (mm | round(2)) ~ " mm queda fuera del recorrido (" ~ pmin ~ " a " ~ pmax ~ " mm). Revisa offset_mm en _SCREEN o position_max en [manual_stepper screen].") }
    {% endif %}

    _SCREEN_SQUEEGEE_ARRIBA
    MANUAL_STEPPER STEPPER=screen ENABLE=1
    MANUAL_STEPPER STEPPER=screen MOVE={mm} SPEED={v}
    M400
    SET_GCODE_VARIABLE MACRO=_SCREEN VARIABLE=talla VALUE={n}
    SAVE_VARIABLE VARIABLE=screen_talla VALUE={n}
    # M118 y no action_respond_info: el jinja se evalua ANTES de ejecutar los
    # comandos, asi que un action_respond_info aqui anunciaria "Talla lista"
    # aunque la guarda del squeegee abortara la macro despues. Ya paso.
    M118 Talla {s.nombres[n - 1]} lista ({mm | round(2)} mm)


# --- Guarda de seguridad: subir el squeegee antes de mover el screen -------
# Usa el MISMO parametro del operador que PRINT_CYCLE (squeegee_up), para no
# tener dos definiciones de "squeegee arriba".
[gcode_macro _SCREEN_SQUEEGEE_ARRIBA]
description: Sube el squeegee antes de mover el screen SI se puede (interna)
gcode:
    # EL INDEXADO DE TALLAS ES INDEPENDIENTE DE LA CABEZA (decision de Erwin):
    # elegir talla NO exige el HOME de la maquina (stroke/squeegee); el unico
    # requisito es el HOME DEL SCREEN.
    #
    # Aun asi, si X tiene posicion conocida se sube el squeegee como cortesia,
    # porque mover el screen con el squeegee apoyado lo arrastra sobre la malla.
    # Si X no tiene posicion, se avisa y se sigue: no se bloquea.
    # _SQUEEGEE_A_ARRIBA (macros_ciclo.cfg) nunca baja: si ya esta mas alto, no se mueve.
    {% if 'x' in printer.toolhead.homed_axes %}
        _SQUEEGEE_A_ARRIBA
    {% else %}
        M118 Aviso: sin HOME de maquina el squeegee no se sube solo; comprueba que no roce la malla.
    {% endif %}


# --- Diagnostico (banco y soporte, no para el operador) -------------------
[gcode_macro SCREEN_STATUS]
description: Informa home, talla actual y posicion del screen (mm)
gcode:
    # OJO: esta version de Klipper NO publica el objeto 'manual_stepper screen'
    # en el status (comprobado: el objeto no existe y printer['manual_stepper
    # screen'] lanza UndefinedError). Asi que la posicion se DERIVA de la talla
    # seleccionada, que es lo que si sabemos con certeza.
    {% set s   = printer['gcode_macro _SCREEN'] %}
    {% set cfg = printer.configfile.settings['manual_stepper screen'] %}
    {% set n   = s.talla | int %}
    {% set mm  = ((s.mm[n - 1] | float) + (s.offset_mm | default(0) | float)) if n else 0 %}
    { action_respond_info("screen home  = " ~ ("SI" if s.homed | int else "NO")) }
    { action_respond_info("screen talla = " ~ (s.nombres[n - 1] if n else "-")) }
    {% if s.homed | int %}
        { action_respond_info("screen pos   = " ~ (mm | round(2)) ~ " mm") }
    {% else %}
        { action_respond_info("screen pos   = desconocida (falta home)") }
    {% endif %}
    { action_respond_info("rotation_distance = " ~ cfg.rotation_distance ~ " mm/rev") }
    { action_respond_info("offset_mm = " ~ s.offset_mm ~ " (tope -> XS, sumado a toda la tabla)") }
    { action_respond_info("driver_SGT (config) = " ~ printer.configfile.settings['tmc5160 manual_stepper screen'].driver_sgt ~ " -- home StallGuard contra el tope") }
