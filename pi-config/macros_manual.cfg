# macros_manual.cfg — modo manual.
# Se incluye desde printer.cfg con [include macros_manual.cfg].
#
# Ejecuta los movimientos del ciclo automático de uno en uno desde la pantalla
# MANUAL, para producir paso a paso en lugar de con START.
#
# Los movimientos son idénticos a los de PRINT_CYCLE: posiciones y velocidades
# se leen de save_variables, igual que en el ciclo, así que un SET_CYCLE
# afecta a ambos modos. No se definen parámetros propios del modo manual: dos
# juegos de parámetros acabarían divergiendo.
# La aceleración tampoco se toca: PRINT_CYCLE usa el max_accel del toolhead y
# no emite SET_VELOCITY_LIMIT; añadirlo aquí rompería la equivalencia.
#
# Movimientos absolutos (G90): pulsar dos veces el mismo botón es idempotente.
#
# Secuencia (y orden de los botones en pantalla):
#   1. MARCO_ABAJO           (macros_marco.cfg)
#   2. MANUAL_STROKE_OUT     embarre: stroke al extremo contrario, en vacío
#   3. MANUAL_SQUEEGEE_DOWN
#   4. MANUAL_STROKE_IN      stroke de regreso: la pasada que imprime
#   5. MANUAL_SQUEEGEE_UP
#   6. MARCO_ARRIBA          (macros_marco.cfg)
#   7. INDEX_NEXT            (macros_index.cfg)
#
# Los pasos 1, 6 y 7 usan directamente las macros existentes: un alias
# MANUAL_* sería un segundo nombre para el mismo movimiento, y así las guardas
# aplican igual al invocarlas desde la consola.
#
# Las guardas se repiten en cada macro a propósito: tests/validar_macros.py
# renderiza cada macro aislada sin ejecutar las llamadas anidadas, de modo que
# una guarda en una macro auxiliar compartida nunca se validaría.
#
# Seguridad: la máquina no tiene E-stop y estas macros acercan al operador al
# movimiento, por eso llevan más guardas que el ciclo:
#   - ciclo automático en marcha                          -> se rechaza
#   - sin home                                            -> se rechaza
#   - bajar el squeegee con el marco no abajo             -> se rechaza
#   - mover el stroke con squeegee abajo y marco no abajo -> se rechaza
#
# Ejes: X = squeegee (X+ arriba/seguro, X- abajo/malla), Y = stroke.


# --- Paso 5: subir el squeegee ---
# Único movimiento que no consulta el marco: subir el squeegee siempre es
# seguro y es el remedio para la mayoría de los bloqueos.
[gcode_macro MANUAL_SQUEEGEE_UP]
description: MANUAL: sube el squeegee a squeegee_up (igual que el paso 4 del ciclo)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    # Se exigen X e Y: en CoreXY mover el squeegee gira ambos motores y Klipper
    # requiere los dos ejes homeados para cualquier G1.
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    {% set sq_up = (printer.save_variables.variables.squeegee_up) | default(10) | float %}
    # _SQUEEGEE_A_ARRIBA (macros_ciclo.cfg) nunca baja el squeegee.
    _SQUEEGEE_A_ARRIBA
    # M118 en lugar de action_respond_info: el Jinja se evalúa entero antes del
    # primer comando, así que action_respond_info informaría aunque el
    # movimiento fallara después.
    M118 MANUAL: squeegee ARRIBA (X={sq_up}).


# --- Paso 3: bajar el squeegee ---
# El squeegee no baja si el marco no está abajo: con el marco arriba la
# rasqueta golpearía la paleta o la prenda en lugar de la malla, y el propio
# marco queda en su trayectoria.
[gcode_macro MANUAL_SQUEEGEE_DOWN]
description: MANUAL: baja el squeegee a squeegee_down (igual que el paso 2 del ciclo)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    # Mensajes distintos para "marco arriba" y "posición desconocida" porque el
    # remedio es distinto: bajarlo, o darle una referencia.
    {% set m = printer['gcode_macro _MARCO'] %}
    {% if m.pos | int == 1 %}
        { action_raise_error("No se puede bajar el squeegee con el MARCO ARRIBA: bajaria contra la paleta en vez de contra la malla. Baja primero el marco (boton MARCO ABAJO).") }
    {% elif m.pos | int != 2 or m.homed | int != 1 %}
        { action_raise_error("No se puede bajar el squeegee: la posicion del marco es DESCONOCIDA (Klipper no publica la posicion de un manual_stepper, asi que solo se sabe lo que se le ha mandado). Pulsa MARCO ABAJO, o HOME.") }
    {% endif %}

    {% set v       = printer.save_variables.variables %}
    {% set sq_down = (v.squeegee_down)  | default(90)   | float %}
    {% set sq_f    = (v.squeegee_speed) | default(7000) | float %}
    G90
    G1 X{sq_down}  F{sq_f}
    M400
    M118 MANUAL: squeegee ABAJO (X={sq_down}).


# --- Paso 2: stroke al extremo contrario (embarre, en vacío) ---
# Equivale a _EMBARRAR del ciclo automático.
[gcode_macro MANUAL_STROKE_OUT]
description: MANUAL: stroke al extremo contrario al lado de inicio (paso 1 del ciclo, en vacio)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    {% set v       = printer.save_variables.variables %}
    {% set sq_up   = (v.squeegee_up)   | default(10) | float %}
    {% set sq_down = (v.squeegee_down) | default(90) | float %}
    # Guarda contra el arrastre. Secuencia alcanzable: bajar el marco, bajar el
    # squeegee y volver a subir el marco (no hay guarda inversa). El squeegee
    # queda apoyado sobre la paleta y un stroke lo arrastraría a velocidad de
    # impresión. Con el squeegee arriba, o con el marco abajo, no se bloquea.
    {% if sq_up == sq_down %}
        { action_raise_error("squeegee_up y squeegee_down valen lo mismo (" ~ sq_up ~ "): no hay forma de saber si el squeegee esta arriba o abajo. Revisalos en el MENU.") }
    {% endif %}
    # gcode_position (no toolhead.position): es el sistema de coordenadas de los
    # G1 X del ciclo, con offsets aplicados. Se compara por cercanía relativa y
    # no por igualdad con squeegee_up: si squeegee_up difiere de
    # position_endstop, una comparación exacta bloquearía el stroke tras homear.
    {% set x = printer.gcode_move.gcode_position.x | float %}
    {% if ((x - sq_down) | abs) < ((x - sq_up) | abs) and printer['gcode_macro _MARCO'].pos | int != 2 %}
        { action_raise_error("STROKE bloqueado: el squeegee esta ABAJO y el marco NO esta abajo, asi que la rasqueta apoya sobre la paleta y no sobre la malla. Sube el squeegee, o baja el marco.") }
    {% endif %}

    {% set p_left  = (v.pos_left)     | default(0)    | float %}
    {% set p_right = (v.pos_right)    | default(100)  | float %}
    {% set side    = (v.start_side)   | default(0)    | int %}
    {% set st_f    = (v.stroke_speed) | default(7000) | float %}
    # Mismo cálculo que _EMBARRAR: side 0 = inicio a la izquierda.
    {% set y_end   = p_right if side == 0 else p_left %}
    G90
    G1 Y{y_end}    F{st_f}
    M400
    M118 MANUAL: stroke IDA, en vacio (Y={y_end}).


# --- Paso 4: stroke de regreso (pasada que imprime) ---
[gcode_macro MANUAL_STROKE_IN]
description: MANUAL: stroke de regreso al lado de inicio (paso 3 del ciclo, IMPRIME)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    {% set v       = printer.save_variables.variables %}
    {% set sq_up   = (v.squeegee_up)   | default(10) | float %}
    {% set sq_down = (v.squeegee_down) | default(90) | float %}
    # Misma guarda contra el arrastre que en MANUAL_STROKE_OUT.
    {% if sq_up == sq_down %}
        { action_raise_error("squeegee_up y squeegee_down valen lo mismo (" ~ sq_up ~ "): no hay forma de saber si el squeegee esta arriba o abajo. Revisalos en el MENU.") }
    {% endif %}
    {% set x = printer.gcode_move.gcode_position.x | float %}
    {% if ((x - sq_down) | abs) < ((x - sq_up) | abs) and printer['gcode_macro _MARCO'].pos | int != 2 %}
        { action_raise_error("STROKE bloqueado: el squeegee esta ABAJO y el marco NO esta abajo, asi que la rasqueta apoya sobre la paleta y no sobre la malla. Sube el squeegee, o baja el marco.") }
    {% endif %}

    {% set p_left  = (v.pos_left)     | default(0)    | float %}
    {% set p_right = (v.pos_right)    | default(100)  | float %}
    {% set side    = (v.start_side)   | default(0)    | int %}
    {% set st_f    = (v.stroke_speed) | default(7000) | float %}
    {% set y_start = p_left if side == 0 else p_right %}
    G90
    G1 Y{y_start}  F{st_f}
    M400
    M118 MANUAL: stroke VUELTA, la pasada que imprime (Y={y_start}).


# --- Diagnóstico del modo manual (soporte, no para el operador) ---
# Desde la consola explica por qué un botón de la pantalla está bloqueado.
[gcode_macro MANUAL_STATUS]
description: Informa el estado que gobierna los botones de la pantalla MANUAL
gcode:
    {% set v  = printer.save_variables.variables %}
    {% set m  = printer['gcode_macro _MARCO'] %}
    {% set ix = printer['gcode_macro _INDEX'] %}
    {% set sq_up   = (v.squeegee_up)   | default(10) | float %}
    {% set sq_down = (v.squeegee_down) | default(90) | float %}
    {% set homed_xy = ('x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes) %}
    { action_respond_info("HOME de la cabeza = " ~ ("SI (" ~ printer.toolhead.homed_axes ~ ")" if homed_xy else "NO -- pulsa HOME; sin el, MANUAL no mueve nada")) }
    { action_respond_info("MARCO: home = " ~ ("SI" if m.homed | int == 1 else "NO") ~ "   posicion = " ~ ("ARRIBA" if m.pos | int == 1 else ("ABAJO" if m.pos | int == 2 else "DESCONOCIDA (solo MARCO_HOME o una carrera completa la fijan)"))) }
    {% if homed_xy %}
        {% set x = printer.gcode_move.gcode_position.x | float %}
        { action_respond_info("SQUEEGEE: X = " ~ x ~ "  -> se lee como " ~ ("ABAJO (mas cerca de squeegee_down=" ~ sq_down ~ ")" if ((x - sq_down) | abs) < ((x - sq_up) | abs) else "ARRIBA (mas cerca de squeegee_up=" ~ sq_up ~ ")")) }
    {% endif %}
    { action_respond_info("PLATO: home = " ~ ("SI, estacion " ~ ix.station if ix.homed | int == 1 else "NO -- INDEX_NEXT bloqueado (en modo SOLO CABEZA, HOME_OP no homea el plato)")) }
    { action_respond_info("Ciclo automatico en marcha = " ~ ("SI -- MANUAL bloqueado, pulsa STOP" if printer['gcode_macro _CYCLE_STATE'].running | int == 1 else "no")) }
