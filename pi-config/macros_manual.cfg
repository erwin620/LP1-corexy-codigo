# ============================================================
# macros_manual.cfg  -  MODO MANUAL (feature 012)
# ------------------------------------------------------------
# Se carga desde printer.cfg con:  [include macros_manual.cfg]
#
# QUE ES: los MISMOS movimientos del ciclo automatico, pero disparados de
# uno en uno desde la pantalla MANUAL de la UI del operador. Algunos
# clientes producen asi -- paso a paso, a su ritmo -- en vez de con START.
#
# 🚨 REGLA DE ORO DE ESTA FEATURE: los movimientos son IDENTICOS a los de
# PRINT_CYCLE. Mismas posiciones, misma velocidad, misma aceleracion. Se
# leen de save_variables, el mismo sitio del que los lee el ciclo, asi que
# un SET_CYCLE cambia los dos a la vez. NO se declara aqui ningun parametro
# propio del modo manual: dos juegos de parametros acaban contradiciendose,
# y entonces "manual" y "automatico" imprimirian distinto -- que es
# exactamente lo contrario de lo que se pidio.
#
# La ACELERACION se respeta NO TOCANDOLA: PRINT_CYCLE no emite
# SET_VELOCITY_LIMIT, usa el max_accel del toolhead. Si alguien lo anade
# aqui "para igualar", justo entonces dejarian de ser iguales.
#
# Movimientos ABSOLUTOS (G90), nunca G91: pulsar dos veces el mismo boton es
# idempotente (el eje ya esta ahi) en vez de sumar un segundo recorrido.
#
# --- EL CICLO PASO A PASO (y el orden de los botones en la pantalla) -----
#   1. MARCO_ABAJO           -> macros_marco.cfg
#   2. MANUAL_STROKE_OUT     el stroke viaja al otro extremo, EN VACIO
#   3. MANUAL_SQUEEGEE_DOWN  baja el squeegee
#   4. MANUAL_STROKE_IN      REGRESA imprimiendo  <- la pasada que IMPRIME
#   5. MANUAL_SQUEEGEE_UP    sube el squeegee
#   6. MARCO_ARRIBA          -> macros_marco.cfg
#   7. INDEX_NEXT            -> macros_index.cfg
#
# Los pasos 1, 6 y 7 NO tienen macro propia aqui a proposito: MARCO_ABAJO,
# MARCO_ARRIBA e INDEX_NEXT ya existen y hacen exactamente eso. Envolverlas
# en un MANUAL_* seria un segundo nombre para el mismo movimiento -- la
# leccion que el repo ya se escribio a si mismo en _INDEX_AVANZAR_UNA
# ("duplicarlo seria la forma de que reaparezca un dia un retroceso de -270
# grados"). Ademas asi las guardas valen igual si alguien las llama desde
# Fluidd, no solo si vienen del boton.
#
# --- POR QUE LAS GUARDAS ESTAN COPIADAS EN LAS CUATRO MACROS -------------
# Se ve repetitivo, y lo es. La razon es concreta: tests/validar_macros.py
# renderiza CADA MACRO AISLADA y NO ejecuta las llamadas anidadas. Una
# guarda compartida en una macro auxiliar pasaria todos los tests sin
# haberse comprobado ni una sola vez. Inline, el validador SI la ve.
#
# --- SEGURIDAD -----------------------------------------------------------
# La maquina NO tiene E-stop. Estas macros son las que mas cerca ponen al
# operador del movimiento, asi que llevan mas guardas que el ciclo, no menos:
#   - ciclo automatico en marcha  -> se rechaza (una sola cosa manda a la vez)
#   - sin HOME                    -> se rechaza (requisito del cliente)
#   - bajar el squeegee con el marco que NO esta abajo  -> se rechaza
#   - mover el stroke con el squeegee abajo y el marco no abajo -> se rechaza
# Ejes:  X = squeegee (X+ = arriba/seguro, X- = abajo/malla)   Y = stroke
# ============================================================


# --- Paso 5: sube el squeegee ---------------------------------------------
# El unico movimiento de esta pantalla que NO necesita mirar el marco: subir
# el squeegee es seguro siempre, y ademas es el remedio de casi todo lo demas.
[gcode_macro MANUAL_SQUEEGEE_UP]
description: MANUAL: sube el squeegee a squeegee_up (igual que el paso 4 del ciclo)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    # LOS DOS EJES, no solo X: la maquina es CoreXY, asi que mover el squeegee
    # gira los dos motores y Klipper exige X e Y homeados para cualquier G1.
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    {% set sq_up = (printer.save_variables.variables.squeegee_up) | default(10) | float %}
    # _SQUEEGEE_A_ARRIBA (macros_ciclo.cfg) nunca baja: si ya esta mas alto, no se mueve.
    _SQUEEGEE_A_ARRIBA
    # M118 y no action_respond_info: el jinja de la macro se evalua ENTERO
    # antes de ejecutar su primer comando, asi que un action_respond_info
    # cantaria "listo" aunque el movimiento fallara despues.
    M118 MANUAL: squeegee ARRIBA (X={sq_up}).


# --- Paso 3: baja el squeegee ---------------------------------------------
# 🚨 AQUI VIVE LA GUARDA QUE SE PIDIO: el squeegee NO baja si el marco no esta
# abajo. Con el marco arriba la rasqueta no llega a la malla sino a la paleta
# o a la prenda, y ademas el propio marco le queda en el camino.
[gcode_macro MANUAL_SQUEEGEE_DOWN]
description: MANUAL: baja el squeegee a squeegee_down (igual que el paso 2 del ciclo)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    # DOS MENSAJES DISTINTOS A PROPOSITO. "El marco esta arriba" y "no se sabe
    # donde esta el marco" son cosas distintas, y el remedio tambien: en el
    # primer caso basta con bajarlo, en el segundo hay que darle una referencia.
    # Decir "baja el marco" cuando la posicion es DESCONOCIDA seria mentir.
    {% set m = printer['gcode_macro _MARCO'] %}
    {% if m.pos | int == 1 %}
        { action_raise_error("No se puede bajar el squeegee con el MARCO ARRIBA: bajaria contra la paleta en vez de contra la malla. Baja primero el marco (boton MARCO ABAJO).") }
    {% elif m.pos | int != 2 or m.homed | int != 1 %}
        { action_raise_error("No se puede bajar el squeegee: la posicion del marco es DESCONOCIDA (Klipper no publica la posicion de un manual_stepper, asi que solo se sabe lo que se le ha mandado). Pulsa MARCO ABAJO, o HOME.") }
    {% endif %}

    {% set v       = printer.save_variables.variables %}
    {% set sq_down = (v.squeegee_down)  | default(90)   | float %}
    {% set sq_f    = (v.squeegee_speed) | default(7000) | float %}
    G90
    G1 X{sq_down}  F{sq_f}
    M400
    M118 MANUAL: squeegee ABAJO (X={sq_down}).


# --- Paso 2: el stroke viaja al otro extremo (EN VACIO) -------------------
# "OUT" = se aleja del lado de inicio. Es el EMBARRE (_EMBARRAR, feature 013): el viaje
# que el ciclo hace con el squeegee arriba para colocarse antes de imprimir.
[gcode_macro MANUAL_STROKE_OUT]
description: MANUAL: stroke al extremo contrario al lado de inicio (paso 1 del ciclo, en vacio)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    {% set v       = printer.save_variables.variables %}
    {% set sq_up   = (v.squeegee_up)   | default(10) | float %}
    {% set sq_down = (v.squeegee_down) | default(90) | float %}
    # 🚨 GUARDA DEL ARRASTRE (feature 012). Combinacion alcanzable: bajar el
    # marco, bajar el squeegee, y SUBIR el marco otra vez (permitido: no hay
    # guarda inversa, fue decision explicita). El squeegee queda entonces
    # apoyado sobre la PALETA, y un stroke lo arrastraria por encima a la
    # velocidad de impresion. No es la guarda inversa: es la MISMA condicion
    # de MANUAL_SQUEEGEE_DOWN aplicada al movimiento que la vuelve dano.
    # Con el squeegee arriba no pregunta nada, y el flujo normal
    # (marco abajo -> squeegee abajo -> stroke) no se toca.
    {% if sq_up == sq_down %}
        { action_raise_error("squeegee_up y squeegee_down valen lo mismo (" ~ sq_up ~ "): no hay forma de saber si el squeegee esta arriba o abajo. Revisalos en el MENU.") }
    {% endif %}
    # gcode_position y no toolhead.position: es el sistema de coordenadas en el
    # que estan escritos los G1 X del ciclo (con offsets aplicados).
    # Y se compara por CERCANIA RELATIVA, no por igualdad con squeegee_up: el
    # dia que squeegee_up deje de coincidir con position_endstop (hoy los dos
    # son 280) una comparacion exacta bloquearia el stroke recien homeado.
    {% set x = printer.gcode_move.gcode_position.x | float %}
    {% if ((x - sq_down) | abs) < ((x - sq_up) | abs) and printer['gcode_macro _MARCO'].pos | int != 2 %}
        { action_raise_error("STROKE bloqueado: el squeegee esta ABAJO y el marco NO esta abajo, asi que la rasqueta apoya sobre la paleta y no sobre la malla. Sube el squeegee, o baja el marco.") }
    {% endif %}

    {% set p_left  = (v.pos_left)     | default(0)    | float %}
    {% set p_right = (v.pos_right)    | default(100)  | float %}
    {% set side    = (v.start_side)   | default(0)    | int %}
    {% set st_f    = (v.stroke_speed) | default(7000) | float %}
    # Mismo calculo que PRINT_CYCLE, letra por letra: side 0 = inicio IZQUIERDA.
    {% set y_end   = p_right if side == 0 else p_left %}
    G90
    G1 Y{y_end}    F{st_f}
    M400
    M118 MANUAL: stroke IDA, en vacio (Y={y_end}).


# --- Paso 4: el stroke REGRESA (esta es la pasada que IMPRIME) ------------
[gcode_macro MANUAL_STROKE_IN]
description: MANUAL: stroke de regreso al lado de inicio (paso 3 del ciclo, IMPRIME)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo automatico en marcha: pulsa STOP antes de mover en MANUAL.") }
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        { action_raise_error("MANUAL bloqueado: la maquina no esta homeada. Pulsa HOME antes de mover a mano.") }
    {% endif %}

    {% set v       = printer.save_variables.variables %}
    {% set sq_up   = (v.squeegee_up)   | default(10) | float %}
    {% set sq_down = (v.squeegee_down) | default(90) | float %}
    # Misma guarda del arrastre que en MANUAL_STROKE_OUT (ver su nota larga).
    {% if sq_up == sq_down %}
        { action_raise_error("squeegee_up y squeegee_down valen lo mismo (" ~ sq_up ~ "): no hay forma de saber si el squeegee esta arriba o abajo. Revisalos en el MENU.") }
    {% endif %}
    {% set x = printer.gcode_move.gcode_position.x | float %}
    {% if ((x - sq_down) | abs) < ((x - sq_up) | abs) and printer['gcode_macro _MARCO'].pos | int != 2 %}
        { action_raise_error("STROKE bloqueado: el squeegee esta ABAJO y el marco NO esta abajo, asi que la rasqueta apoya sobre la paleta y no sobre la malla. Sube el squeegee, o baja el marco.") }
    {% endif %}

    {% set p_left  = (v.pos_left)     | default(0)    | float %}
    {% set p_right = (v.pos_right)    | default(100)  | float %}
    {% set side    = (v.start_side)   | default(0)    | int %}
    {% set st_f    = (v.stroke_speed) | default(7000) | float %}
    {% set y_start = p_left if side == 0 else p_right %}
    G90
    G1 Y{y_start}  F{st_f}
    M400
    M118 MANUAL: stroke VUELTA, la pasada que imprime (Y={y_start}).


# --- Diagnostico del modo manual (banco y soporte, no para el operador) ---
# La pantalla ya muestra todo esto, pero desde la consola de Fluidd es lo
# unico que responde "por que el boton esta bloqueado".
[gcode_macro MANUAL_STATUS]
description: Informa el estado que gobierna los botones de la pantalla MANUAL
gcode:
    {% set v  = printer.save_variables.variables %}
    {% set m  = printer['gcode_macro _MARCO'] %}
    {% set ix = printer['gcode_macro _INDEX'] %}
    {% set sq_up   = (v.squeegee_up)   | default(10) | float %}
    {% set sq_down = (v.squeegee_down) | default(90) | float %}
    {% set homed_xy = ('x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes) %}
    { action_respond_info("HOME de la cabeza = " ~ ("SI (" ~ printer.toolhead.homed_axes ~ ")" if homed_xy else "NO -- pulsa HOME; sin el, MANUAL no mueve nada")) }
    { action_respond_info("MARCO: home = " ~ ("SI" if m.homed | int == 1 else "NO") ~ "   posicion = " ~ ("ARRIBA" if m.pos | int == 1 else ("ABAJO" if m.pos | int == 2 else "DESCONOCIDA (solo MARCO_HOME o una carrera completa la fijan)"))) }
    {% if homed_xy %}
        {% set x = printer.gcode_move.gcode_position.x | float %}
        { action_respond_info("SQUEEGEE: X = " ~ x ~ "  -> se lee como " ~ ("ABAJO (mas cerca de squeegee_down=" ~ sq_down ~ ")" if ((x - sq_down) | abs) < ((x - sq_up) | abs) else "ARRIBA (mas cerca de squeegee_up=" ~ sq_up ~ ")")) }
    {% endif %}
    { action_respond_info("PLATO: home = " ~ ("SI, estacion " ~ ix.station if ix.homed | int == 1 else "NO -- INDEX_NEXT bloqueado (en modo SOLO CABEZA, HOME_OP no homea el plato)")) }
    { action_respond_info("Ciclo automatico en marcha = " ~ ("SI -- MANUAL bloqueado, pulsa STOP" if printer['gcode_macro _CYCLE_STATE'].running | int == 1 else "no")) }
