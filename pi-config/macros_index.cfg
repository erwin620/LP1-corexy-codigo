# ============================================================
# macros_index.cfg  -  INDEX / carrusel de estaciones (ETAPA 1: alta del motor)
# ------------------------------------------------------------
# Se carga desde printer.cfg con:  [include macros_index.cfg]
#
# NOMBRE: el eje se llama 'index' (la funcion), no 'carrusel' (la pieza),
# igual que 'screen'. El plato sigue llamandose carrusel en la documentacion
# y en los mensajes al operador.
#
# Empezo como ETAPA 1 (solo probar el motor: INDEX_TEST). Hoy tiene tambien
# la ETAPA 2: home por sensor inductivo (INDEX_HOME), indexado de las 4
# estaciones (INDEX_NEXT / INDEX_GOTO), sensor de parte y la demo.
#
# MECANICA:  plato de 4 estaciones, reduccion 6:1.
#   rotation_distance = 60 (= 360/6) hace que LA UNIDAD DEL EJE SEA EL GRADO
#   DEL PLATO:   MOVE=360 -> una vuelta del carrusel   MOVE=90 -> una estacion.
#   Si la reduccion real no fuera 6:1, se corrige rotation_distance en
#   printer.cfg y AQUI no hay que tocar nada.
#
# SEGURIDAD: la maquina NO tiene E-stop. Primer giro con el motor a ser posible
# DESACOPLADO del plato, despacio y con la mano en el corte de corriente.
# ============================================================


# --- Prueba de giro --------------------------------------------------------
# INDEX_TEST                          -> 1 vuelta de plato a la velocidad por defecto
# INDEX_TEST VUELTAS=0.25 VELOCIDAD=15 -> 90 grados (una estacion) despacio
# INDEX_TEST SENTIDO=-1               -> misma vuelta al reves
[gcode_macro INDEX_TEST]
description: Prueba de conexion del index: gira N vueltas completas del plato
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el carrusel.") }
    {% endif %}

    {% set cfg     = printer.configfile.settings['manual_stepper index'] %}
    {% set vueltas = params.VUELTAS    | default(1) | float %}
    {% set v       = params.VELOCIDAD  | default(cfg.velocity) | float %}
    {% set sentido = params.SENTIDO    | default(1) | int %}

    {% if vueltas <= 0 %}
        { action_raise_error("VUELTAS debe ser mayor que 0 (recibido: " ~ vueltas ~ ").") }
    {% endif %}
    {% if sentido != 1 and sentido != -1 %}
        { action_raise_error("SENTIDO solo admite 1 o -1 (recibido: " ~ sentido ~ ").") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}

    {% set grados = 360.0 * vueltas * sentido %}

    # SET_POSITION=0 antes de cada prueba: el carrusel todavia NO tiene home,
    # asi que el cero no significa nada; cada prueba es un movimiento relativo
    # a donde este ahora. En la etapa 2 el inductivo dara un cero de verdad.
    _INDEX_ENERGIZAR
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    MANUAL_STEPPER STEPPER=index MOVE={grados} SPEED={v} ACCEL={cfg.accel}
    M400

    # M118 y no action_respond_info: el jinja de una macro se evalua ANTES de
    # ejecutar sus comandos, asi que un action_respond_info aqui cantaria
    # "listo" aunque el movimiento fallara despues. Ya paso en la feature 004.
    M118 Index: {vueltas} vuelta(s) de plato = {grados | round(1)} grados a {v} grados/s.
    # El motor QUEDA HABILITADO a proposito, para poder comprobar el par de
    # retencion girando el plato a mano. INDEX_OFF lo libera.


# ==========================================================================
# EMBUDO DEL ENABLE DEL MOTOR  (feature 007)
# ==========================================================================
# 🚨 REGLA: NADIE llama a "MANUAL_STEPPER STEPPER=index ENABLE=..." directamente.
# Todo pasa por _INDEX_ENERGIZAR o _INDEX_LIBERAR. Sin excepciones.
#
# POR QUE EXISTE ESTO. Esta version de Klipper NO publica los objetos
# manual_stepper en el status, asi que NO SE PUEDE PREGUNTAR si el motor esta
# energizado - igual que no se puede preguntar la posicion (de ahi que
# _INDEX.station sea la posicion de record). Hay que llevar la cuenta a mano en
# _INDEX.energizado, y el boton DESHABILITAR de la pantalla del operador la lee.
#
# Habia OCHO sitios que cambiaban el enable. Poner un SET_GCODE_VARIABLE en cada
# uno es garantizar que el noveno lo rompa, y un boton que dice "energizado" con
# el motor suelto seria el octavo fallo silencioso de esta maquina. Con el embudo
# la variable se actualiza en UN SOLO SITIO por estado.
#
# Si algun dia aparece un ENABLE= suelto para el index, es un bug. Se caza con:
#     grep -n "STEPPER=index ENABLE=" macros_index.cfg
# y solo deberia salir dentro de estas dos macros.
# ==========================================================================

[gcode_macro _INDEX_ENERGIZAR]
description: Energiza el motor del index (interna, no llamar)
gcode:
    MANUAL_STEPPER STEPPER=index ENABLE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=energizado VALUE=1
    # OJO - NO SE TOCA 'homed' AQUI, Y ES DELIBERADO.
    # Energizar recupera el par de retencion, pero NO devuelve la referencia: si
    # el plato se giro a mano mientras estaba suelto, la posicion se perdio de
    # verdad. La unica forma de recuperarla es INDEX_HOME. Poner homed=1 aqui
    # seria inventarse un cero, que es el fallo que este proyecto lleva
    # persiguiendo siete veces.


[gcode_macro _INDEX_LIBERAR]
description: Suelta el motor del index e INVALIDA el home (interna, no llamar)
gcode:
    # El squeegee PRIMERO. Si se suelta el plato con el squeegee apoyado, el
    # operador lo arrastra sobre la malla o sobre la prenda al girarlo a mano.
    # _INDEX_SQUEEGEE_ARRIBA ya trae la guarda buena: si X no tiene posicion
    # avisa y sigue, no bloquea.
    _INDEX_SQUEEGEE_ARRIBA

    MANUAL_STEPPER STEPPER=index ENABLE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=energizado VALUE=0

    # 🐞 INVALIDAR EL HOME NO ES OPCIONAL (arreglado el 2026-08-18).
    # El motivo de existir de soltar el motor es que el plato SE PUEDA GIRAR A
    # MANO. En cuanto el operador lo toca, la posicion guardada es falsa; con
    # homed=1 el ciclo arrancaria sobre un cero inventado, sin E-stop y sin un
    # solo error. Es el mismo fallo que se cerro en M84/M18 esa misma manana,
    # vivo por otra puerta.
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=0

    M118 Plato libre: gira a mano. SE PERDIO EL HOME, hay que hacer INDEX_HOME antes de indexar.


# --- Liberar el motor (compatibilidad de banco) -----------------------------
# Se mantiene el nombre INDEX_OFF porque la bitacora y las notas de banco lo
# citan. Ahora es solo un alias del embudo.
[gcode_macro INDEX_OFF]
description: Libera el motor del index para girar el plato a mano (PIERDE EL HOME)
gcode:
    _INDEX_LIBERAR


# --- Lo que llama el boton DESHABILITAR de la pantalla ----------------------
# INDEX_TOGGLE: si esta energizado lo suelta, y si esta suelto lo energiza.
#
# LA DECISION DE QUE TOCA AHORA SE TOMA AQUI, NO EN LA UI. A proposito: si la
# pantalla decidiera, una UI desactualizada (websocket caido, pestana vieja)
# mandaria el comando CONTRARIO al que hace falta. Klipper es el unico que
# conoce el estado real, asi que el boton solo dice "cambia" y Klipper decide.
[gcode_macro INDEX_TOGGLE]
description: Alterna entre plato libre (gira a mano) y plato energizado
gcode:
    # GUARDA DE CICLO AQUI ADEMAS DE EN EL BOTON. La UI deshabilita el boton
    # cuando el ciclo corre, pero la UI puede estar desactualizada; la macro no.
    # Soltar el plato con la maquina imprimiendo seria perder la posicion a
    # mitad de un ciclo, con el squeegee bajando sobre una prenda.
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de liberar el plato.") }
    {% endif %}

    {% if printer['gcode_macro _INDEX'].energizado | int == 1 %}
        _INDEX_LIBERAR
    {% else %}
        _INDEX_ENERGIZAR
        M118 Plato energizado: ya sujeta posicion. Sigue SIN HOME: haz INDEX_HOME antes de indexar.
    {% endif %}


# --- Diagnostico (banco y soporte, no para el operador) --------------------
[gcode_macro INDEX_STATUS]
description: Informa la configuracion efectiva del index
gcode:
    # OJO: esta version de Klipper NO publica el objeto 'manual_stepper' en el
    # status (comprobado en la feature 004), asi que NO se puede informar la
    # posicion real. Solo se informa la configuracion.
    {% set cfg = printer.configfile.settings['manual_stepper index'] %}
    {% set tmc = printer.configfile.settings['tmc5160 manual_stepper index'] %}
    { action_respond_info("index rotation_distance = " ~ cfg.rotation_distance ~ " -> la unidad del eje es el GRADO DEL PLATO (reduccion 6:1)") }
    {% set st = printer['gcode_macro _INDEX'] %}
    { action_respond_info("index estaciones = " ~ st.estaciones ~ "  ->  " ~ (360.0 / (st.estaciones | int)) | round(1) ~ " grados de plato por estacion") }
    { action_respond_info("index velocidad/accel por defecto = " ~ cfg.velocity ~ " / " ~ cfg.accel ~ " (grados de plato)") }
    { action_respond_info("index run_current = " ~ tmc.run_current ~ " A RMS  (motor 86HS8040A4JEP, 4.0 A RMS de placa; 2.8 A desde 2026-09-09, sense_resistor " ~ tmc.sense_resistor ~ ")") }
    { action_respond_info("index homed = " ~ st.homed ~ "   (0 = sin referencia, hay que hacer INDEX_HOME)") }
    { action_respond_info("index estacion actual = " ~ st.station ~ "   (0 = desconocida. OJO: hoy el plato tiene varios targets, asi que el numero es un contador logico, no un brazo fisico concreto)") }
    { action_respond_info("index sensor de home = inductivo NPN NO en DIAG4/PG12, polaridad ^!PG12 (verificada 2026-08-14)") }
    { action_respond_info("sensor de parte = fotoelectrico difuso NPN en DIAG5/PG13, ^!PG13.  part = " ~ st.part ~ " / disparos = " ~ st.part_eventos ~ "  (detalle: INDEX_PART_STATUS)") }


# ==========================================================================
# HOME DEL INDEX  (etapa 2 - primera pieza)
# ==========================================================================
# Calcado de SCREEN_HOME (feature 004), que ya esta validado en maquina.
# El patron de DOS MACROS es obligatorio: el resultado de QUERY_ENDSTOPS solo
# esta fresco en la macro SIGUIENTE, porque todo el jinja de una macro se
# evalua ANTES de que se ejecute su primer comando.
# ==========================================================================

# --- Estado del index (interna, no llamar) --------------------------------
# 'homed' vive aqui y NO en save_variables A PROPOSITO: se pierde en cada
# arranque y FIRMWARE_RESTART, que es justo lo que se quiere (tras un reinicio
# la posicion real del plato es desconocida -> hay que rehomear).
#
# M84/M18 y el idle_timeout la ponen a 0 a traves del interceptor de M84
# (_INVALIDAR_HOMES en macros_ciclo.cfg; era deuda, cerrada el 2026-08-18).
[gcode_macro _INDEX]
description: Estado del index (interna, no llamar)
variable_homed: 0
variable_station: 0
# energizado = 1 si el motor del index tiene par de retencion, 0 si esta suelto.
# Existe porque esta version de Klipper NO publica los objetos manual_stepper,
# asi que NO se puede preguntar el estado real del enable: hay que llevar la
# cuenta. Solo la escriben _INDEX_ENERGIZAR y _INDEX_LIBERAR (el embudo).
# La lee el boton DESHABILITAR de la pantalla del operador (feature 007).
#
# Arranca en 0 A PROPOSITO: tras un FIRMWARE_RESTART el motor esta suelto, asi
# que 0 es el valor honesto. Decir 1 al arrancar seria mentir.
variable_energizado: 0
# moving = N mientras _INDEX_AVANZAR gira el plato hacia la estacion N; 0 quieto.
# SOLO es para la pantalla: durante el giro homed=0 (a proposito, ver la nota de
# HONESTIDAD DEL ESTADO) y sin esto la UI decia "Plato sin HOME" en cada avance.
# NO es estado de seguridad: ninguna guarda la lee. La UI ademas exige que
# Klipper este ejecutando (idle_timeout = Printing), asi que si un giro se aborta
# y moving se queda colgado, el chip cae a "sin HOME", que es lo honesto.
variable_moving: 0
# part = 1  <=>  paso una pieza durante el ULTIMO avance.
# Lo ARMA el press_gcode de [gcode_button part_sensor] en printer.cfg y lo
# LIMPIA _INDEX_PART_CLEAR al empezar cada avance. NADIE MAS debe tocarlo, y
# sobre todo NO un release_gcode: la cola de botones descarga los pares
# press/release al acabar el movimiento y TERMINA EN UN RELEASE, asi que
# limpiar ahi borraria la deteccion legitima. Ver la nota larga en printer.cfg.
variable_part: 0
# Contador de disparos desde la ultima limpieza. Es SOLO DIAGNOSTICO (sirve para
# la prueba en seco: contar cuantas piezas pasaron en un avance). La decision
# del ciclo se toma con 'part', no con esto.
variable_part_eventos: 0
# NUMERO DE ESTACIONES DEL PLATO - EL UNICO SITIO DONDE SE DECLARA.
# De aqui sale todo lo demas: grados por estacion = 360 / estaciones = 90.
# Si algun dia el plato tiene otro numero de estaciones se cambia AQUI y ni las
# macros de indexado ni INDEX_STATUS hay que tocarlas.
variable_estaciones: 4
# TECHO DE VELOCIDAD DE INDEXADO, en grados de plato/s. NO es un limite
# mecanico: es una RED ANTI-ERROR DE TECLEO (un 1800 en vez de 180). Se
# comprueba en _INDEX_AVANZAR, que es el paso obligatorio de TODOS los avances
# (INDEX_NEXT, INDEX_GOTO y la demo). Si algun dia hace falta mas, se sube AQUI.
# Subido 60 -> 180 -> 360 el 2026-08-17 (con microsteps 32 ya no vibra a 180).
# 360 grados/s de plato = UNA VUELTA COMPLETA POR SEGUNDO = 360 rpm de motor
# con la reduccion 6:1. Ahi es donde un paso a paso a 24 V empieza a perder par
# de verdad, asi que 360 es un techo con sentido y no un numero redondo.
#
# !! OJO - SUBIR SOLO ESTO CASI NO SIRVE. Manda la aceleracion:
#   el avance se vuelve TRIANGULAR por encima de sqrt(ACEL * 90), y de ahi para
#   arriba la velocidad no pinta nada. Con ACEL=800 el umbral son 268 grados/s
#   y el suelo 0.67 s, o sea que pasar de 180 a 360 solo gana 0.05 s.
#   Para ganar de verdad hay que subir LAS DOS: 300/1500 -> 0.50 s.
#
# !! EL LIMITE REAL PUEDE NO SER EL MOTOR, SINO LA PRENDA.
#   La aceleracion centripeta en el borde del plato es w^2 * r. A 360 grados/s
#   (w = 6.28 rad/s) y radio 0.4 m son ~1.6 g: eso TIRA LA PRENDA del pallet.
#   A 180 grados/s son ~0.4 g y no pasa nada. Por eso hay que probar CON PLATO
#   CARGADO DE VERDAD, no solo mirando si se pierden pasos.
variable_vel_max: 360
# TECHO DE ACELERACION, en grados de plato/s^2. Misma idea: red anti-tecleo.
# OJO - POR ENCIMA DE CIERTA VELOCIDAD MANDA LA ACELERACION, NO LA VELOCIDAD:
# en un avance de 90 grados con accel=200 el perfil se vuelve TRIANGULAR a
# partir de ~134 grados/s (nunca llega a la velocidad de crucero), asi que
# subir VELOCIDAD por encima de eso NO acelera nada. El avance no baja de
# ~1.34 s mientras accel siga en 200. Para ir mas rapido hay que subir ACEL.
variable_acel_max: 2000
gcode:
    # (vacio a proposito: solo guarda el estado)


# --- Limpia el flag del sensor de parte (interna, no llamar) ---------------
# Se llama al EMPEZAR cada avance (desde _INDEX_AVANZAR) y en INDEX_HOME.
# Asi 'part' significa siempre "paso una pieza durante el ULTIMO avance".
#
# 🚨 ORDEN CRITICO - EL BUCLE DEL CICLO TIENE QUE LEER ANTES DE VOLVER A AVANZAR.
# El gcode del boton se despacha cuando el mutex se libera, o sea AL TERMINAR el
# comando de nivel superior que hizo el avance. Por eso el bucle es de DOS PASOS:
#     tick A -> avanzar   (limpia el flag, mueve; el boton se encola)
#     ... el mutex se libera aqui: entra el press_gcode y arma part=1 ...
#     tick B -> leer 'part' y decidir imprimir o saltar
#     tick A' -> avanzar de nuevo (vuelve a limpiar)
# Si alguien mete DOS avances seguidos sin leer en medio, la deteccion del
# primero se pierde en silencio. No es un bug de esta macro: es la razon de ser
# del bucle de dos pasos.
[gcode_macro _INDEX_PART_CLEAR]
description: Limpia el flag del sensor de parte (interna, no llamar)
gcode:
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part_eventos VALUE=0


# --- Diagnostico del sensor de parte (banco, no para el operador) ----------
# Para la prueba EN SECO: se limpia, se pasa una prenda a mano por delante del
# sensor, y esto dice si se armo y cuantas veces disparo.
[gcode_macro INDEX_PART_STATUS]
description: Informa el flag del sensor de parte y su contador de disparos
gcode:
    {% set st = printer['gcode_macro _INDEX'] %}
    { action_respond_info("part = " ~ st.part ~ "   (1 = paso una pieza durante el ultimo avance)") }
    { action_respond_info("disparos desde la ultima limpieza = " ~ st.part_eventos ~ "   (solo diagnostico)") }
    { action_respond_info("estado INSTANTANEO del sensor: usa QUERY_BUTTON BUTTON=part_sensor (sin objeto RELEASED, con objeto PRESSED)") }
    { action_respond_info("OJO: el gcode del boton se ENCOLA y se despacha al acabar el movimiento, no al disparar. Ver la nota en printer.cfg.") }


# --- Sube el squeegee antes de girar el plato SI se puede (interna) -------
[gcode_macro _INDEX_SQUEEGEE_ARRIBA]
description: Sube el squeegee antes de mover el plato si X tiene posicion (interna)
gcode:
    # Mover el plato con el squeegee apoyado lo arrastraria sobre la prenda y
    # la malla. Si X no tiene posicion conocida NO se bloquea: se avisa y sigue,
    # igual que _SCREEN_SQUEEGEE_ARRIBA. Asi el home del index se puede probar
    # en banco sin haber homeado la cabeza.
    # _SQUEEGEE_A_ARRIBA (macros_ciclo.cfg) nunca baja: si ya esta mas alto, no se mueve.
    {% if 'x' in printer.toolhead.homed_axes %}
        _SQUEEGEE_A_ARRIBA
    {% else %}
        M118 Aviso: sin HOME de maquina el squeegee no se sube solo; comprueba que no roce.
    {% endif %}


# --- Home del index -------------------------------------------------------
# INDEX_HOME                      -> home a velocidad por defecto
# INDEX_HOME VELOCIDAD=10         -> mas despacio
# INDEX_HOME DESPEGUE=15          -> si el target es ancho y 7.5 grados no bastan
#
# DESPEGUE MINIMO, NO ELIMINADO (2026-09-23, a peticion de Erwin viendo la
# maquina). Erwin probo la version SIN despegue y, en el caso normal (plato
# parqueado justo sobre el sensor tras el home anterior, que es donde termina
# CUALQUIER home), INDEX_HOME abortaba siempre pidiendo mover el plato a mano.
# Eso no es evitable sin movimiento: STOP_ON_ENDSTOP busca el FLANCO de
# disparo, y si se arranca ya sobre el sensor no hay flanco que buscar. Se
# repuso el despegue, primero en 15 grados y luego, viendo la maquina, se
# redujo A LA MITAD (7.5 grados): sigue liberando el target real, pero el
# primer movimiento se ve mucho mas corto.
[gcode_macro INDEX_HOME]
description: Lleva el carrusel al cero (sensor inductivo) y habilita el indexado
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de homear el index.") }
    {% endif %}
    # GUARDA DEL MARCO (2026-10-08), la misma de INDEX_NEXT / INDEX_GOTO: el home
    # gira el plato hasta 400 grados, y con el cuadro abajo arrastraria la paleta.
    # Faltaba aqui, y se llega por INDEX_HOME directo o por HOME_OP con SIMULAR=1
    # (que se salta MARCO_HOME). Solo bloquea con CERTEZA de abajo (pos == 2).
    {% if printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("El MARCO esta ABAJO: girar el plato lo arrastraria contra la paleta. Sube el marco (boton MARCO ARRIBA) antes de homear el plato.") }
    {% endif %}

    # Se invalida el home ANTES de nada: si algo falla a medias no queda un
    # estado que engane al operador.
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=0
    # Tras un home la referencia es nueva: cualquier deteccion anterior sobra.
    _INDEX_PART_CLEAR

    _INDEX_SQUEEGEE_ARRIBA

    # DESPEGUE PREVIO INCONDICIONAL, HACIA ADELANTE (sentido de indexado).
    # Imprescindible: al terminar un home correcto el plato queda JUSTO sobre el
    # sensor (el cero es el punto donde dispara), asi que un SEGUNDO home lo veria
    # "ya activado" y la guarda lo rechazaria para siempre. Despegando se libera
    # si solo estaba aparcado encima; si el sensor esta averiado o sin cablear
    # seguira activado y _INDEX_HOME_GO lo caza.
    # ACCEL=300 EN EL HOME (2026-09-23, a peticion de Erwin): mas baja que los
    # 800 grados/s^2 del indexado normal. El home termina con una parada BRUSCA
    # contra el sensor (STOP_ON_ENDSTOP, sin rampa de frenado -- ver la nota en
    # _INDEX_HOME_GO), asi que menos aceleracion en la arrancada suaviza el
    # gesto completo sin tocar la velocidad de crucero.
    _INDEX_ENERGIZAR
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    MANUAL_STEPPER STEPPER=index MOVE={ params.DESPEGUE | default(7.5) | float } SPEED={ params.VELOCIDAD | default(18) | float } ACCEL=300
    M400

    QUERY_ENDSTOPS
    _INDEX_HOME_GO VELOCIDAD={ params.VELOCIDAD | default(18) }


# Segunda mitad de INDEX_HOME. Separada para poder leer el resultado del
# QUERY_ENDSTOPS que lanza la primera. NO llamar a mano.
[gcode_macro _INDEX_HOME_GO]
description: Segunda mitad de INDEX_HOME (interna, no llamar)
gcode:
    # GUARDA ANTI-HOME-FALSO: si el sensor SIGUE activado despues del despegue,
    # no es que el plato estuviera aparcado encima: el sensor esta trabado,
    # averiado o sin cablear. Sin esta guarda el barrido pararia en el primer
    # instante y el home "terminaria" sin mover el plato, dejando homed=1 y una
    # posicion completamente falsa. Ya paso con el screen: abortar en vez de mentir.
    {% set q = printer.query_endstops.last_query %}
    {% if q['manual_stepper index'] | default(0) | int == 1 %}
        { action_raise_error("El sensor de home del index SIGUE activado tras el despegue: esta trabado, averiado o sin cablear. Revisa el conector DIAG4 (PG12), que el jumper de DIAG de MOTOR4 este QUITADO, y si el target es ancho prueba INDEX_HOME DESPEGUE=30.") }
    {% endif %}

    {% set v = params.VELOCIDAD | default(18) | float %}

    _INDEX_ENERGIZAR

    # UNA SOLA PASADA HACIA ADELANTE, Y SE QUEDA DONDE DISPARA EL SENSOR.
    # 400 grados > una vuelta completa, asi que el target se encuentra si o si
    # vengamos de donde vengamos.
    #
    # NO HAY 2a PASADA NI RETROCESO (decision de Erwin, 2026-08-14, viendo la
    # maquina). Antes retrocedia 10 grados y volvia a entrar despacio. Se quita:
    #   - EL CARRUSEL NUNCA DEBE RETROCEDER. Es criterio de aceptacion de la
    #     spec para produccion, y un retroceso en el home es exactamente el gesto
    #     que se prohibe: con prenda cargada arrastra, y al operador le parece
    #     que la maquina falla.
    #   - No corregia juego de engranes, que era su justificacion: LAS DOS
    #     pasadas entraban ya en el mismo sentido (hacia adelante).
    #   - Con STOP_ON_ENDSTOP la parada la ordena el MCU en el instante del
    #     disparo (trsync corta la generacion de pasos), no un frenado del
    #     planificador: la posicion que se registra es la del disparo. El error
    #     que queda es tiempo de respuesta del sensor x velocidad -> del orden de
    #     0.015 grados a 15 grados/s. La 2a pasada no compraba precision.
    #
    # LO QUE SI HAY QUE VIGILAR A CAMBIO: la parada es BRUSCA, sin rampa de
    # frenado. Con el plato cargado la inercia puede hacer perder pasos justo al
    # disparar. Sintomas: un golpe seco al parar, o que el cero no repita.
    # REMEDIO: bajar la velocidad -> INDEX_HOME VELOCIDAD=8. NO volver a meter
    # el retroceso.
    # ACCEL=300, misma razon que el despegue (ver INDEX_HOME): suaviza el
    # arranque de este barrido tambien, aunque la parada contra el sensor sigue
    # siendo brusca por diseno (STOP_ON_ENDSTOP no frena).
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    MANUAL_STEPPER STEPPER=index MOVE=400 SPEED={v} ACCEL=300 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    M400

    # M118 y no action_respond_info: los mensajes tienen que salir en tiempo de
    # EJECUCION. El jinja se evalua antes de correr los comandos, asi que un
    # action_respond_info aqui avisaria "listo" aunque el home fallara despues.
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=1
    M118 Index en cero: estacion 1. Ya se puede indexar.


# ==========================================================================
# INDEXADO DE LAS ESTACIONES  (etapa 2 - segunda pieza)
# ==========================================================================
# INDEX_NEXT                -> avanza UNA estacion (90 grados)
# INDEX_GOTO ESTACION=3     -> va a la estacion 3, SIEMPRE HACIA ADELANTE
# INDEX_NEXT VELOCIDAD=8    -> mas despacio
#
# ---- REGLA DE ORO: EL CARRUSEL NUNCA RETROCEDE --------------------------
# De la estacion 4 a la 1 se AVANZAN 90 grados, no se retroceden 270. Es
# criterio de aceptacion de la spec: con prenda cargada un retroceso la
# arrastra, y al operador le parece que la maquina falla. Es la misma razon por
# la que el 2026-08-14 se quito el retroceso del home.
# El calculo es un modulo:   delta = (destino - actual) % estaciones  -> 0..3
# El % de jinja es el de Python, asi que (1 - 4) % 4 = 1: de la estacion 4 a la
# 1 sale "avanzar una estacion", que es justo lo que se quiere.
#
# ---- LA POSICION DE RECORD ES _INDEX.station, NO la coordenada del eje ---
# Esta version de Klipper NO publica el objeto 'manual_stepper' en el status
# (comprobado en la feature 004), asi que la posicion real del eje NO SE PUEDE
# LEER. Por eso cada avance hace SET_POSITION=0 y un movimiento RELATIVO.
# Consecuencias, las dos buenas:
#   - La coordenada del eje se queda siempre entre 0 y 90 -> NO hay que
#     renormalizar al dar la vuelta. El preflight #8 deja de existir: no hay
#     coordenada que crezca sin limite ni que choque con limites no declarados.
#   - No se pierde precision: 90 grados de plato son 9600 PASOS EXACTOS
#     (200 pasos x 32 microsteps = 6400 pasos por vuelta de motor, y una vuelta
#     de motor son 60 grados de plato -> 106.667 pasos/grado, pero 90 grados
#     caen justos). No hay residuo fraccionario que se acumule avance a avance.
#
# ---- HONESTIDAD DEL ESTADO ----------------------------------------------
# _INDEX_AVANZAR invalida homed=0 ANTES de mover y repone homed=1 + la estacion
# nueva DESPUES del M400. Si el movimiento se corta a medias (error, STOP, corte
# de corriente) el plato queda en un angulo desconocido y el estado dice
# homed=0, obligando a rehomear EN VEZ DE MENTIR. Mismo criterio que
# INDEX_HOME, y la leccion de los home falsos que ya costaron dos sesiones.
#
# ---- OJO, PENDIENTE DE HARDWARE ----------------------------------------
# Hoy el plato tiene VARIOS targets (~1 por estacion, confirmado 2026-08-14),
# asi que INDEX_HOME para en el SIGUIENTE target, no en un cero absoluto: el
# numero de estacion es un contador logico consistente, pero NO identifica un
# brazo fisico concreto del plato. Los avances de aqui son correctos igualmente
# (van por pasos de motor), pero mientras no se decida lo de los targets no se
# puede decir "la estacion 1 es ESE brazo".
# ==========================================================================

# --- Motor del avance (interna, no llamar) --------------------------------
# NO lleva guarda de _CYCLE_STATE A PROPOSITO: es la primitiva que el propio
# bucle del carrusel va a llamar, y una guarda aqui lo bloquearia a si mismo.
# La guarda de ciclo vive en las macros de OPERADOR (INDEX_NEXT / INDEX_GOTO).
[gcode_macro _INDEX_AVANZAR]
description: Avanza el carrusel N grados y actualiza la estacion (interna, no llamar)
gcode:
    {% set cfg     = printer.configfile.settings['manual_stepper index'] %}
    {% set grados  = params.GRADOS    | float %}
    {% set destino = params.DESTINO   | int %}
    # Los dos por defecto DESDE printer.cfg (velocity 180 / accel 800 desde el
    # 2026-09-09). Ahi esta el unico sitio donde se declaran.
    {% set v       = params.VELOCIDAD | default(cfg.velocity) | float %}
    {% set a       = params.ACEL      | default(cfg.accel) | float %}

    # Guarda de la regla de oro EN EL PUNTO DE PASO OBLIGATORIO: cualquier
    # llamador futuro que calcule mal el delta y pida un giro hacia atras se
    # caza aqui, no en la prenda.
    {% if grados <= 0 %}
        { action_raise_error("Avance del carrusel invalido: " ~ grados ~ " grados. El carrusel SOLO avanza (grados > 0); nunca retrocede.") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% set vmax = printer['gcode_macro _INDEX'].vel_max  | float %}
    {% set amax = printer['gcode_macro _INDEX'].acel_max | float %}
    {% if v > vmax %}
        { action_raise_error("VELOCIDAD " ~ v ~ " grados/s pasa del techo de " ~ vmax ~ ". Es una red anti-error de tecleo, no un limite mecanico: si de verdad hace falta mas, sube variable_vel_max en la macro _INDEX. El carrusel NO se ha movido.") }
    {% endif %}
    {% if a <= 0 %}
        { action_raise_error("ACEL debe ser mayor que 0 (recibido: " ~ a ~ ").") }
    {% endif %}
    {% if a > amax %}
        { action_raise_error("ACEL " ~ a ~ " grados/s^2 pasa del techo de " ~ amax ~ " (variable_acel_max en _INDEX). El carrusel NO se ha movido.") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=moving VALUE={destino}

    # El flag del sensor de parte se limpia AQUI, ANTES de mover, para que al
    # acabar el avance signifique "paso una pieza durante ESTE avance". El
    # press_gcode del boton se encola durante el giro y entra al liberarse el
    # mutex, o sea DESPUES de esta macro -> lo lee el paso siguiente del bucle.
    _INDEX_PART_CLEAR

    _INDEX_SQUEEGEE_ARRIBA

    _INDEX_ENERGIZAR
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    {% if params.EMBARRAR | default(0) | int == 1 %}
        # FEATURE 013: giro y EMBARRE A LA VEZ. SYNC=0 encola el giro sin esperarlo
        # y el G1 Y de _EMBARRAR arranca en el mismo instante. Despues, SYNC=1 sin
        # MOVE hace esperar al toolhead hasta que el plato termine: M400 solo
        # espera al toolhead, y si el stroke dura menos que el giro, el estado
        # (homed/station) se repondria con el plato todavia girando.
        MANUAL_STEPPER STEPPER=index MOVE={grados} SPEED={v} ACCEL={a} SYNC=0
        _EMBARRAR
        MANUAL_STEPPER STEPPER=index SYNC=1
    {% else %}
        MANUAL_STEPPER STEPPER=index MOVE={grados} SPEED={v} ACCEL={a}
    {% endif %}
    M400

    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE={destino}
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=moving VALUE=0
    # El motor QUEDA HABILITADO a proposito: el plato tiene que sujetar posicion
    # entre avances. INDEX_OFF lo libera si hay que girarlo a mano.
    M118 Carrusel en la estacion {destino} (avance de {grados | round(1)} grados a {v} grados/s, accel {a}).


# --- Avanzar una estacion -------------------------------------------------
[gcode_macro INDEX_NEXT]
description: Avanza el carrusel una estacion (siempre hacia adelante)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el carrusel a mano.") }
    {% endif %}
    # 🚨 GUARDA DEL MARCO (feature 012). Girar el plato con el cuadro bajado lo
    # arrastra contra la paleta. En el ciclo automatico esto no hacia falta
    # -- PRINT_CYCLE siempre sube el marco antes de terminar la pieza, y la
    # spec de la 011 decia por eso que "no hace falta ninguna guarda extra en
    # el bucle del carrusel". ESO DEJA DE SER CIERTO con la pantalla MANUAL,
    # donde el operador puede dejar el marco abajo y pulsar el boton de indexar.
    #
    # VA AQUI, EN LA MACRO DE OPERADOR, Y NO EN _INDEX_AVANZAR: esa primitiva
    # es la que llama el bucle del carrusel, y un action_raise_error dentro de
    # un delayed_gcode mata el tick ANTES de reagendar -> running=1 colgado y
    # todo bloqueado (la trampa ya documentada en macros_ciclo.cfg). Aqui
    # ademas cubre a quien lo llame desde Fluidd, no solo al boton.
    #
    # Solo bloquea con CERTEZA de abajo (pos == 2). Con la posicion
    # DESCONOCIDA se deja pasar: es el comportamiento de siempre, y una maquina
    # que no usa el marco motorizado no debe quedarse sin indexar.
    {% if printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("El MARCO esta ABAJO: girar el plato lo arrastraria contra la paleta. Sube el marco (boton MARCO ARRIBA) antes de indexar.") }
    {% endif %}

    _INDEX_AVANZAR_UNA {rawparams}


# --- Avanzar una estacion SIN guarda de ciclo (interna, no llamar) ----------
# Existe para que el BUCLE DEL CARRUSEL pueda avanzar: el bucle corre con
# _CYCLE_STATE.running = 1, asi que si llamara a INDEX_NEXT su propia guarda lo
# bloquearia. Aqui vive el calculo de la estacion destino, en UN SOLO SITIO:
# duplicarlo en macros_ciclo.cfg seria la forma de que reaparezca un dia un
# retroceso de -270 grados. La guarda de ciclo se queda arriba, en INDEX_NEXT,
# que es la macro de OPERADOR.
[gcode_macro _INDEX_AVANZAR_UNA]
description: Avanza UNA estacion, sin guarda de ciclo (interna, no llamar)
gcode:
    {% set st = printer['gcode_macro _INDEX'] %}
    {% if st.homed | int != 1 %}
        { action_raise_error("El carrusel no tiene HOME: haz INDEX_HOME antes de indexar. Sin referencia no se sabe en que estacion esta.") }
    {% endif %}

    {% set n = st.estaciones | int %}
    # ((actual % n) + 1) da la vuelta sola: 1->2, 2->3, 3->4, 4->1.
    _INDEX_AVANZAR GRADOS={ 360.0 / n } DESTINO={ ((st.station | int) % n) + 1 } VELOCIDAD={ params.VELOCIDAD | default(printer.configfile.settings['manual_stepper index'].velocity) } ACEL={ params.ACEL | default(printer.configfile.settings['manual_stepper index'].accel) } EMBARRAR={ params.EMBARRAR | default(0) }


# --- Ir a una estacion concreta -------------------------------------------
[gcode_macro INDEX_GOTO]
description: Lleva el carrusel a una estacion concreta, siempre hacia adelante
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el carrusel a mano.") }
    {% endif %}
    # Misma guarda del marco que en INDEX_NEXT (ver su nota larga): el plato no
    # gira con el cuadro abajo. Solo bloquea con certeza (pos == 2).
    {% if printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("El MARCO esta ABAJO: girar el plato lo arrastraria contra la paleta. Sube el marco (boton MARCO ARRIBA) antes de indexar.") }
    {% endif %}

    {% set st = printer['gcode_macro _INDEX'] %}
    {% set n  = st.estaciones | int %}

    # Validacion del parametro ANTES de cualquier otra cosa: un error de tecleo
    # no debe mover el plato ni un grado.
    {% if 'ESTACION' not in params %}
        { action_raise_error("Falta ESTACION. Uso: INDEX_GOTO ESTACION=1 .. " ~ n ~ ". El carrusel NO se ha movido.") }
    {% endif %}
    {% set destino = params.ESTACION | int %}
    {% if destino < 1 or destino > n %}
        { action_raise_error("ESTACION fuera de rango: " ~ destino ~ ". Solo 1 .. " ~ n ~ ". El carrusel NO se ha movido.") }
    {% endif %}

    {% if st.homed | int != 1 %}
        { action_raise_error("El carrusel no tiene HOME: haz INDEX_HOME antes de indexar. Sin referencia no se sabe en que estacion esta.") }
    {% endif %}

    # delta SIEMPRE hacia adelante: 0..n-1. Ver la REGLA DE ORO de arriba.
    {% set delta = (destino - (st.station | int)) % n %}
    {% if delta == 0 %}
        # Ya esta ahi. NO se da una vuelta completa "por si acaso": mover el
        # plato sin necesidad es arrastrar prenda y gastar ciclo.
        M118 El carrusel ya esta en la estacion {destino}: no se mueve.
    {% else %}
        _INDEX_AVANZAR GRADOS={ delta * 360.0 / n } DESTINO={destino} VELOCIDAD={ params.VELOCIDAD | default(printer.configfile.settings['manual_stepper index'].velocity) } ACEL={ params.ACEL | default(printer.configfile.settings['manual_stepper index'].accel) }
    {% endif %}


# ==========================================================================
# DEMO / PRUEBA DE RESISTENCIA DEL INDEXADO
# ==========================================================================
# INDEX_DEMO                       -> una vuelta (4 estaciones), 1 s en cada una
# INDEX_DEMO PASOS=20              -> 20 avances (5 vueltas)
# INDEX_DEMO PASOS=0               -> CONTINUO hasta INDEX_DEMO_STOP
# INDEX_DEMO ESPERA=2 VELOCIDAD=10 -> 2 s parado en cada estacion, mas despacio
# INDEX_DEMO_SET VELOCIDAD=25      -> CAMBIA LA VELOCIDAD SIN PARAR LA DEMO
# INDEX_DEMO_SET ACEL=800          -> cambia la aceleracion sin parar la demo
# INDEX_DEMO_STOP                  -> para al terminar la estacion en curso
#
# ---- SI SUBES VELOCIDAD Y NO VA MAS RAPIDO, ES LA ACELERACION -----------
# En un avance de 90 grados con accel=200 el perfil se vuelve TRIANGULAR a
# partir de ~134 grados/s: el plato no llega nunca a la velocidad de crucero
# porque se pasa el avance entero acelerando y frenando. Subir VELOCIDAD de ahi
# para arriba no cambia NADA. El suelo del avance es ~1.34 s con accel=200.
# Para bajar de eso hay que subir ACEL (techo en _INDEX.acel_max).
# ACEL=0 significa "usa el accel de printer.cfg", que es el comportamiento
# de siempre.
#
# ---- SUBIR LA VELOCIDAD EN CALIENTE -------------------------------------
# El tick RELEE variable_velocidad en CADA avance, asi que INDEX_DEMO_SET tiene
# efecto en el avance siguiente sin cortar el bucle. Es la forma de buscar la
# velocidad maxima real del plato cargado: se lanza PASOS=0 y se va subiendo
# hasta que suena mal, en vez de parar y relanzar en cada intento.
# El techo esta en _INDEX.vel_max (anti-tecleo), y lo aplica _INDEX_AVANZAR.
#
# !! TRAS UNA TANDA RAPIDA, REHOMEAR Y MIRAR LA MARCA. Si a esa velocidad se
# perdieron pasos, la posicion de record (_INDEX.station) sigue diciendo la
# estacion correcta mientras el plato ya NO esta ahi: el fallo es SILENCIOSO.
# La unica prueba de que una velocidad es buena es que el plato vuelva a la
# marca despues de la tanda.
#
# ---- POR QUE delayed_gcode Y NO UN BUCLE for DE JINJA -------------------
# Un {% for %} de jinja NO es un bucle en tiempo de ejecucion: se DESENROLLA al
# evaluar la macro y mete los N avances de golpe en la cola de comandos. Una vez
# lanzado NO SE PUEDE PARAR salvo M112 o cortar la corriente, y esta maquina NO
# TIENE E-STOP. Con un delayed_gcode que se re-arma solo, cada avance es una
# decision nueva: INDEX_DEMO_STOP desarma el temporizador y la demo termina sola
# al acabar el avance en curso. Ademas PASOS=0 (continuo) sale gratis y no
# consume cola.
#
# ---- LA ESPERA ES UN G4 REAL, NO EL DURATION DEL TEMPORIZADOR -----------
# 🐞 MEDIDO EN MAQUINA EL 2026-08-17, Y NO ERA LO QUE PARECIA.
# La primera version re-armaba con UPDATE_DELAYED_GCODE DURATION={espera}
# CONFIANDO en que el M400 de dentro de INDEX_NEXT bloqueaba el script hasta
# que el plato parara. NO ES ASI: el temporizador corre EN PARALELO al
# movimiento. Medido con ESPERA=4 y un avance de 1.8 s el intervalo salio
# 4.00 s EXACTOS, no 5.8. El modelo que ajustan los datos es
#       intervalo = max(ESPERA, tiempo_de_avance + 0.26)
# o sea que DURATION era un PERIODO, no una pausa: con ESPERA=1 y avances de
# 6 s (15 grados/s) la parada real en la estacion era de 0.26 s, NO de 1 s.
# ARREGLO: la espera se hace con un G4 EXPLICITO despues del avance y el
# temporizador se re-arma con un DURATION minimo. Asi ESPERA vuelve a
# significar lo que dice: segundos PARADO en la estacion.
# LECCION: un temporizador que "parece" esperar hay que MEDIRLO. Es la misma
# familia que los home falsos: la maquina hacia algo distinto de lo que
# decia el comentario, y sin cronometro no se veia.
#
# ---- SE PARA SOLA SI ALGO VA MAL ----------------------------------------
# Si INDEX_NEXT falla (se pierde el home, arranca el ciclo de produccion, un
# error cualquiera), el script del tick aborta ANTES de llegar al re-armado y la
# demo se detiene. No hay que hacer nada: el fallo desarma el bucle.
# Cada tick RE-COMPRUEBA las guardas de INDEX_NEXT, no solo la primera vez.
# ==========================================================================

[gcode_macro INDEX_DEMO]
description: Prueba: avanza una estacion, espera y sigue. Parar con INDEX_DEMO_STOP
variable_restantes: 0
variable_espera: 1.0
variable_velocidad: 15.0
# 0 = usar el accel de printer.cfg. Cualquier otro valor lo pisa.
variable_aceleracion: 0
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de lanzar la demo del carrusel.") }
    {% endif %}

    {% set st = printer['gcode_macro _INDEX'] %}
    {% if st.homed | int != 1 %}
        { action_raise_error("El carrusel no tiene HOME: haz INDEX_HOME antes de lanzar la demo.") }
    {% endif %}

    {% set pasos = params.PASOS     | default(st.estaciones) | int %}
    {% set esp   = params.ESPERA    | default(1.0) | float %}
    {% set v     = params.VELOCIDAD | default(printer.configfile.settings['manual_stepper index'].velocity) | float %}
    # ACEL=0 (por defecto) = usar el accel de printer.cfg. _INDEX_AVANZAR valida
    # el techo; aqui solo se guarda lo que pida el operador.
    {% set a     = params.ACEL      | default(0)   | float %}

    {% if pasos < 0 %}
        { action_raise_error("PASOS no puede ser negativo (recibido: " ~ pasos ~ "). PASOS=0 significa CONTINUO.") }
    {% endif %}
    # ESPERA minima 0.1 s: con 0 el temporizador se re-armaria sin holgura y la
    # demo seria practicamente imparable, que es justo lo que se quiere evitar.
    {% if esp < 0.1 %}
        { action_raise_error("ESPERA minima 0.1 s (recibido: " ~ esp ~ "). Con esperas de 0 la demo no se puede parar a tiempo.") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}

    # restantes = -1 es el centinela de CONTINUO (el tick no decrementa).
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=restantes VALUE={ -1 if pasos == 0 else pasos }
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=espera      VALUE={esp}
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=velocidad   VALUE={v}
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=aceleracion VALUE={a}

    {% if pasos == 0 %}
        M118 Demo del carrusel: CONTINUO, {esp} s en cada estacion a {v} grados/s. Parar con INDEX_DEMO_STOP.
    {% else %}
        M118 Demo del carrusel: {pasos} avance(s), {esp} s en cada estacion a {v} grados/s. Parar con INDEX_DEMO_STOP.
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_INDEX_DEMO_TICK DURATION=0.1


# --- Un avance de la demo (interna, se re-arma sola) ----------------------
[delayed_gcode _INDEX_DEMO_TICK]
initial_duration: 0
gcode:
    {% set d = printer['gcode_macro INDEX_DEMO'] %}
    {% set r = d.restantes | int %}
    {% if r != 0 %}
        # El M400 de dentro de INDEX_NEXT hace que esto no vuelva hasta que el
        # plato ha parado. El re-armado de abajo cuenta desde ahi.
        INDEX_NEXT VELOCIDAD={ d.velocidad } ACEL={ d.aceleracion | float if (d.aceleracion | float) > 0 else printer.configfile.settings['manual_stepper index'].accel }
        {% if r > 0 %}
            SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=restantes VALUE={ r - 1 }
        {% endif %}
        # La espera, con el plato YA PARADO. G4 + M400 y no DURATION: ver la
        # nota del 2026-08-17 arriba (DURATION corre en paralelo al movimiento).
        G4 P{ ((d.espera | float) * 1000) | round | int }
        M400
        # Re-armado con el minimo: el que espera es el G4, no el temporizador.
        UPDATE_DELAYED_GCODE ID=_INDEX_DEMO_TICK DURATION=0.05
    {% else %}
        M118 Demo del carrusel terminada.
    {% endif %}


# --- Parar la demo --------------------------------------------------------
[gcode_macro INDEX_DEMO_STOP]
description: Detiene la demo del carrusel al terminar la estacion en curso
gcode:
    # Se desarma el temporizador Y se pone el contador a 0: si el tick estuviera
    # justo en mitad de un avance, al terminar se re-armaria; con restantes=0 el
    # siguiente tick no mueve nada. Doble cierre a proposito.
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=restantes VALUE=0
    UPDATE_DELAYED_GCODE ID=_INDEX_DEMO_TICK DURATION=0
    M118 Demo del carrusel detenida (termina el avance en curso y no sigue).


# --- Cambiar velocidad / espera SIN parar la demo -------------------------
# Funciona porque el tick relee las variables en cada avance: lo que se cambie
# aqui entra en el avance SIGUIENTE. No reinicia el contador de PASOS.
# Se puede usar tambien con la demo parada, para dejar preparados los valores.
[gcode_macro INDEX_DEMO_SET]
description: Cambia VELOCIDAD y/o ESPERA de la demo en marcha, sin cortarla
gcode:
    {% if 'VELOCIDAD' not in params and 'ESPERA' not in params and 'ACEL' not in params %}
        { action_raise_error("Nada que cambiar. Uso: INDEX_DEMO_SET VELOCIDAD=25 [ESPERA=0.5] [ACEL=800]") }
    {% endif %}

    {% if 'VELOCIDAD' in params %}
        {% set v    = params.VELOCIDAD | float %}
        {% set vmax = printer['gcode_macro _INDEX'].vel_max | float %}
        {% if v <= 0 %}
            { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
        {% endif %}
        # Se valida AQUI y no solo en _INDEX_AVANZAR: si se dejara pasar un valor
        # imposible, el fallo saldria en el tick siguiente (dentro de un
        # delayed_gcode), donde el error es mucho mas dificil de relacionar con
        # el comando que lo causo. Mejor rechazarlo en la cara del operador.
        {% if v > vmax %}
            { action_raise_error("VELOCIDAD " ~ v ~ " grados/s pasa del techo de " ~ vmax ~ " (variable_vel_max en _INDEX). No se ha cambiado nada.") }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=velocidad VALUE={v}
        M118 Demo: velocidad -> {v} grados/s (entra en el avance siguiente).
    {% endif %}

    {% if 'ESPERA' in params %}
        {% set e = params.ESPERA | float %}
        {% if e < 0.1 %}
            { action_raise_error("ESPERA minima 0.1 s (recibido: " ~ e ~ "). Con esperas de 0 la demo no se puede parar a tiempo.") }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=espera VALUE={e}
        M118 Demo: espera -> {e} s (entra en el avance siguiente).
    {% endif %}

    {% if 'ACEL' in params %}
        {% set a    = params.ACEL | float %}
        {% set amax = printer['gcode_macro _INDEX'].acel_max | float %}
        {% if a < 0 %}
            { action_raise_error("ACEL no puede ser negativa (recibido: " ~ a ~ "). ACEL=0 significa 'usar el accel de printer.cfg'.") }
        {% endif %}
        {% if a > amax %}
            { action_raise_error("ACEL " ~ a ~ " grados/s^2 pasa del techo de " ~ amax ~ " (variable_acel_max en _INDEX). No se ha cambiado nada.") }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=aceleracion VALUE={a}
        {% if a == 0 %}
            M118 Demo: aceleracion -> la de printer.cfg (entra en el avance siguiente).
        {% else %}
            M118 Demo: aceleracion -> {a} grados/s^2 (entra en el avance siguiente).
        {% endif %}
    {% endif %}
