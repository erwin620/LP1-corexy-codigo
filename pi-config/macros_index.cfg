# macros_index.cfg - Carrusel de estaciones (eje 'index') y sensor de parte.
# Se carga desde printer.cfg con [include macros_index.cfg].
#
# Mecánica: plato de 4 estaciones con reducción 6:1. rotation_distance = 60
# (360/6) hace que la unidad del eje sea el grado de plato: MOVE=360 es una
# vuelta del carrusel y MOVE=90 una estación. Si la reducción real cambia, se
# corrige rotation_distance en printer.cfg y este archivo no se toca.
#
# Seguridad: la máquina no tiene E-stop. El primer giro conviene hacerlo con el
# motor desacoplado del plato, a baja velocidad y con acceso al corte de corriente.


# --- Prueba de giro ---
# INDEX_TEST                           -> 1 vuelta de plato a la velocidad por defecto
# INDEX_TEST VUELTAS=0.25 VELOCIDAD=15 -> 90 grados (una estación) despacio
# INDEX_TEST SENTIDO=-1                -> misma vuelta en sentido contrario
[gcode_macro INDEX_TEST]
description: Prueba de conexion del index: gira N vueltas completas del plato
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el carrusel.") }
    {% endif %}

    {% set cfg     = printer.configfile.settings['manual_stepper index'] %}
    {% set vueltas = params.VUELTAS    | default(1) | float %}
    {% set v       = params.VELOCIDAD  | default(cfg.velocity) | float %}
    {% set sentido = params.SENTIDO    | default(1) | int %}

    {% if vueltas <= 0 %}
        { action_raise_error("VUELTAS debe ser mayor que 0 (recibido: " ~ vueltas ~ ").") }
    {% endif %}
    {% if sentido != 1 and sentido != -1 %}
        { action_raise_error("SENTIDO solo admite 1 o -1 (recibido: " ~ sentido ~ ").") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}

    {% set grados = 360.0 * vueltas * sentido %}

    # Movimiento relativo a la posición actual: la prueba no requiere home.
    _INDEX_ENERGIZAR
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    MANUAL_STEPPER STEPPER=index MOVE={grados} SPEED={v} ACCEL={cfg.accel}
    M400

    # M118 y no action_respond_info: el Jinja se evalúa antes de ejecutar los
    # comandos, así que action_respond_info informaría éxito aunque el
    # movimiento fallara después.
    M118 Index: {vueltas} vuelta(s) de plato = {grados | round(1)} grados a {v} grados/s.
    # El motor queda habilitado para poder comprobar el par de retención a mano.
    # INDEX_OFF lo libera.


# --- Habilitación del motor ---
# Todo cambio de enable del index pasa por _INDEX_ENERGIZAR o _INDEX_LIBERAR;
# nunca se llama a "MANUAL_STEPPER STEPPER=index ENABLE=..." en otro sitio.
# Klipper no publica los objetos manual_stepper en el status, así que el estado
# del enable no se puede consultar: se lleva en _INDEX.energizado, que lee el
# botón DESHABILITAR de la pantalla. Centralizarlo garantiza que esa variable se
# actualice en un único punto por estado.
# Comprobación: grep -n "STEPPER=index ENABLE=" macros_index.cfg

[gcode_macro _INDEX_ENERGIZAR]
description: Energiza el motor del index (interna, no llamar)
gcode:
    MANUAL_STEPPER STEPPER=index ENABLE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=energizado VALUE=1
    # No se modifica 'homed': energizar recupera el par de retención, pero no la
    # referencia. Si el plato se giró a mano mientras estaba suelto, la posición
    # se perdió y solo INDEX_HOME la recupera.


[gcode_macro _INDEX_LIBERAR]
description: Suelta el motor del index e INVALIDA el home (interna, no llamar)
gcode:
    # El squeegee sube primero: con el plato suelto el operador lo gira a mano y
    # arrastraría el squeegee sobre la malla o la prenda. Si X no tiene posición,
    # _INDEX_SQUEEGEE_ARRIBA avisa y continúa.
    _INDEX_SQUEEGEE_ARRIBA

    MANUAL_STEPPER STEPPER=index ENABLE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=energizado VALUE=0

    # Invalidar el home es obligatorio: el plato liberado se puede girar a mano,
    # y con homed=1 el ciclo arrancaría sobre una posición falsa sin ningún error.
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=0

    M118 Plato libre: gira a mano. SE PERDIO EL HOME, hay que hacer INDEX_HOME antes de indexar.


# --- Liberar el motor (alias de banco) ---
[gcode_macro INDEX_OFF]
description: Libera el motor del index para girar el plato a mano (PIERDE EL HOME)
gcode:
    _INDEX_LIBERAR


# --- Botón DESHABILITAR de la pantalla ---
# La decisión de liberar o energizar se toma aquí y no en la UI: una UI
# desactualizada (websocket caído, pestaña antigua) enviaría el comando
# contrario. La UI solo pide "alternar" y Klipper, que conoce el estado, decide.
[gcode_macro INDEX_TOGGLE]
description: Alterna entre plato libre (gira a mano) y plato energizado
gcode:
    # Guarda de ciclo también aquí, no solo en la UI: liberar el plato durante un
    # ciclo perdería la posición con el squeegee bajando sobre la prenda.
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de liberar el plato.") }
    {% endif %}

    {% if printer['gcode_macro _INDEX'].energizado | int == 1 %}
        _INDEX_LIBERAR
    {% else %}
        _INDEX_ENERGIZAR
        M118 Plato energizado: ya sujeta posicion. Sigue SIN HOME: haz INDEX_HOME antes de indexar.
    {% endif %}


# --- Diagnóstico (banco y soporte) ---
[gcode_macro INDEX_STATUS]
description: Informa la configuracion efectiva del index
gcode:
    # Klipper no publica el objeto manual_stepper en el status: no se puede
    # informar la posición real, solo la configuración y el estado lógico.
    {% set cfg = printer.configfile.settings['manual_stepper index'] %}
    {% set tmc = printer.configfile.settings['tmc5160 manual_stepper index'] %}
    { action_respond_info("index rotation_distance = " ~ cfg.rotation_distance ~ " -> la unidad del eje es el GRADO DEL PLATO (reduccion 6:1)") }
    {% set st = printer['gcode_macro _INDEX'] %}
    { action_respond_info("index estaciones = " ~ st.estaciones ~ "  ->  " ~ (360.0 / (st.estaciones | int)) | round(1) ~ " grados de plato por estacion") }
    { action_respond_info("index velocidad/accel por defecto = " ~ cfg.velocity ~ " / " ~ cfg.accel ~ " (grados de plato)") }
    { action_respond_info("index run_current = " ~ tmc.run_current ~ " A RMS  (motor 86HS8040A4JEP, 4.0 A RMS de placa; 2.8 A desde 2026-09-09, sense_resistor " ~ tmc.sense_resistor ~ ")") }
    { action_respond_info("index homed = " ~ st.homed ~ "   (0 = sin referencia, hay que hacer INDEX_HOME)") }
    { action_respond_info("index estacion actual = " ~ st.station ~ "   (0 = desconocida. OJO: hoy el plato tiene varios targets, asi que el numero es un contador logico, no un brazo fisico concreto)") }
    { action_respond_info("index sensor de home = inductivo NPN NO en DIAG4/PG12, polaridad ^!PG12 (verificada 2026-08-14)") }
    { action_respond_info("sensor de parte = fotoelectrico difuso NPN en DIAG5/PG13, ^!PG13.  part = " ~ st.part ~ " / disparos = " ~ st.part_eventos ~ "  (detalle: INDEX_PART_STATUS)") }


# --- Home del carrusel ---
# Usa el patrón de dos macros de SCREEN_HOME: el resultado de QUERY_ENDSTOPS
# solo es legible en la macro siguiente, porque el Jinja de una macro se evalúa
# entero antes de ejecutar su primer comando.

# --- Estado del index (interna) ---
# 'homed' vive aquí y no en save_variables a propósito: se pierde en cada
# arranque y FIRMWARE_RESTART, cuando la posición real del plato es desconocida.
# M84/M18 y el idle_timeout lo ponen a 0 a través de _INVALIDAR_HOMES
# (macros_ciclo.cfg).
[gcode_macro _INDEX]
description: Estado del index (interna, no llamar)
variable_homed: 0
variable_station: 0
# energizado: 1 si el motor tiene par de retención, 0 si está suelto. Solo lo
# escriben _INDEX_ENERGIZAR y _INDEX_LIBERAR. Arranca en 0 porque tras un
# reinicio el motor está deshabilitado.
variable_energizado: 0
# moving: estación destino mientras _INDEX_AVANZAR gira el plato; 0 en reposo.
# Solo informativo para la pantalla (durante el giro homed=0). Ninguna guarda de
# seguridad lo lee; si un giro se aborta y queda colgado, la UI muestra "sin
# HOME", porque además exige idle_timeout = Printing.
variable_moving: 0
# part: 1 si pasó una pieza durante el último avance. Lo activa el press_gcode
# de [gcode_button part_sensor] (printer.cfg) y lo limpia _INDEX_PART_CLEAR al
# empezar cada avance. No debe limpiarse en release_gcode: la cola de botones
# despacha los pares press/release al acabar el movimiento y termina en un
# release, que borraría una detección válida.
variable_part: 0
# part_eventos: disparos desde la última limpieza. Solo diagnóstico; el ciclo
# decide con 'part'.
variable_part_eventos: 0
# Número de estaciones del plato; único punto donde se declara. Los grados por
# estación (360 / estaciones) se derivan de aquí.
variable_estaciones: 4
# Techo de velocidad de indexado (grados de plato/s). Es una protección contra
# errores de tecleo, no un límite mecánico; se aplica en _INDEX_AVANZAR.
# 360 grados/s = 1 vuelta de plato/s = 360 rpm de motor con la reducción 6:1,
# donde un paso a paso a 24 V empieza a perder par.
#
# Subir solo la velocidad apenas acelera el avance: por encima de
# sqrt(ACEL * 90) el perfil de un avance de 90 grados es triangular y nunca
# alcanza la velocidad de crucero. Con ACEL=800 el umbral es 268 grados/s y el
# mínimo 0.67 s; para bajar de ahí hay que subir ambas (300/1500 -> 0.50 s).
#
# El límite práctico puede ser la prenda: la aceleración centrípeta en el borde
# es w^2 * r. A 360 grados/s y r = 0.4 m son ~1.6 g, suficiente para desplazar
# la prenda del pallet; a 180 grados/s son ~0.4 g. Validar con el plato cargado.
variable_vel_max: 360
# Techo de aceleración (grados de plato/s^2), con el mismo propósito anti-tecleo.
variable_acel_max: 2000
gcode:
    # Sin comandos: la macro solo almacena estado.


# --- Limpieza del flag del sensor de parte (interna) ---
# Se llama al empezar cada avance (_INDEX_AVANZAR) y en INDEX_HOME, de modo que
# 'part' siempre se refiere al último avance.
#
# El gcode del botón se despacha al liberarse el mutex, es decir, al terminar el
# comando de nivel superior que hizo el avance. Por eso el bucle del ciclo debe
# leer 'part' entre dos avances:
#     tick A  -> avanzar (limpia el flag y mueve; el botón se encola)
#     ... se libera el mutex: el press_gcode pone part=1 ...
#     tick B  -> leer 'part' y decidir imprimir o saltar
#     tick A' -> avanzar de nuevo (vuelve a limpiar)
# Dos avances seguidos sin lectura intermedia pierden la detección del primero.
[gcode_macro _INDEX_PART_CLEAR]
description: Limpia el flag del sensor de parte (interna, no llamar)
gcode:
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=part_eventos VALUE=0


# --- Diagnóstico del sensor de parte (banco) ---
# Prueba en seco: limpiar, pasar una prenda a mano frente al sensor y consultar.
[gcode_macro INDEX_PART_STATUS]
description: Informa el flag del sensor de parte y su contador de disparos
gcode:
    {% set st = printer['gcode_macro _INDEX'] %}
    { action_respond_info("part = " ~ st.part ~ "   (1 = paso una pieza durante el ultimo avance)") }
    { action_respond_info("disparos desde la ultima limpieza = " ~ st.part_eventos ~ "   (solo diagnostico)") }
    { action_respond_info("estado INSTANTANEO del sensor: usa QUERY_BUTTON BUTTON=part_sensor (sin objeto RELEASED, con objeto PRESSED)") }
    { action_respond_info("OJO: el gcode del boton se ENCOLA y se despacha al acabar el movimiento, no al disparar. Ver la nota en printer.cfg.") }


# --- Subir el squeegee antes de girar el plato (interna) ---
[gcode_macro _INDEX_SQUEEGEE_ARRIBA]
description: Sube el squeegee antes de mover el plato si X tiene posicion (interna)
gcode:
    # Girar el plato con el squeegee apoyado lo arrastraría sobre la prenda y la
    # malla. Sin posición de X solo se avisa (igual que _SCREEN_SQUEEGEE_ARRIBA),
    # para poder probar el home del index en banco sin homear la cabeza.
    # _SQUEEGEE_A_ARRIBA (macros_ciclo.cfg) nunca baja el squeegee.
    {% if 'x' in printer.toolhead.homed_axes %}
        _SQUEEGEE_A_ARRIBA
    {% else %}
        M118 Aviso: sin HOME de maquina el squeegee no se sube solo; comprueba que no roce.
    {% endif %}


# --- Home del index ---
# INDEX_HOME                -> home a velocidad por defecto
# INDEX_HOME VELOCIDAD=10   -> más despacio
# INDEX_HOME DESPEGUE=15    -> si el target es ancho y 7.5 grados no bastan
[gcode_macro INDEX_HOME]
description: Lleva el carrusel al cero (sensor inductivo) y habilita el indexado
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de homear el index.") }
    {% endif %}
    # El home gira el plato hasta 400 grados; con el marco abajo arrastraría la
    # paleta. Se llega aquí también por HOME_OP con SIMULAR=1, que omite
    # MARCO_HOME. Solo bloquea cuando el marco está abajo con certeza (pos == 2).
    {% if printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("El MARCO esta ABAJO: girar el plato lo arrastraria contra la paleta. Sube el marco (boton MARCO ARRIBA) antes de homear el plato.") }
    {% endif %}

    # El home se invalida antes de nada para que un fallo a medias no deje un
    # estado engañoso.
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=0
    _INDEX_PART_CLEAR

    _INDEX_SQUEEGEE_ARRIBA

    # Despegue previo incondicional hacia adelante. Tras un home correcto el
    # plato queda justo sobre el sensor, y STOP_ON_ENDSTOP necesita un flanco de
    # disparo: sin despegue, el siguiente home abortaría siempre. Si el sensor
    # sigue activo tras el despegue, _INDEX_HOME_GO lo trata como avería.
    # ACCEL=300 (menor que la del indexado) suaviza el arranque, ya que el home
    # termina con una parada sin rampa contra el sensor.
    _INDEX_ENERGIZAR
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    MANUAL_STEPPER STEPPER=index MOVE={ params.DESPEGUE | default(7.5) | float } SPEED={ params.VELOCIDAD | default(18) | float } ACCEL=300
    M400

    QUERY_ENDSTOPS
    _INDEX_HOME_GO VELOCIDAD={ params.VELOCIDAD | default(18) }


# Segunda mitad de INDEX_HOME: lee el resultado del QUERY_ENDSTOPS anterior.
[gcode_macro _INDEX_HOME_GO]
description: Segunda mitad de INDEX_HOME (interna, no llamar)
gcode:
    # Si el sensor sigue activo tras el despegue está trabado, averiado o sin
    # cablear. Sin esta guarda el barrido se detendría al instante y dejaría
    # homed=1 con una posición falsa.
    {% set q = printer.query_endstops.last_query %}
    {% if q['manual_stepper index'] | default(0) | int == 1 %}
        { action_raise_error("El sensor de home del index SIGUE activado tras el despegue: esta trabado, averiado o sin cablear. Revisa el conector DIAG4 (PG12), que el jumper de DIAG de MOTOR4 este QUITADO, y si el target es ancho prueba INDEX_HOME DESPEGUE=30.") }
    {% endif %}

    {% set v = params.VELOCIDAD | default(18) | float %}

    _INDEX_ENERGIZAR

    # Una sola pasada hacia adelante que se detiene donde dispara el sensor.
    # 400 grados supera una vuelta, así que el target se encuentra desde
    # cualquier posición.
    #
    # Sin segunda pasada ni retroceso:
    #   - El carrusel nunca retrocede: con prenda cargada la arrastraría.
    #   - Con STOP_ON_ENDSTOP el MCU corta los pasos en el instante del disparo
    #     (trsync), y la posición registrada es la del disparo. El error es
    #     tiempo de respuesta del sensor x velocidad (~0.015 grados a 15 grados/s),
    #     así que una segunda pasada lenta no aporta precisión.
    #
    # Contrapartida: la parada es brusca, sin rampa. Con el plato cargado la
    # inercia puede hacer perder pasos al disparar (golpe seco o cero que no
    # repite). Remedio: bajar la velocidad (INDEX_HOME VELOCIDAD=8), no añadir
    # retroceso. ACCEL=300 suaviza el arranque del barrido.
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    MANUAL_STEPPER STEPPER=index MOVE=400 SPEED={v} ACCEL=300 STOP_ON_ENDSTOP=home
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    M400

    # El estado y el mensaje se emiten en tiempo de ejecución, después del
    # movimiento (ver nota de M118 en INDEX_TEST).
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE=1
    M118 Index en cero: estacion 1. Ya se puede indexar.


# --- Indexado de estaciones ---
# INDEX_NEXT                -> avanza una estación (90 grados)
# INDEX_GOTO ESTACION=3     -> va a la estación 3, siempre hacia adelante
# INDEX_NEXT VELOCIDAD=8    -> más despacio
#
# El carrusel nunca retrocede: de la estación 4 a la 1 avanza 90 grados en vez
# de retroceder 270, porque un retroceso arrastra la prenda cargada.
# delta = (destino - actual) % estaciones, con el % de Python: (1 - 4) % 4 = 1.
#
# La posición de referencia es _INDEX.station, no la coordenada del eje, que
# Klipper no publica. Cada avance hace SET_POSITION=0 y un movimiento relativo:
#   - La coordenada del eje queda acotada entre 0 y 90 grados, sin renormalizar.
#   - No se acumula error: 90 grados de plato son exactamente 9600 pasos
#     (200 pasos x 32 micropasos por vuelta de motor = 60 grados de plato).
#
# Estado honesto: _INDEX_AVANZAR pone homed=0 antes de mover y repone homed=1 y
# la estación después del M400. Si el movimiento se interrumpe, el estado exige
# rehomear en lugar de reportar una estación falsa.
#
# TODO: el plato tiene un target por estación, así que INDEX_HOME se detiene en
# el siguiente target y no en un cero absoluto. El número de estación es un
# contador lógico consistente, pero no identifica un brazo físico concreto.

# --- Avance del carrusel (interna) ---
# Sin guarda de _CYCLE_STATE: es la primitiva que usa el bucle del carrusel y
# esa guarda lo bloquearía. La guarda de ciclo está en INDEX_NEXT / INDEX_GOTO.
[gcode_macro _INDEX_AVANZAR]
description: Avanza el carrusel N grados y actualiza la estacion (interna, no llamar)
gcode:
    {% set cfg     = printer.configfile.settings['manual_stepper index'] %}
    {% set grados  = params.GRADOS    | float %}
    {% set destino = params.DESTINO   | int %}
    # Valores por defecto de velocity/accel: [manual_stepper index] en printer.cfg.
    {% set v       = params.VELOCIDAD | default(cfg.velocity) | float %}
    {% set a       = params.ACEL      | default(cfg.accel) | float %}

    # Punto de paso obligatorio de todo avance: cualquier llamador que calcule
    # mal el delta y pida un giro hacia atrás se rechaza aquí.
    {% if grados <= 0 %}
        { action_raise_error("Avance del carrusel invalido: " ~ grados ~ " grados. El carrusel SOLO avanza (grados > 0); nunca retrocede.") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}
    {% set vmax = printer['gcode_macro _INDEX'].vel_max  | float %}
    {% set amax = printer['gcode_macro _INDEX'].acel_max | float %}
    {% if v > vmax %}
        { action_raise_error("VELOCIDAD " ~ v ~ " grados/s pasa del techo de " ~ vmax ~ ". Es una red anti-error de tecleo, no un limite mecanico: si de verdad hace falta mas, sube variable_vel_max en la macro _INDEX. El carrusel NO se ha movido.") }
    {% endif %}
    {% if a <= 0 %}
        { action_raise_error("ACEL debe ser mayor que 0 (recibido: " ~ a ~ ").") }
    {% endif %}
    {% if a > amax %}
        { action_raise_error("ACEL " ~ a ~ " grados/s^2 pasa del techo de " ~ amax ~ " (variable_acel_max en _INDEX). El carrusel NO se ha movido.") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=moving VALUE={destino}

    # Se limpia antes de mover para que, al acabar, 'part' se refiera a este
    # avance. El press_gcode se encola durante el giro y se ejecuta después de
    # esta macro, así que lo lee el paso siguiente del bucle.
    _INDEX_PART_CLEAR

    _INDEX_SQUEEGEE_ARRIBA

    _INDEX_ENERGIZAR
    MANUAL_STEPPER STEPPER=index SET_POSITION=0
    {% if params.EMBARRAR | default(0) | int == 1 %}
        # Giro y embarre simultáneos: SYNC=0 encola el giro sin esperarlo y el
        # G1 Y de _EMBARRAR arranca a la vez. SYNC=1 sin MOVE espera a que el
        # plato termine; M400 solo espera al toolhead, y si el stroke dura menos
        # que el giro el estado se repondría con el plato aún en movimiento.
        MANUAL_STEPPER STEPPER=index MOVE={grados} SPEED={v} ACCEL={a} SYNC=0
        _EMBARRAR
        MANUAL_STEPPER STEPPER=index SYNC=1
    {% else %}
        MANUAL_STEPPER STEPPER=index MOVE={grados} SPEED={v} ACCEL={a}
    {% endif %}
    M400

    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=homed VALUE=1
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=station VALUE={destino}
    SET_GCODE_VARIABLE MACRO=_INDEX VARIABLE=moving VALUE=0
    # El motor queda habilitado para sujetar el plato entre avances.
    M118 Carrusel en la estacion {destino} (avance de {grados | round(1)} grados a {v} grados/s, accel {a}).


# --- Avanzar una estación ---
[gcode_macro INDEX_NEXT]
description: Avanza el carrusel una estacion (siempre hacia adelante)
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el carrusel a mano.") }
    {% endif %}
    # Guarda del marco: girar el plato con el marco abajo lo arrastra contra la
    # paleta. En el ciclo automático no ocurre (PRINT_CYCLE sube el marco), pero
    # sí desde la pantalla manual o Fluidd.
    # Va en la macro de operador y no en _INDEX_AVANZAR: un action_raise_error
    # dentro de un delayed_gcode aborta el tick antes de reprogramarlo y deja
    # running=1 bloqueado (ver macros_ciclo.cfg).
    # Solo bloquea con certeza (pos == 2); con posición desconocida se permite,
    # para no impedir el indexado en máquinas sin marco motorizado.
    {% if printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("El MARCO esta ABAJO: girar el plato lo arrastraria contra la paleta. Sube el marco (boton MARCO ARRIBA) antes de indexar.") }
    {% endif %}

    _INDEX_AVANZAR_UNA {rawparams}


# --- Avanzar una estación sin guarda de ciclo (interna) ---
# La usa el bucle del carrusel, que corre con _CYCLE_STATE.running = 1 y sería
# bloqueado por la guarda de INDEX_NEXT. El cálculo de la estación destino vive
# solo aquí para no duplicarlo en macros_ciclo.cfg.
[gcode_macro _INDEX_AVANZAR_UNA]
description: Avanza UNA estacion, sin guarda de ciclo (interna, no llamar)
gcode:
    {% set st = printer['gcode_macro _INDEX'] %}
    {% if st.homed | int != 1 %}
        { action_raise_error("El carrusel no tiene HOME: haz INDEX_HOME antes de indexar. Sin referencia no se sabe en que estacion esta.") }
    {% endif %}

    {% set n = st.estaciones | int %}
    # ((actual % n) + 1): 1->2, 2->3, 3->4, 4->1.
    _INDEX_AVANZAR GRADOS={ 360.0 / n } DESTINO={ ((st.station | int) % n) + 1 } VELOCIDAD={ params.VELOCIDAD | default(printer.configfile.settings['manual_stepper index'].velocity) } ACEL={ params.ACEL | default(printer.configfile.settings['manual_stepper index'].accel) } EMBARRAR={ params.EMBARRAR | default(0) }


# --- Ir a una estación concreta ---
[gcode_macro INDEX_GOTO]
description: Lleva el carrusel a una estacion concreta, siempre hacia adelante
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de mover el carrusel a mano.") }
    {% endif %}
    # Misma guarda del marco que INDEX_NEXT.
    {% if printer['gcode_macro _MARCO'].pos | int == 2 %}
        { action_raise_error("El MARCO esta ABAJO: girar el plato lo arrastraria contra la paleta. Sube el marco (boton MARCO ARRIBA) antes de indexar.") }
    {% endif %}

    {% set st = printer['gcode_macro _INDEX'] %}
    {% set n  = st.estaciones | int %}

    # El parámetro se valida antes de cualquier movimiento.
    {% if 'ESTACION' not in params %}
        { action_raise_error("Falta ESTACION. Uso: INDEX_GOTO ESTACION=1 .. " ~ n ~ ". El carrusel NO se ha movido.") }
    {% endif %}
    {% set destino = params.ESTACION | int %}
    {% if destino < 1 or destino > n %}
        { action_raise_error("ESTACION fuera de rango: " ~ destino ~ ". Solo 1 .. " ~ n ~ ". El carrusel NO se ha movido.") }
    {% endif %}

    {% if st.homed | int != 1 %}
        { action_raise_error("El carrusel no tiene HOME: haz INDEX_HOME antes de indexar. Sin referencia no se sabe en que estacion esta.") }
    {% endif %}

    # delta siempre hacia adelante (0..n-1).
    {% set delta = (destino - (st.station | int)) % n %}
    {% if delta == 0 %}
        # Ya está en destino: no se da una vuelta completa innecesaria.
        M118 El carrusel ya esta en la estacion {destino}: no se mueve.
    {% else %}
        _INDEX_AVANZAR GRADOS={ delta * 360.0 / n } DESTINO={destino} VELOCIDAD={ params.VELOCIDAD | default(printer.configfile.settings['manual_stepper index'].velocity) } ACEL={ params.ACEL | default(printer.configfile.settings['manual_stepper index'].accel) }
    {% endif %}


# --- Demo / prueba de resistencia del indexado ---
# INDEX_DEMO                       -> una vuelta (4 estaciones), 1 s en cada una
# INDEX_DEMO PASOS=20              -> 20 avances (5 vueltas)
# INDEX_DEMO PASOS=0               -> continuo hasta INDEX_DEMO_STOP
# INDEX_DEMO ESPERA=2 VELOCIDAD=10 -> 2 s en cada estación, más despacio
# INDEX_DEMO_SET VELOCIDAD=25      -> cambia la velocidad sin detener la demo
# INDEX_DEMO_SET ACEL=800          -> cambia la aceleración sin detener la demo
# INDEX_DEMO_STOP                  -> se detiene al terminar el avance en curso
#
# ACEL=0 usa el accel de printer.cfg. Si subir VELOCIDAD no acorta el avance,
# el perfil ya es triangular (ver vel_max en _INDEX): hay que subir ACEL.
#
# El tick relee las variables en cada avance, así que con PASOS=0 se puede ir
# subiendo la velocidad con INDEX_DEMO_SET hasta encontrar el máximo real del
# plato cargado.
#
# Tras una tanda rápida, rehomear y comprobar la marca: si se perdieron pasos,
# _INDEX.station sigue indicando la estación correcta aunque el plato ya no esté
# ahí. Es un fallo silencioso.
#
# Se usa delayed_gcode y no un {% for %} de Jinja porque el for se desenrolla al
# evaluar la macro y encola todos los avances de golpe; sin E-stop solo podrían
# pararse con M112 o cortando la corriente. Con un temporizador que se reprograma,
# INDEX_DEMO_STOP lo desarma y la demo termina tras el avance en curso.
#
# La espera es un G4 explícito y el temporizador se reprograma con un DURATION
# mínimo. DURATION corre en paralelo al movimiento (actúa como periodo, no como
# pausa): medido, intervalo = max(ESPERA, tiempo_de_avance + 0.26 s).
#
# Si INDEX_NEXT falla (home perdido, ciclo en marcha, cualquier error), el tick
# aborta antes de reprogramarse y la demo se detiene. Cada tick revalida las
# guardas de INDEX_NEXT.

[gcode_macro INDEX_DEMO]
description: Prueba: avanza una estacion, espera y sigue. Parar con INDEX_DEMO_STOP
variable_restantes: 0
variable_espera: 1.0
variable_velocidad: 15.0
# 0 = usar el accel de printer.cfg.
variable_aceleracion: 0
gcode:
    {% set running = printer['gcode_macro _CYCLE_STATE'].running | default(0) | int %}
    {% if running == 1 %}
        { action_raise_error("Ciclo en marcha: pulsa STOP antes de lanzar la demo del carrusel.") }
    {% endif %}

    {% set st = printer['gcode_macro _INDEX'] %}
    {% if st.homed | int != 1 %}
        { action_raise_error("El carrusel no tiene HOME: haz INDEX_HOME antes de lanzar la demo.") }
    {% endif %}

    {% set pasos = params.PASOS     | default(st.estaciones) | int %}
    {% set esp   = params.ESPERA    | default(1.0) | float %}
    {% set v     = params.VELOCIDAD | default(printer.configfile.settings['manual_stepper index'].velocity) | float %}
    # El techo de ACEL lo valida _INDEX_AVANZAR.
    {% set a     = params.ACEL      | default(0)   | float %}

    {% if pasos < 0 %}
        { action_raise_error("PASOS no puede ser negativo (recibido: " ~ pasos ~ "). PASOS=0 significa CONTINUO.") }
    {% endif %}
    # Espera mínima de 0.1 s: con 0 la demo sería prácticamente imposible de parar.
    {% if esp < 0.1 %}
        { action_raise_error("ESPERA minima 0.1 s (recibido: " ~ esp ~ "). Con esperas de 0 la demo no se puede parar a tiempo.") }
    {% endif %}
    {% if v <= 0 %}
        { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
    {% endif %}

    # restantes = -1 indica modo continuo (el tick no decrementa).
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=restantes VALUE={ -1 if pasos == 0 else pasos }
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=espera      VALUE={esp}
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=velocidad   VALUE={v}
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=aceleracion VALUE={a}

    {% if pasos == 0 %}
        M118 Demo del carrusel: CONTINUO, {esp} s en cada estacion a {v} grados/s. Parar con INDEX_DEMO_STOP.
    {% else %}
        M118 Demo del carrusel: {pasos} avance(s), {esp} s en cada estacion a {v} grados/s. Parar con INDEX_DEMO_STOP.
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_INDEX_DEMO_TICK DURATION=0.1


# --- Un avance de la demo (interna, se reprograma sola) ---
[delayed_gcode _INDEX_DEMO_TICK]
initial_duration: 0
gcode:
    {% set d = printer['gcode_macro INDEX_DEMO'] %}
    {% set r = d.restantes | int %}
    {% if r != 0 %}
        INDEX_NEXT VELOCIDAD={ d.velocidad } ACEL={ d.aceleracion | float if (d.aceleracion | float) > 0 else printer.configfile.settings['manual_stepper index'].accel }
        {% if r > 0 %}
            SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=restantes VALUE={ r - 1 }
        {% endif %}
        # Espera con el plato ya parado (G4 + M400, no DURATION; ver nota arriba).
        G4 P{ ((d.espera | float) * 1000) | round | int }
        M400
        UPDATE_DELAYED_GCODE ID=_INDEX_DEMO_TICK DURATION=0.05
    {% else %}
        M118 Demo del carrusel terminada.
    {% endif %}


# --- Parar la demo ---
[gcode_macro INDEX_DEMO_STOP]
description: Detiene la demo del carrusel al terminar la estacion en curso
gcode:
    # Doble cierre: si el tick está a mitad de un avance se reprogramará al
    # terminar, pero con restantes=0 el siguiente tick no mueve nada.
    SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=restantes VALUE=0
    UPDATE_DELAYED_GCODE ID=_INDEX_DEMO_TICK DURATION=0
    M118 Demo del carrusel detenida (termina el avance en curso y no sigue).


# --- Cambiar parámetros de la demo en marcha ---
# Los cambios entran en el avance siguiente y no reinician el contador de PASOS.
# También sirve con la demo parada, para dejar preparados los valores.
[gcode_macro INDEX_DEMO_SET]
description: Cambia VELOCIDAD y/o ESPERA de la demo en marcha, sin cortarla
gcode:
    {% if 'VELOCIDAD' not in params and 'ESPERA' not in params and 'ACEL' not in params %}
        { action_raise_error("Nada que cambiar. Uso: INDEX_DEMO_SET VELOCIDAD=25 [ESPERA=0.5] [ACEL=800]") }
    {% endif %}

    {% if 'VELOCIDAD' in params %}
        {% set v    = params.VELOCIDAD | float %}
        {% set vmax = printer['gcode_macro _INDEX'].vel_max | float %}
        {% if v <= 0 %}
            { action_raise_error("VELOCIDAD debe ser mayor que 0 (recibido: " ~ v ~ ").") }
        {% endif %}
        # Se valida aquí además de en _INDEX_AVANZAR: de lo contrario el error
        # saldría en el tick siguiente, dentro de un delayed_gcode, desvinculado
        # del comando que lo causó.
        {% if v > vmax %}
            { action_raise_error("VELOCIDAD " ~ v ~ " grados/s pasa del techo de " ~ vmax ~ " (variable_vel_max en _INDEX). No se ha cambiado nada.") }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=velocidad VALUE={v}
        M118 Demo: velocidad -> {v} grados/s (entra en el avance siguiente).
    {% endif %}

    {% if 'ESPERA' in params %}
        {% set e = params.ESPERA | float %}
        {% if e < 0.1 %}
            { action_raise_error("ESPERA minima 0.1 s (recibido: " ~ e ~ "). Con esperas de 0 la demo no se puede parar a tiempo.") }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=espera VALUE={e}
        M118 Demo: espera -> {e} s (entra en el avance siguiente).
    {% endif %}

    {% if 'ACEL' in params %}
        {% set a    = params.ACEL | float %}
        {% set amax = printer['gcode_macro _INDEX'].acel_max | float %}
        {% if a < 0 %}
            { action_raise_error("ACEL no puede ser negativa (recibido: " ~ a ~ "). ACEL=0 significa 'usar el accel de printer.cfg'.") }
        {% endif %}
        {% if a > amax %}
            { action_raise_error("ACEL " ~ a ~ " grados/s^2 pasa del techo de " ~ amax ~ " (variable_acel_max en _INDEX). No se ha cambiado nada.") }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDEX_DEMO VARIABLE=aceleracion VALUE={a}
        {% if a == 0 %}
            M118 Demo: aceleracion -> la de printer.cfg (entra en el avance siguiente).
        {% else %}
            M118 Demo: aceleracion -> {a} grados/s^2 (entra en el avance siguiente).
        {% endif %}
    {% endif %}
